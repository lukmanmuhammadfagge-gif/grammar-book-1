h><\/tr><tr><td>call<\/td><td>kira<\/td><td>message<\/td><td>saƙo<\/td><\/tr><tr><td>speak<\/td><td>yi magana<\/td><td>phone number<\/td><td>lambar waya<\/td><\/tr><tr><td>answer the phone<\/td><td>ɗaga waya<\/td><td>Hold on.<\/td><td>Jira ɗan lokaci.<\/td><\/tr><tr><td>bad network<\/td><td>matsalar sadarwa<\/td><td>I am sorry.<\/td><td>Yi haƙuri.<\/td><\/tr><\/table><\/div><p>Exercise 15I: Practice Complete the sentences with the correct word: Could, at, message, or called.<br>1. ___ I speak to Musa, please?<br>2. He is not ___ home.<br>3. Can I take a ___?<br>4. Please tell him I ___ (past tense of call).<\/p><h2>15.10 The Weather<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Aisha: It is very hot today.<\/td><td>Aisha: Yau ana zafi sosai.<\/td><\/tr><tr><td>Musa: Yes. It was hot yesterday too.<\/td><td>Musa: Ee. Jiya ma ana zafi.<\/td><\/tr><tr><td>Aisha: Will it rain tomorrow?<\/td><td>Aisha: Za a yi ruwan sama gobe?<\/td><\/tr><tr><td>Musa: I think so. The sky is cloudy.<\/td><td>Musa: Ina tsammani haka. Sama ta yi girgije.<\/td><\/tr><tr><td>Aisha: Good. Farmers need the rain.<\/td><td>Aisha: To. Manoma suna buƙatar ruwan sama.<\/td><\/tr><tr><td>Musa: Yes. Rain is good for the crops.<\/td><td>Musa: Ee. Ruwan sama yana da amfani ga amfanin gona.<\/td><\/tr><\/table><\/div>", "<p>Useful vocabulary<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>hot<\/td><td>zafi<\/td><td>cold<\/td><td>sanyi<\/td><\/tr><tr><td>rain<\/td><td>ruwan sama<\/td><td>sun<\/td><td>rana<\/td><\/tr><tr><td>wind<\/td><td>iska<\/td><td>cloud<\/td><td>girgije<\/td><\/tr><tr><td>dry season<\/td><td>rani<\/td><td>rainy season<\/td><td>damina<\/td><\/tr><\/table><\/div><p>Exercise 15J: Practice Write is, was, or will.<br>1. It ___ hot today.<br>2. It ___ cold yesterday.<br>3. It ___ rain tomorrow.<br>4. ___ it rain tomorrow? (write the word that begins the question)<\/p><h2>15.11 Making Requests and Asking for Help<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Musa: Excuse me, madam. Could you help me, please?<\/td><td>Musa: Don Allah, hajiya. Za ki iya taimaka mini?<\/td><\/tr><tr><td>Woman: Yes. What do you need?<\/td><td>Mace: Ee. Me kake buƙata?<\/td><\/tr><tr><td>Musa: I cannot find the bus station.<\/td><td>Musa: Ban iya gano tashar mota ba.<\/td><\/tr><tr><td>Woman: It is behind the market. Do you want me to show you?<\/td><td>Mace: Yana bayan kasuwa. Kana so in nuna maka?<\/td><\/tr><tr><td>Musa: Yes, please. Thank you very much.<\/td><td>Musa: Ee, don Allah. Na gode sosai.<\/td><\/tr><tr><td>Woman: No problem.<\/td><td>Mace: Babu komai.<\/td><\/tr><\/table><\/div>", "<p>Useful vocabulary<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>help<\/td><td>taimako / taimaka<\/td><td>need<\/td><td>buƙata<\/td><\/tr><tr><td>find<\/td><td>gano / samu<\/td><td>show<\/td><td>nuna<\/td><\/tr><tr><td>bus station<\/td><td>tashar mota<\/td><td>Please.<\/td><td>Don Allah.<\/td><\/tr><tr><td>Excuse me.<\/td><td>Don Allah. (to get attention)<\/td><td>No problem.<\/td><td>Babu komai.<\/td><\/tr><\/table><\/div><p>Exercise 15K: Practice Write a polite request with “Could you … , please?”<br>1. open the door<br>2. show me the way<br>3. carry this bag<\/p><h2>15.12 Everyday Plans and Activities<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Aisha: What are you doing this weekend?<\/td><td>Aisha: Me za ka yi a ƙarshen mako?<\/td><\/tr><tr><td>Musa: I am going to visit my uncle in Kaduna.<\/td><td>Musa: Zan ziyarci kawuna a Kaduna.<\/td><\/tr><tr><td>Aisha: How will you travel?<\/td><td>Aisha: Yaya za ka yi tafiya?<\/td><\/tr><tr><td>Musa: I will go by bus on Saturday morning.<\/td><td>Musa: Zan tafi da bas ranar Asabar da safe.<\/td><\/tr><tr><td>Aisha: When will you come back?<\/td><td>Aisha: Yaushe za ka dawo?<\/td><\/tr><tr><td>Musa: I will come back on Sunday evening.<\/td><td>Musa: Zan dawo ranar Lahadi da yamma.<\/td><\/tr><tr><td>Aisha: Have a good trip.<\/td><td>Aisha: Allah ya kai ka lafiya.<\/td><\/tr><\/table><\/div>", "<p>Useful vocabulary<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>weekend<\/td><td>ƙarshen mako<\/td><td>visit<\/td><td>ziyarta<\/td><\/tr><tr><td>travel<\/td><td>yi tafiya<\/td><td>come back<\/td><td>dawo<\/td><\/tr><tr><td>uncle<\/td><td>kawu / baffa<\/td><td>plan<\/td><td>shiri<\/td><\/tr><tr><td>trip<\/td><td>tafiya<\/td><td>Have a good trip.<\/td><td>Allah ya kai ka lafiya.<\/td><\/tr><\/table><\/div><p>Exercise 15L: Practice Complete the sentences with the correct form.<br>1. I ___ (visit) my uncle on Saturday. (use going to)<br>2. We ___ (travel) by bus. (use will)<br>3. When ___ you come back? (use will)<br>4. She is ___ to cook rice tonight.<\/p><h2>15.13 Role-Play<\/h2><p>Exercise 15M: Role-play Work with a friend. Choose three of the dialogues in this chapter. Act them out, but change the names, the places, and the things (for example, change “tomatoes” to “onions”, or “Kaduna” to another town). Then write one of your new dialogues in your notebook.<\/p><h2>15.14 Chapter Summary<\/h2><p>• Greet people politely and introduce yourself with simple, complete sentences.<\/p><p>• Use the present simple for facts and routines, the past for finished actions, and will or going to for plans.<\/p><p>• Use could and please to make polite requests.<\/p>", "<p>• Learn useful words in groups: family, school, shopping, work, directions, telephone, weather, and plans.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Taƙaitawa: A gaisa cikin ladabi, a gabatar da kai da cikakkun jimloli masu sauƙi; a yi amfani da simple present don abin da ake yi kullum, simple past don abin da ya wuce, will ko going to don shirye-shirye; a yi amfani da could da please don roƙo cikin ladabi; sannan a koyi kalmomi ta rukuni: iyali, makaranta, kasuwa, aiki, hanya, waya, yanayi, da shirye-shirye.<\/div><h2>15.15 Review Questions<\/h2><p>1. Write three sentences to introduce yourself.<br>2. Which greeting do we use at 8 a.m. and which at 7 p.m.?<br>3. How do we ask politely for help? Give one example.<br>4. Make a question to ask someone the price of a bag of rice.<br>5. How do you say “Please reduce the price” and “Please give me a receipt” in English?<\/p>", "<h2>Essential English–Hausa Vocabulary<\/h2><p>Kalmomi Masu Muhimmanci Many English words have more than one Hausa meaning, depending on the sentence. This list gives the most common meaning for a beginner. A mark means: please confirm with a native-speaking Hausa grammar teacher.<\/p><h2>Greetings and Polite Words<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>hello<\/td><td>sannu<\/td><td>good morning<\/td><td>ina kwana<\/td><\/tr><tr><td>good afternoon<\/td><td>barka da rana<\/td><td>good evening<\/td><td>barka da yamma<\/td><\/tr><tr><td>goodbye / see you later<\/td><td>sai an jima<\/td><td>please<\/td><td>don Allah<\/td><\/tr><tr><td>thank you<\/td><td>na gode<\/td><td>sorry<\/td><td>yi haƙuri<\/td><\/tr><tr><td>welcome<\/td><td>barka da zuwa<\/td><td>yes<\/td><td>ee<\/td><\/tr><tr><td>no<\/td><td>a’a<\/td><td>How are you?<\/td><td>Kana lafiya?<\/td><\/tr><\/table><\/div><h2>People and Family<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>man<\/td><td>namiji<\/td><td>woman<\/td><td>mace<\/td><\/tr><tr><td>boy<\/td><td>yaro<\/td><td>girl<\/td><td>yarinya<\/td><\/tr><tr><td>friend<\/td><td>aboki<\/td><td>neighbour<\/td><td>maƙwabci<\/td><\/tr><tr><td>teacher<\/td><td>malami<\/td><td>student<\/td><td>ɗalibi<\/td><\/tr><tr><td>farmer<\/td><td>manomi<\/td><td>trader<\/td><td>ɗan kasuwa<\/td><\/tr><tr><td>driver<\/td><td>direba<\/td><td>doctor<\/td><td>likita<\/td><\/tr><tr><td>family<\/td><td>iyali<\/td><td>father<\/td><td>mahaifi / baba<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>mother<\/td><td>mahaifiya / uwa<\/td><td>parents<\/td><td>iyaye<\/td><\/tr><tr><td>brother<\/td><td>ɗan’uwa<\/td><td>sister<\/td><td>’yar’uwa<\/td><\/tr><\/table><\/div><h2>Numbers<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>one<\/td><td>ɗaya<\/td><td>two<\/td><td>biyu<\/td><\/tr><tr><td>three<\/td><td>uku<\/td><td>four<\/td><td>huɗu<\/td><\/tr><tr><td>five<\/td><td>biyar<\/td><td>six<\/td><td>shida<\/td><\/tr><tr><td>seven<\/td><td>bakwai<\/td><td>eight<\/td><td>takwas<\/td><\/tr><tr><td>nine<\/td><td>tara<\/td><td>ten<\/td><td>goma<\/td><\/tr><tr><td>twenty<\/td><td>ashirin<\/td><td>one hundred<\/td><td>ɗari<\/td><\/tr><tr><td>one thousand<\/td><td>dubu<\/td><td>first<\/td><td>na farko<\/td><\/tr><\/table><\/div><h2>Days and Months<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Monday<\/td><td>Litinin<\/td><td>Tuesday<\/td><td>Talata<\/td><\/tr><tr><td>Wednesday<\/td><td>Laraba<\/td><td>Thursday<\/td><td>Alhamis<\/td><\/tr><tr><td>Friday<\/td><td>Juma’a<\/td><td>Saturday<\/td><td>Asabar<\/td><\/tr><tr><td>Sunday<\/td><td>Lahadi<\/td><td>January<\/td><td>Janairu<\/td><\/tr><tr><td>February<\/td><td>Fabrairu<\/td><td>March<\/td><td>Maris<\/td><\/tr><tr><td>April<\/td><td>Afrilu<\/td><td>May<\/td><td>Mayu<\/td><\/tr><tr><td>June<\/td><td>Yuni<\/td><td>July<\/td><td>Yuli<\/td><\/tr><tr><td>August<\/td><td>Agusta<\/td><td>September<\/td><td>Satumba<\/td><\/tr><tr><td>October<\/td><td>Oktoba<\/td><td>November<\/td><td>Nuwamba<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>December<\/td><td>Disamba<\/td><td>week<\/td><td>mako<\/td><\/tr><\/table><\/div><h2>Food and the Market<\/h /th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>go<\/td><td>tafi<\/td><td>come<\/td><td>zo<\/td><\/tr><tr><td>eat<\/td><td>ci<\/td><td>drink<\/td><td>sha<\/td><\/tr><tr><td>buy<\/td><td>saya<\/td><td>sell<\/td><td>sayar<\/td><\/tr><tr><td>work<\/td><td>yi aiki<\/td><td>study<\/td><td>yi karatu<\/td><\/tr><tr><td>read<\/td><td>karanta<\/td><td>write<\/td><td>rubuta<\/td><\/tr><tr><td>speak<\/td><td>yi magana<\/td><td>listen<\/td><td>saurara<\/td><\/tr><tr><td>see<\/td><td>gani<\/td><td>know<\/td><td>sani<\/td><\/tr><tr><td>want<\/td><td>so<\/td><td>need<\/td><td>buƙata<\/td><\/tr><tr><td>help<\/td><td>taimaka<\/td><td>cook<\/td><td>dafa<\/td><\/tr><tr><td>clean<\/td><td>share<\/td><td>sleep<\/td><td>yi barci<\/td><\/tr><tr><td>wait<\/td><td>jira<\/td><td>give<\/td><td>ba<\/td><\/tr><tr><td>take<\/td><td>ɗauka<\/td><td>open<\/td><td>buɗe<\/td><\/tr><tr><td>close<\/td><td>rufe<\/td><td>live<\/td><td>zauna<\/td><\/tr><tr><td>play<\/td><td>yi wasa<\/td><td>pay<\/td><td>biya<\/td><\/tr><tr><td>travel<\/td><td>yi tafiya<\/td><td>call<\/td><td>kira<\/td><\/tr><\/table><\/div>", "<h2>Common Adjectives and Colours<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>big<\/td><td>babba<\/td><td>small<\/td><td>ƙarami<\/td><\/tr><tr><td>new<\/td><td>sabo<\/td><td>old<\/td><td>tsoho<\/td><\/tr><tr><td>good<\/td><td>mai kyau<\/td><td>bad<\/td><td>mara kyau<\/td><\/tr><tr><td>hot<\/td><td>mai zafi<\/td><td>cold<\/td><td>mai sanyi<\/td><\/tr><tr><td>clean<\/td><td>mai tsabta<\/td><td>dirty<\/td><td>mai ƙazanta<\/td><\/tr><tr><td>expensive<\/td><td>mai tsada<\/td><td>cheap<\/td><td>mai araha<\/td><\/tr><tr><td>tall<\/td><td>dogo<\/td><td>short<\/td><td>gajere<\/td><\/tr><tr><td>easy<\/td><td>mai sauƙi<\/td><td>difficult<\/td><td>mai wuya<\/td><\/tr><tr><td>red<\/td><td>ja<\/td><td>white<\/td><td>fari<\/td><\/tr><tr><td>black<\/td><td>baƙi<\/td><td>green<\/td><td>kore<\/td><\/tr><tr><td>blue<\/td><td>shuɗi<\/td><td>yellow<\/td><td>rawaya<\/td><\/tr><\/table><\/div><h2>Time Words<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>today<\/td><td>yau<\/td><td>yesterday<\/td><td>jiya<\/td><\/tr><tr><td>tomorrow<\/td><td>gobe<\/td><td>morning<\/td><td>safiya<\/td><\/tr><tr><td>afternoon<\/td><td>rana<\/td><td>evening<\/td><td>yamma<\/td><\/tr><tr><td>night<\/td><td>dare<\/td><td>month<\/td><td>wata<\/td><\/tr><tr><td>year<\/td><td>shekara<\/td><td>now<\/td><td>yanzu<\/td><\/tr><tr><td>always<\/td><td>kullum<\/td><td>sometimes<\/td><td>wani lokaci<\/td><\/tr><\/table><\/div>", "<h2>Question Words and Prepositions<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>who<\/td><td>wa / wane<\/td><td>what<\/td><td>me / menene<\/td><\/tr><tr><td>where<\/td><td>ina<\/td><td>when<\/td><td>yaushe<\/td><\/tr><tr><td>why<\/td><td>me ya sa<\/td><td>how<\/td><td>yaya<\/td><\/tr><tr><td>which<\/td><td>wane / wace<\/td><td>how many / how much<\/td><td>nawa<\/td><\/tr><tr><td>in<\/td><td>a cikin<\/td><td>on<\/td><td>a kan<\/td><\/tr><tr><td>at<\/td><td>a<\/td><td>under<\/td><td>a ƙarƙashin<\/td><\/tr><tr><td>near<\/td><td>kusa da<\/td><td>between<\/td><td>tsakanin<\/td><\/tr><tr><td>behind<\/td><td>a bayan<\/td><td>in front of<\/td><td>a gaban<\/td><\/tr><tr><td>to<\/td><td>zuwa<\/td><td>from<\/td><td>daga<\/td><\/tr><tr><td>with<\/td><td>tare da<\/td><td>for<\/td><td>don<\/td><\/tr><tr><td>about<\/td><td>game da<\/td><td><\/td><td><\/td><\/tr><\/table><\/div><h2>Weather<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>rain<\/td><td>ruwan sama<\/td><td>sun<\/td><td>rana<\/td><\/tr><tr><td>wind<\/td><td>iska<\/td><td>cloud<\/td><td>girgije<\/td><\/tr><tr><td>dry season<\/td><td>rani<\/td><td>rainy season<\/td><td>damina<\/td><\/tr><\/table><\/div>", "<h2>Revision Exercises<\/h2><p>Atisayen Maimaitawa These exercises cover Chapters 1 to 15. Write your answers in a notebook. The answers are in the Answer Key.<\/p><p>Revision A (Chapter 1: Sentences and parts of speech)<br>1. Write the part of speech: teacher, quickly, in, she, big.<br>2. Correct: my name is musa and i live in kano<br>3. Write the subject and the verb: Aisha sells tomatoes.<br>4. Write the kind of sentence: (a) Close the door. (b) Where are you going?<\/p><p>Revision B (Chapters 2–3: Nouns and pronouns)<br>1. Write the plural: child, box, city, tomato.<br>2. Write the possessive form: the book of Musa.<br>3. Write much or many: How ___ rice? How ___ students?<br>4. Write the pronoun: Aisha is my sister. ___ is a nurse.<br>5. Write the pronoun: The teacher helps ___ (we).<br>6. Complete: This bag is ___ (she).<\/p><p>Revision C (Chapter 4: Am, is, are)<br>1. I ___ a student.<br>2. The shops ___ open.<br>3. Make negative: She is a farmer.<br>4. Make a question: They are at school.<br>5. ___ a shop near the school. (There is / There are)<\/p><p>Revision D (Chapter 5: Simple present and present continuous)<br>1. Musa (sell) maize every day.<br>2. She (not like) meat.<\/p>", "<p>3. ___ they live in Kano? 4. Look! The children (play) outside. 5. He (have) a shop.<\/p><p>Revision E (Chapters 6–7: Articles and adjectives)<br>1. She is ___ nurse.<br>2. I have ___ umbrella.<br>3. ___ sun is hot.<br>4. Musa is ___ (tall) than Aisha.<br>5. This is the ___ (good) book.<br>6. Put in order: bag / red / big / a<\/p><p>Revision F (Chapter 8: Prepositions)<br>1. The book is ___ the table.<br>2. We live ___ Kano.<br>3. School starts ___ eight o’clock.<br>4. We travel ___ bus.<br>5. I go ___ the market.<br>6. Correct: I go to home.<\/p><p>Revision G (Chapters 9–10: Questions and negatives)<br>1. Make a question: Musa sells rice.<br>2. ___ do you live? (Where / When)<br>3. Make negative: They eat meat.<br>4. Correct: I don’t have nothing.<br>5. How ___ rice do you want? (much / many)<br>6. Make a negative command: Be late.<\/p><p>Revision H (Chapters 11–12: Past and future)<br>1. Write the past: go, buy, study.<br>2. Make negative: She cooked rice.<\/p>", "<p>3. Make a question: They came early. 4. I (go) to the market tomorrow. 5. Make negative with the short form: She will come. 6. If it (rain), we will stay at home.<\/p><p>Revision I (Chapter 13: Can, could, should, must)<br>1. A fish ___ swim. (can / cans)<br>2. Students ___ wear a uniform. (a rule: must / should)<br>3. You ___ drink water. (advice: should / must)<br>4. Make a polite request: help me<br>5. Correct: She cans cook.<\/p><p>Revision J (Chapter 14: Common mistakes) Correct each sentence.<br>1. They was at school.<br>2. He don’t like rice.<br>3. Me and Musa are friends.<br>4. She is married with Musa.<br>5. I like very much rice.<br>6. The news are good.<\/p><p>Revision K (Chapter 15: Conversations)<br>1. Write the greeting for 7 p.m.<br>2. Complete: How ___ is a kilo of tomatoes?<br>3. Complete: Excuse me, ___ you help me, please? (could / must)<br>4. Write one sentence to give directions to a clinic.<br>5. Translate into English: Sunana Musa.<\/p><p>Revision L (Translation) Hausa to English: 1. Ina da sabuwar waya.<\/p>", "<p>2. Jiya sun je kasuwa. 3. Ba na sayar da kifi. 4. Za mu dafa shinkafa gobe. 5. Ya kamata ka sha ruwa. English to Hausa: 6. My father is a farmer. 7. The goat is under the tree. 8. Where do you live? (to a man) 9. She did not come. 10. You must not run in the class. (to a man)<\/p>", "<h2>Comprehensive Final Test<\/h2><p>Gwajin Ƙarshe Time: about 60 minutes. Total marks: 60. Write your answers in a notebook and check them with the Answer Key afterwards.<\/p><h2>Part A: Multiple Choice (20 marks)<\/h2><p>Choose the correct answer. One mark for each.<br>1. A noun is a word for: (a) an action (b) a person, place, or thing (c) a joining word<br>2. The plural of “city” is: (a) citys (b) cities (c) cityes<br>3. Which is correct? (a) Me and Musa go to school. (b) Musa and I go to school. (c) Musa and me goes to school.<br>4. They ___ at school yesterday. (a) was (b) were (c) are<br>5. She ___ rice every day. (a) cook (b) cooks (c) cooking<br>6. I have ___ umbrella. (a) a (b) an (c) the<br>7. Aisha is ___ than Fatima. (a) taller (b) more tall (c) tallest<br>8. The book is ___ the table. (a) in (b) at (c) on<br>9. Which is correct? (a) Where you live? (b) Where do you live? (c) Where does you live?<br>10. Which is correct? (a) He not sell fish. (b) He does not sell fish. (c) He does not sells fish.<br>11. I ___ to the market yesterday. (a) go (b) went (c) goed<br>12. Did you ___ him? (a) saw (b) see (c) seen<br>13. We ___ travel to Kano tomorrow. (a) will (b) wills (c) did<br>14. If it ___ tomorrow, we will stay at home. (a) will rain (b) rains (c) rained<br>15. A fish ___ swim. (a) cans (b) can (c) can to<br>16. You ___ run in the class. It is a school rule. (a) must not (b) should (c) can<\/p>", "<p>17. Which is the most polite? (a) Give me a pen. (b) Can you give me a pen? (c) Could you give me a pen, please? 18. This bag is ___. (a) my (b) mine (c) me 19. Which is correct? (a) She is married with Musa. (b) She is married to Musa. (c) She is married at Musa. 20. Which is correct? (a) I don’t have nothing. (b) I don’t have anything. (c) I no have anything.<\/p><h2>Part B: Fill in the Blanks (10 marks)<\/h2><p>Write one word, or the correct form of the word in brackets. One mark for each.<br>21. I ___ a student. (am / is / are)<br>22. There ___ two goats here. (is / are)<br>23. Musa (go) to school every day.<br>24. Look! The children (play) outside.<br>25. How ___ rice do you want? (much / many)<br>26. She is the ___ (tall) girl in the class.<br>27. We arrive ___ Kano at six. (in / on / at)<br>28. ___ you tired? (Make a question: Are / Do)<br>29. Yesterday she (buy) a new phone.<br>30. Students ___ wear a uniform. (must / can)<\/p><h2>Part C: Correct the Sentences (10 marks)<\/h2><p>Rewrite each sentence correctly. One mark for each.<br>31. She go to school.<br>32. He don’t like meat.<br>33. I am agree.<br>34. Did you saw Musa?<br>35. She is teacher.<\/p>", "<p>36. The childrens are at home. 37. I want a rice. 38. I go to home. 39. If it will rain, we will stay. 40. Me and Aisha are friends.<\/p><h2>Part D: Translation (10 marks)<\/h2><p>Hausa to English:<br>41. Sunana Musa.<br>42. Ina zuwa kasuwa.<br>43. Ba ta zo ba.<br>44. Za mu tafi gobe.<br>45. Ya kamata ka karanta littafin. English to Hausa:<br>46. The market is big.<br>47. We do not have eggs today.<br>48. Do you sell rice? (to a man)<br>49. Musa and Aisha are friends.<br>50. Please close the door. (to a man)<\/p><h2>Part E: Writing (10 marks)<\/h2><p>51. Write five sentences about yourself and your daily life. Use at least one simple present sentence, one past sentence, one future sentence, one negative sentence, and one question. (Two marks for each correct sentence.)<\/p><p>Scoring guide<\/p><div class=\"tw\"><table><tr><th>Score<\/th><th>What to do next<\/th><\/tr><tr><td>54–60<\/td><td>Excellent. You are ready for the next level.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Score<\/th><th>What to do next<\/th><\/tr><tr><td>45–53<\/td><td>Very good. Revise the chapters where you lost marks.<\/td><\/tr><tr><td>36–44<\/td><td>Good. Repeat the exercises for the weaker chapters.<\/td><\/tr><tr><td>30–35<\/td><td>Fair. Study the book again, chapter by chapter, and repeat the test later.<\/td><\/tr><tr><td>Below 30<\/td><td>Please study Chapters 1 to 15 again slowly, then take the test again.<\/td><\/tr><\/table><\/div>", "<h2>Complete Answer Key<\/h2><h2>Chapter 1 Answers<\/h2><p>Exercise 1A: 1 noun; 2 verb; 3 pronoun; 4 adjective; 5 adverb; 6 preposition; 7 conjunction; 8 noun; 9 verb; 10 adjective.<\/p><p>Exercise 1B: 1 ?; 2 .; 3 !; 4 .; 5 ?<\/p><p>Exercise 1C: 1 (b); 2 (b); 3 (b); 4 (b); 5 (b).<\/p><p>Exercise 1D: 1 My name is Musa. 2 I am a student. 3 He is a trader. (or: She is a trader.) 4 Where is the school? 5 We go to Kano on Friday.<\/p><p>Exercise 1E (sample answers): 1 The market is big. 2 Musa sells rice. 3 I have a new phone. 4 Where is the shop? Other correct sentences are acceptable.<\/p><p>Exercise 1F: 1 My name is Musa. 2 My father is a farmer. 3 The children are at school. 4 We buy yams at the market. 5 Fatima cooks rice. (or: Fatima is cooking rice.) 6 Kasuwa babba ce. 7 Musa yana sayar da tumatur. 8 Aisha tana sayen sababbin takalma. 9 Ina makarantar take? 10 Ina zuwa makaranta. Other natural Hausa or English wording is acceptable if the meaning is correct.<\/p><p>Exercise 1G (sample answer): My name is Ibrahim. I live in Kano. I am a student.<\/p><p>Review Questions: 1 Grammar is the set of rules for putting words together to make clear sentences. 2 The subject and the verb. 3 Noun, pronoun, verb, adjective, adverb, preposition, conjunction, interjection. 4 Sample: Statement: I go to the market. Question: Where are you going? Command: Close the door. Exclamation: What a big market! 5 Because English sentences need a subject; we must say “He is a farmer” or “She is a farmer”.<\/p>", "<h2>Chapter 2 Answers<\/h2><p>Exercise 2A: 1 farmer, maize, market; 2 Aisha, phone; 3 Kano, city; 4 brother, driver; 5 Honesty.<\/p><p>Exercise 2B: 1 common; 2 proper; 3 common; 4 proper; 5 common; 6 proper.<\/p><p>Exercise 2C: 1 books; 2 boxes; 3 babies; 4 children; 5 tomatoes; 6 days; 7 knives; 8 women; 9 churches; 10 sheep.<\/p><p>Exercise 2D: 1 much; 2 many; 3 much; 4 many; 5 much.<\/p><p>Exercise 2E: 1 Fatima’s; 2 teacher’s; 3 children’s; 4 brothers’.<\/p><p>Exercise 2F: 1 (b); 2 (b); 3 (b); 4 (b); 5 (b).<\/p><p>Exercise 2G: 1 I need some information. 2 The children are at school. 3 We bought new furniture. 4 Amina’s book is on the table. 5 He has three goats. 6 Nigeria is a big country.<\/p><p>Exercise 2H (sample answers): 1 Musa lives in Kano. 2 The shops are open. 3 I need some sugar. 4 This is Ibrahim’s phone.<\/p><p>Exercise 2I: 1 The farmer sells maize in the market. 2 Aisha’s phone is new. 3 The teacher has many books. 4 I want some water. (or: I want a little water.) 5 Kano is a big city. 6 Makarantar yara tana kusa. 7 Muna buƙatar sukari kaɗan. 8 Shagunan a buɗe suke. 9 Mahaifiyata tana da awaki biyu. 10 Gaskiya abu ne mai kyau. Other natural wording is acceptable if the meaning is correct.<\/p><p>Exercise 2J (sample answer): two bags of rice, three bottles of oil, five tomatoes, one bag of sugar, four onions.<\/p><p>Review Questions: 1 A noun names a person, place, thing, animal, or idea. Examples: teacher, market, book, goat, honesty. 2 A common noun names any one of a kind (city); a proper noun names one particular person, place, or thing and begins with a capital letter (Kano). 3 families, buses, men. 4 Because “information” is<\/p>", "<p>uncountable and has no plural form. 5 We add ’s to the owner (Musa’s bag), or only ’ after a plural noun ending in -s (the farmers’ market).<\/p><h2>Chapter 3 Answers<\/h2><p>Exercise 3A: 1 He; 2 She; 3 It; 4 We; 5 They.<\/p><p>Exercise 3B: 1 I; 2 us; 3 them; 4 She; 5 him.<\/p><p>Exercise 3C: 1 my; 2 his; 3 their; 4 our; 5 its; 6 your.<\/p><p>Exercise 3D: 1 mine; 2 hers; 3 theirs; 4 ours; 5 yours.<\/p><p>Exercise 3E: 1 This; 2 That; 3 These; 4 Those; 5 These.<\/p><p>Exercise 3F: 1 (b); 2 (b); 3 (b); 4 (b); 5 (c).<\/p><p>Exercise 3G: 1 Musa is my brother. He is a farmer. 2 Aisha and I are friends. 3 This is her bag. 4 The goat eats its food. 5 The teacher helps us. 6 That is my phone.<\/p><p>Exercise 3H: 1 This book is mine. 2 She sells fish in the market. 3 Our school is big. 4 We like them. 5 That shop is his. 6 Wannan jakata ce. 7 Waɗancan awakinsu ne. 8 Ina ganinta. 9 Littafinka yana kan tebur. 10 Wayar tata ce. Other natural wording is acceptable if the meaning is correct.<\/p><p>Exercise 3I (sample answer): My father is a farmer. His farm is big. My mother is a trader. Her shop is in the market. Our house is near the school.<\/p><p>Review Questions: 1 A pronoun takes the place of a noun. We use pronouns so that we do not repeat the same noun. 2 me, him, her, us, them. 3 “My” comes before a noun (my book); “mine” stands alone (the book is mine). 4 “Its” shows possession (its food); “it’s” means “it is”. 5 We use “these” for more than one thing near us, and “those” for more than one thing far from us.<\/p>", "<h2>Chapter 4 Answers<\/h2><p>Exercise 4A: 1 am; 2 is; 3 are; 4 are; 5 is; 6 are; 7 are; 8 is.<\/p><p>Exercise 4B: 1 I’m; 2 She’s; 3 They’re; 4 We’re; 5 It’s; 6 You’re.<\/p><p>Exercise 4C: 1 I am not a driver. 2 Musa is not at home. (or: Musa isn’t at home.) 3 They are not farmers. (or: They aren’t farmers.) 4 The market is not big. (or: The market isn’t big.) 5 We are not late. (or: We aren’t late.)<\/p><p>Exercise 4D: 1 Are you a student? 2 Is Aisha at school? 3 Are they in the shop? 4 Is the food hot? 5 Is Musa your brother?<\/p><p>Exercise 4E: 1 is; 2 am; 3 are; 4 is; 5 are.<\/p><p>Exercise 4F: 1 There is; 2 There are; 3 There is; 4 There are.<\/p><p>Exercise 4G: 1 (b); 2 (c); 3 (b); 4 (a); 5 (b).<\/p><p>Exercise 4H: 1 He is a teacher. 2 I am a trader. 3 They are at school. 4 Musa and Aisha are friends. 5 The market is big. 6 I agree.<\/p><p>Exercise 4I (sample answers): 1 I am a student. 2 My mother is a trader. 3 My friends are kind. 4 Is your brother at home? 5 The shop is not open.<\/p><p>Exercise 4J: 1 I am a student. 2 My mother is a teacher. 3 They are in the mosque. 4 Musa is not at home. 5 Are you tired? 6 Ɗan’uwana direba ne. 7 Maƙwabta ne mu. 8 Ɗaliban suna cikin aji. 9 Ba manomiya ba ce. 10 Kasuwar babba ce? Other natural wording is acceptable if the meaning is correct. A woman would say “Ni ɗaliba ce” for 4J item 1.<\/p><p>Exercise 4K: A: Good morning. What is your name? B: My name is Amina. A: Are you a student? B: Yes, I am.<\/p><p>Review Questions: 1 “Am”. 2 Negative: They are not farmers. Question: Are they farmers? 3 The verb “is” is missing. Correct: He is a<\/p>", "<p>teacher. 4 Yes, he is. / No, he is not. 5 “There is” for one thing or an uncountable noun; “there are” for more than one thing.<\/p><h2>Chapter 5 Answers<\/h2><p>Exercise 5A: 1 works; 2 goes; 3 studies; 4 watches; 5 plays; 6 has; 7 teaches; 8 buys; 9 carries; 10 reads.<\/p><p>Exercise 5B: 1 sells; 2 live; 3 cooks; 4 go; 5 studies; 6 opens; 7 have; 8 lays.<\/p><p>Exercise 5C: 1 I do not sell fish. (or: I don’t sell fish.) 2 She does not work in Kano. 3 They do not eat meat. 4 Musa does not go to school on Friday. 5 We do not have a car.<\/p><p>Exercise 5D: 1 Do you sell rice? 2 Does Musa work here? 3 Do they live in Kano? 4 Does she teach English? 5 Does he have a bicycle?<\/p><p>Exercise 5E: 1 do; 2 does; 3 do; 4 does; 5 do.<\/p><p>Exercise 5F: 1 Musa always goes to school. 2 She is never late. 3 I usually eat rice in the evening. 4 They sometimes visit us on Sunday. 5 We often go to the market on Friday.<\/p><p>Exercise 5G: 1 (b); 2 (b); 3 (b); 4 (b); 5 (b).<\/p><p>Exercise 5H: 1 He sells rice. 2 She goes to school. 3 Musa doesn’t work on Friday. (or: Musa does not work on Friday.) 4 Does she sell fish? 5 They study English. 6 He has a shop.<\/p><p>Exercise 5I (sample answers): 1 I get up at six o’clock. I go to school at eight. 2 My father always works on the farm. 3 My brother does not sell fish. 4 Do you live in Kano? 5 Hens lay eggs.<\/p><p>Exercise 5J: 1 My father works on a farm. 2 A hen lays eggs. 3 He does not sell fish. 4 They live in Kano. 5 When does the market open? 6 Musa yakan tashi da ƙarfe biyar. 7 Muna cin shinkafa kowace rana. 8 Ba ta dafa abinci da safe. 9 Kana sayar da shinkafa? 10 Awaki suna cin ciyawa. Other natural wording is acceptable if the meaning is correct.<\/p>", "<p>Exercise 5K (sample answer): I get up at six o’clock. I wash and eat breakfast. I go to the market at eight o’clock. I sell vegetables in the afternoon. I go home in the evening.<\/p><p>Exercise 5L: 1 are playing; 2 goes; 3 is walking; 4 cooks; 5 am not selling; 6 Is … working; 7 go; 8 are … doing.<\/p><p>Review Questions: 1 We use it for habits, facts, and permanent situations. Examples: I sell rice in the market. A hen lays eggs. 2 carries; watches; has. 3 After “does not” the verb has no -s. Correct: She does not like rice. 4 Do they live in Kano? Yes, they do. / No, they do not. 5 Before the main verb (Musa always sells fish), but after am/is/are (She is always late). 6 “I sell rice” is a habit or routine (I sell rice every day). “I am selling rice” is happening now.<\/p><h2>Chapter 6 Answers<\/h2><p>Exercise 6A: 1 an; 2 a; 3 an; 4 a; 5 an; 6 a; 7 an; 8 a; 9 an; 10 a.<\/p><p>Exercise 6B: 1 a; 2 The; 3 The; 4 an; 5 – (no article); 6 the; 7 an; 8 – (no article).<\/p><p>Exercise 6C: 1 (b); 2 (a); 3 (b); 4 (a); 5 (a).<\/p><p>Exercise 6D: 1 She is a teacher. 2 I have an umbrella. 3 He is a university student. 4 I want some rice. (or: I want rice.) 5 The sun is hot today. 6 We go to school every day. 7 He is an honest man.<\/p><p>Exercise 6E (sample answers): 1 My father is a driver. 2 I eat an orange every day. 3 I have a goat. The goat is white. 4 I like rice.<\/p><p>Exercise 6F: 1 He is a doctor. 2 I have an umbrella. 3 The teacher is in the class. 4 I like rice. 5 The sun is hot. 6 Ita malama ce. 7 Ina son lemu. 8 Ina kasuwar take? 9 Manoma suna noman masara. 10 Don Allah ka rufe ƙofar. Other natural wording is acceptable if the meaning is correct.<\/p>", "<p>Exercise 6G (sample answer): I live in a small house. The house has an old door. There is a bed in the room. The bed is clean.<\/p><p>Review Questions: 1 A, an, and the. 2 “Hour” begins with a vowel sound (the h is silent), so we say “an hour”. “University” begins with a “yoo” sound, which is a consonant sound, so we say “a university”. 3 When the speaker and the listener both know which thing is meant, because it was already mentioned, it is the only one, or the situation makes it clear. 4 I want some rice. (or: I want rice.) “Rice” is uncountable, so we do not use “a”. 5 Sample: general plurals (Farmers grow maize); names of people and places (Musa lives in Kano); languages; meals; days; fixed phrases such as go to school.<\/p><h2>Chapter 7 Answers<\/h2><p>Exercise 7A: 1 new; 2 big, busy; 3 small; 4 cold; 5 tall, kind.<\/p><p>Exercise 7B: 1 a new phone; 2 a white goat; 3 a big market; 4 a clean room; 5 a red bag.<\/p><p>Exercise 7C: 1 a big red bag; 2 a new black phone; 3 a small old car; 4 a big white goat; 5 a nice new house.<\/p><p>Exercise 7D: 1 taller, tallest; 2 bigger, biggest; 3 happier, happiest; 4 cheaper, cheapest; 5 more expensive, most expensive; 6 better, best; 7 worse, worst; 8 easier, easiest.<\/p><p>Exercise 7E: 1 taller; 2 cheaper; 3 more expensive; 4 bigger; 5 better.<\/p><p>Exercise 7F: 1 tallest; 2 best; 3 most expensive; 4 happiest; 5 biggest.<\/p><p>Exercise 7G: 1 (b); 2 (b); 3 (b); 4 (b); 5 (b).<\/p><p>Exercise 7H: 1 Aisha is taller than Fatima. 2 This is better than that. 3 Musa is taller than Aisha. 4 She has a big red bag. 5 He is the tallest boy. 6 She has an expensive phone.<\/p>", "<p>Exercise 7I (sample answers): 1 My house is small and clean. 2 My brother is older than my sister. 3 This is the best shop in the market. 4 Is your phone new? 5 Kano is a big, busy, and old city.<\/p><p>Exercise 7J: 1 I have a new phone. 2 The market is big. 3 The room is clean. 4 Musa is taller than Aisha. 5 This is the best book. 6 Ina da ƙaramin shago. 7 Ruwan yana da sanyi. 8 Wannan wayar ta fi wancan tsada. 9 Aisha tana da babbar baƙar jaka. 10 Shinkafa ta fi nama araha. Other natural wording is acceptable if the meaning is correct.<\/p><p>Exercise 7K (sample answer): My best friend is a kind, tall, and funny boy. He has a big smile. He is older than me, and he is the most helpful person in my class.<\/p><p>Review Questions: 1 An adjective describes a noun. Examples: big, new, clean. 2 Before a noun (a big house) or after be (The house is big). 3 a big red bag. 4 good: better, best; expensive: more expensive, most expensive. 5 “More” and “-er” are both used. The correct form is “taller”.<\/p><h2>Chapter 8 Answers<\/h2><p>Exercise 8A: 1 on; 2 in; 3 at; 4 in; 5 on; 6 at; 7 in; 8 at.<\/p><p>Exercise 8B: 1 at; 2 on; 3 in; 4 in; 5 at; 6 on; 7 in; 8 at.<\/p><p>Exercise 8C: 1 to; 2 from; 3 into; 4 out of; 5 across.<\/p><p>Exercise 8D: 1 with; 2 by; 3 for; 4 about; 5 with; 6 without.<\/p><p>Exercise 8E: 1 to; 2 at; 3 for; 4 at; 5 in; 6 in.<\/p><p>Exercise 8F: 1 (b); 2 (b); 3 (b); 4 (b); 5 (c).<\/p><p>Exercise 8G: 1 He is at school. 2 I go home. 3 We arrive in Kano. 4 I see you on Friday. 5 She listens to the teacher. 6 I am interested in farming. 7 We travel by bus. 8 The book is on the table.<\/p><p>Exercise 8H (sample answers): 1 The goat is under the tree. 2 The shop is between the bank and the school. 3 I go to the market on<\/p>", "<p>Saturday. 4 Where is the book? (or: Where is the pen on the table?) 5 My father goes to work by bus.<\/p><p>Exercise 8I: 1 The book is on the table. 2 The shop is near the mosque. 3 I go to the market on Saturday. 4 We travel by bus. 5 This food is for the children. 6 Akuyar tana ƙarƙashin bishiya. 7 Musa yana aiki daga Litinin zuwa Juma’a. 8 Tana makaranta. 9 Muna wasan ƙwallon ƙafa bayan makaranta. 10 Don Allah ka kalli allo. Other natural wording is acceptable if the meaning is correct.<\/p><p>Exercise 8J (sample answer): My shop is small. The goods are on the shelf. The box is under the table. The door is near the road.<\/p><p>Exercise 8K (sample answer): Go to the main road. Walk across the road, and turn left at the mosque. The market is near the bank. It is next to the pharmacy.<\/p><p>Review Questions: 1 A preposition shows place, time, direction, or relationship. Examples: in, on, at, under, to, from, with. 2 “In” is for inside a space or town (in the bag, in Kano); “on” is for a surface (on the table); “at” is for a point or known place (at school, at the gate). 3 “At” with clock times, “on” with days, “in” with months. 4 After “go” we do not use “to” with “home”. Correct: I go home. 5 by; to.<\/p><h2>Chapter 9 Answers<\/h2><p>Exercise 9A: 1 Are you tired? 2 Does Musa sell rice? 3 Do they live in Kano? 4 Is the market big? 5 Does Aisha have a phone? 6 Are we late?<\/p><p>Exercise 9B: 1 Who; 2 What; 3 Where; 4 When; 5 Why; 6 How; 7 Whose; 8 How many; 9 How much; 10 Which.<\/p><p>Exercise 9C: 1 Where do you live? 2 What does Musa sell? 3 When does the market open? 4 Who is he? 5 Why are you late?<\/p><p>Exercise 9D: 1 What does Musa sell? 2 Where does Aisha live? 3 What time does the market open? (or: When does the market open?) 4 Who sells rice? 5 How do they go to school?<\/p>", "<p>Exercise 9E: 1 Yes, he is. 2 No, she does not. 3 Yes, they are. 4 No, I do not. 5 No, it is not.<\/p><p>Exercise 9F: 1 (b); 2 (b); 3 (b); 4 (b); 5 (b).<\/p><p>Exercise 9G: 1 Are you a student? 2 Where do you live? 3 What do you sell? 4 Where does he live? 5 Why are you late? 6 How much rice do you want? 7 Are you tired?<\/p><p>Exercise 9H: What; Where; Are; What.<\/p><p>Exercise 9I (sample answers): 1 Do you live in Kano? 2 Where is the market? 3 How many goats do you have? 4 Why are you late? 5 What is your name? Where do you live?<\/p><p>Exercise 9J: 1 Do you sell rice? 2 Where do you live? 3 When does the market open? 4 Why are you tired? 5 How much is this bag? 6 Wane ne malaminka? 7 Me kake sayarwa? 8 Ina makarantar take? 9 Kana son shinkafa ko wake? 10 Shekarunka nawa? Other natural wording is acceptable if the meaning is correct.<\/p><p>Exercise 9K (sample answer): What is your name? Where do you live? Do you like English? How do you go to school? Why do you study English?<\/p><p>Review Questions: 1 Yes/no questions and question-word questions. 2 Does she work in Kano? 3 The word order is wrong. Correct: Where do you live? 4 “How much” for uncountable nouns and prices; “how many” for countable nouns. 5 Because “who” is the subject, so we do not use “does”.<\/p><h2>Chapter 10 Answers<\/h2><p>Exercise 10A: 1 I am not a driver. 2 The market is not big. 3 They are not at school. 4 This bag is not mine. 5 We are not farmers.<\/p>", "<p>Exercise 10B: 1 She does not sell fish. 2 They do not live in Kano. 3 I do not like meat. 4 Musa does not work on Friday. 5 We do not have a car. 6 The shop does not open on Sunday.<\/p><p>Exercise 10C: 1 don’t; 2 doesn’t; 3 isn’t; 4 aren’t; 5 I’m not.<\/p><p>Exercise 10D: 1 doesn’t; 2 aren’t; 3 don’t; 4 isn’t; 5 don’t.<\/p><p>Exercise 10E: 1 Do not run in the class. 2 Do not forget your book. 3 Do not be late. 4 Do not make noise. 5 Do not open the door.<\/p><p>Exercise 10F: 1 I do not want anything. 2 There is no water. 3 She does not see anyone. 4 We do not have any eggs. 5 He is never late.<\/p><p>Exercise 10G: 1 (b); 2 (b); 3 (a); 4 (b); 5 (b).<\/p><p>Exercise 10H: 1 He does not sell fish. 2 She doesn’t sell fish. 3 I do not have a phone. 4 I don’t have anything. (or: I have nothing.) 5 They are not farmers. 6 I do not agree. 7 She doesn’t like rice. 8 Nobody knows the answer.<\/p><p>Exercise 10I (sample answers): 1 My brother is not at home. 2 She does not eat meat. 3 Do not open the door. 4 I never sleep in the afternoon. 5 There is no water in the bag.<\/p><p>Exercise 10J: 1 My father is not a teacher. 2 I do not sell fish. 3 He does not have a bicycle. 4 There is no water in the house. (or: at home) 5 Do not be late. 6 Wannan jakar ba tawa ba ce. 7 Ba sa cin nama. 8 Ba mu da ƙwai yau. 9 Babu kowa a gida. 10 Kada ka manta da littafinka. Other natural wording is acceptable if the meaning is correct.<\/p><p>Exercise 10K (sample answer): I do not have a car. My father does not work in an office. My mother never sells fish. My brothers do not live in Kano. Do not forget your books.<\/p><p>Review Questions: 1 Add not after the verb: I am not, he is not, they are not. 2 She does not teach English. 3 doesn’t; aren’t. 4 English uses only one negative. Correct: I don’t have anything. / I have nothing. 5 Do not be late. (or: Don’t be late.)<\/p>", "<h2>Chapter 11 Answers<\/h2><p>Exercise 11A: 1 worked; 2 lived; 3 studied; 4 stopped; 5 played; 6 carried; 7 planned; 8 cleaned; 9 liked; 10 tried.<\/p><p>Exercise 11B: 1 went; 2 saw; 3 ate; 4 bought; 5 came; 6 sold; 7 wrote; 8 gave; 9 had; 10 made.<\/p><p>Exercise 11C: 1 sold; 2 cooked; 3 went; 4 played; 5 bought; 6 was; 7 were; 8 came.<\/p><p>Exercise 11D: 1 I did not go to school. 2 Musa did not sell fish. 3 They did not come early. 4 We did not eat meat. 5 She was not at home. 6 They were not tired. (Short forms didn’t, wasn’t, weren’t are also correct.)<\/p><p>Exercise 11E: 1 Did you go to the market? 2 Did Musa sell maize? 3 Did they come early? 4 Was she at school? 5 Were you tired?<\/p><p>Exercise 11F: 1 What did Aisha buy? 2 Where did Musa go? 3 When did they arrive? 4 Who sold the goat? 5 How did they go to school?<\/p><p>Exercise 11G: 1 Yes, I did. 2 No, he did not. 3 Yes, they were. 4 No, it was not. 5 Yes, she did.<\/p><p>Exercise 11H: 1 (b); 2 (b); 3 (b); 4 (b); 5 (b).<\/p><p>Exercise 11I: 1 I went to the market yesterday. 2 She went home. 3 He didn’t go to school. 4 Did you see Musa? 5 Musa bought fish. 6 I went to school. 7 They didn’t come. 8 She studied English. 9 We stopped at the gate. 10 Yesterday I was at school.<\/p><p>Exercise 11J (sample answers): 1 I went to school yesterday. I ate rice at home. 2 I did not go to the market. 3 Did you see Musa? 4 We were at home yesterday. 5 My brother arrived two days ago.<\/p><p>Exercise 11K: 1 I went to the market yesterday. 2 We cooked rice last night. 3 They did not come. 4 She bought a new phone. 5 Musa did not sell fish. 6 Musa ya yi aiki a gona jiya. 7 Mun ci shinkafa da wake. 8<\/p>", "<p>Ba ta dafa shinkafa ba. 9 Ka tafi makaranta? 10 Sun zo da wuri. Other natural wording is acceptable if the meaning is correct.<\/p><p>Exercise 11L (sample answer): On Saturday I went to the market. I bought rice and fish. On Sunday I stayed at home. I cleaned the house. In the evening I visited my uncle.<\/p><p>Review Questions: 1 For finished actions in the past. Examples: I went to the market yesterday. We cooked rice last night. 2 carried; stopped; ate; bought. 3 After “didn’t” we use the base verb. Correct: She didn’t go to school. 4 Did they come early? Yes, they did. / No, they did not. 5 “Was” with I, he, she, it; “were” with you, we, they.<\/p><h2>Chapter 12 Answers<\/h2><p>Exercise 12A: 1 will go; 2 will sell; 3 will cook; 4 will rain; 5 will travel; 6 will be.<\/p><p>Exercise 12B: 1 I will not go. 2 She will not come. 3 They will not sell the farm. 4 It will not rain tomorrow. 5 Musa will not be late. (Won’t is also correct.)<\/p><p>Exercise 12C: 1 Will you come tomorrow? 2 Will Musa sell the goat? 3 Will it rain? 4 Will they stay in Kano? 5 Will she help us?<\/p><p>Exercise 12D: 1 What will you buy? 2 Where will they stay? 3 When will the market open? (or: What time will the market open?) 4 Who will help us? 5 How will she travel?<\/p><p>Exercise 12E: 1 Yes, I will. 2 No, he will not. (or: No, he won’t.) 3 Yes, it will. 4 No, they will not. (or: No, they won’t.) 5 Yes, she will.<\/p><p>Exercise 12F: 1 am going to sell; 2 is going to study; 3 are going to buy; 4 are not going to travel; 5 Are you going to cook rice tonight?<\/p><p>Exercise 12G: 1 rains; 2 study; 3 comes; 4 does not rain (or: doesn’t rain); 5 is.<\/p><p>Exercise 12H: 1 (b); 2 (b); 3 (b); 4 (b); 5 (a).<\/p>", "<p>Exercise 12I: 1 She will come. 2 He will sell the goat. 3 I will not go. 4 Will you come? 5 If it rains, we will stay. 6 Tomorrow I will go to the market. 7 I will be late.<\/p><p>Exercise 12J (sample answers): 1 I will go to the farm tomorrow. I will sell maize in the market. 2 I will not travel next week. 3 Will you help me? 4 I will pay you on Friday. 5 I am going to buy a new bag.<\/p><p>Exercise 12K: 1 I will go to the market tomorrow. 2 We will cook rice tonight. 3 I will not go. 4 Will you come tomorrow? 5 It will rain tomorrow. 6 Musa zai sayar da akuyar mako mai zuwa. 7 Ba za ta zo ba. 8 Za su tafi Kano. 9 Me za ka saya? 10 Zan ɗauki jakarka. Other natural wording is acceptable if the meaning is correct.<\/p><p>Exercise 12L (sample answer): I will go to school on Monday. I am going to visit my aunt on Wednesday. I will not work on Friday. I will cook rice on Saturday. I am going to rest on Sunday.<\/p><p>Review Questions: 1 Subject + will + base verb. 2 She won’t come. 3 Will they stay in Kano? Yes, they will. / No, they will not. 4 We use will for decisions, promises, offers, and predictions. We use be going to for plans already made, or when we see signs. 5 If it rains tomorrow, we will stay at home.<\/p><h2>Chapter 13 Answers<\/h2><p>Exercise 13A: 1 can; 2 cannot; 3 can; 4 cannot; 5 can.<\/p><p>Exercise 13B: 1 Could you close the door, please? 2 Could you open the window, please? 3 Could you help me, please? 4 Could you repeat the word, please? 5 Could you lend me a pen, please?<\/p><p>Exercise 13C: 1 should; 2 shouldn’t; 3 should; 4 shouldn’t; 5 should.<\/p><p>Exercise 13D: 1 must; 2 must not; 3 must; 4 must not; 5 must.<\/p><p>Exercise 13E: 1 ability; 2 request; 3 advice; 4 duty; 5 ability; 6 advice.<\/p>", "<p>Exercise 13F: 1 Can you drive? 2 Can he read? 3 Should I go? 4 Could she help? 5 Should we start now?<\/p><p>Exercise 13G: 1 I cannot swim. (or: I can’t swim.) 2 He could not help us. (or: couldn’t) 3 You should not be late. (or: shouldn’t) 4 Students must not run in the class. (or: mustn’t) 5 She cannot drive. (or: can’t)<\/p><p>Exercise 13H: 1 (b); 2 (b); 3 (a); 4 (c); 5 (b); 6 (a).<\/p><p>Exercise 13I: 1 She can cook. 2 I can swim. 3 Can you help me? 4 Can you swim? 5 He must go to school. 6 She should rest. 7 You must not run. 8 I should go home.<\/p><p>Exercise 13J (sample answers): 1 I can cook rice. 2 I cannot drive. 3 Could you open the door, please? 4 You should drink more water. 5 Drivers must stop at a red light.<\/p><p>Exercise 13K: 1 I can cook. 2 Can you drive? 3 You should study every day. 4 Students must come on time. 5 Could you help me, please? (or: Can you help me?) 6 Tana iya magana da Turanci. 7 Ya kamata ka sha ruwa. 8 Kada ka yi gudu a aji. 9 Zan iya zama a nan? 10 Ya kamata manoma su shuka masara kafin damina. Other natural wording is acceptable if the meaning is correct.<\/p><p>Exercise 13L (sample answer): I can cook rice. I can speak Hausa and English. I should read every day. I should help my mother. I must come to school on time. I must obey the rules.<\/p><p>Review Questions: 1 “Should” gives advice (a good idea); “must” states a rule or a strong duty. 2 She cannot (can’t) drive. Can she drive? 3 “Can” makes its own question: Can you swim? 4 “Could you help me, please?” is more polite. 5 “You must not come” means it is forbidden; “You do not have to come” means it is not necessary.<\/p>", "<h2>Chapter 14 Answers<\/h2><p>Exercise 14A: 1 She is a nurse. 2 We are happy. 3 They were at school yesterday. 4 I was late. 5 The children were tired. 6 He works in a shop.<\/p><p>Exercise 14B: 1 eats; 2 go; 3 has; 4 are; 5 is; 6 are.<\/p><p>Exercise 14C: 1 He doesn’t like meat. 2 Does she like tea? 3 I didn’t see him. 4 Yesterday I ate rice. 5 She can sing. 6 I want to go.<\/p><p>Exercise 14D: 1 –; 2 The; 3 an; 4 –; 5 –; 6 a; 7 The; 8 –.<\/p><p>Exercise 14E: 1 Musa and I; 2 hers; 3 There; 4 These; 5 me; 6 his.<\/p><p>Exercise 14F: 1 to; 2 –; 3 –; 4 of; 5 on; 6 from; 7 to.<\/p><p>Exercise 14G: 1 Why did you not come? (or: Why didn’t you come?) 2 What does he sell? 3 How do you know? 4 He does not know the answer. 5 I do not like meat. 6 I do not have a phone. (or: I have no phone.) 7 She does not have any money. (or: She has no money.)<\/p><p>Exercise 14H: 1 She gave me a lot of advice. (or: some advice) 2 I bought two loaves of bread. 3 I have a lot of money. (or: much money) 4 This phone is cheaper than that one. 5 I like rice very much. 6 He speaks English well.<\/p><p>Exercise 14I: 1 There; 2 You’re; 3 its; 4 than; 5 to; 6 They’re.<\/p><p>Exercise 14J: My name is Musa. I live in Kano. I am a trader. I sell rice and beans in the market every day. Yesterday I went to the market early. There were many customers. I bought two bags of rice. Tomorrow I will go to the farm.<\/p><p>Exercise 14K: 1 She is a teacher. 2 I do not like meat. 3 Yesterday they went to the market. 4 This bag is hers. 5 I will not come tomorrow. 6 Jiya suna makaranta. 7 Musa da Aisha abokai ne. 8 Bai san amsar ba. 9 Ina matuƙar son shinkafa. 10 Tana tsoron karnuka. Other natural wording is acceptable if the meaning is correct.<\/p>", "<p>Exercise 14L (sample answer): Good morning, Malam. My name is Ibrahim. I want to buy three bags of rice. How much is one bag? I will come to the shop on Friday.<\/p><p>Review Questions: 1 In Hausa the verb “to be” can be left out (for example, Manomi ne), so learners carry the habit into English. 2 She doesn’t like rice. After “doesn’t” we use the base verb; “doesn’t” carries the -s. 3 After do/does/did/can/will/should/must, and after “to”, use the base verb. 4 “Its” shows belonging (its food); “it’s” means “it is”. 5 Sample: She is married to Musa. I am afraid of dogs. It depends on the weather.<\/p><h2>Chapter 15 Answers<\/h2><p>Exercise 15A: 1 is; 2 am; 3 am; 4 in.<\/p><p>Exercise 15B: 1 Good morning. 2 Good afternoon. 3 Good evening.<\/p><p>Exercise 15C: 1 my; 2 Her; 3 our; 4 Their.<\/p><p>Exercise 15D: 1 Is the lesson difficult? 2 Does the class start at ten? 3 I do not practise every day.<\/p><p>Exercise 15E: 1 much; 2 many; 3 too; 4 will.<\/p><p>Exercise 15F: 1 I need ten bags. 2 Please give me a receipt. 3 Please come again next week.<\/p><p>Exercise 15G: 1 can; 2 I did not work in a shop. (or: didn’t) 3 can.<\/p><p>Exercise 15H: 1 at; 2 between; 3 on; 4 along.<\/p><p>Exercise 15I: 1 Could (or: Can); 2 at; 3 message; 4 called.<\/p><p>Exercise 15J: 1 is; 2 was; 3 will; 4 Will.<\/p><p>Exercise 15K: 1 Could you open the door, please? 2 Could you show me the way, please? 3 Could you carry this bag, please?<\/p><p>Exercise 15L: 1 am going to visit; 2 will travel; 3 will; 4 going.<\/p>", "<p>Exercise 15M (sample dialogue): A: Good morning. How much is a kilo of onions? B: It is one thousand naira. A: That is too expensive. Please reduce the price. B: Okay, nine hundred naira. A: I will take two kilos.<\/p><p>Review Questions: 1 Sample: My name is Musa. I am from Kano. I am a student. 2 “Good morning” at 8 a.m.; “Good evening” at 7 p.m. 3 We say “Could you help me, please?” 4 How much is a bag of rice? 5 “Please reduce the price.” and “Please give me a receipt.”<\/p><h2>Revision Exercise Answers<\/h2><p>Revision A: 1 noun; adverb; preposition; pronoun; adjective. 2 My name is Musa and I live in Kano. 3 Subject: Aisha; verb: sells. 4 (a) command; (b) question.<\/p><p>Revision B: 1 children; boxes; cities; tomatoes. 2 Musa’s book. 3 much; many. 4 She. 5 us. 6 hers.<\/p><p>Revision C: 1 am; 2 are; 3 She is not a farmer. 4 Are they at school? 5 There is.<\/p><p>Revision D: 1 sells; 2 does not like; 3 Do; 4 are playing; 5 has.<\/p><p>Revision E: 1 a; 2 an; 3 The; 4 taller; 5 best; 6 a big red bag.<\/p><p>Revision F: 1 on; 2 in; 3 at; 4 by; 5 to; 6 I go home.<\/p><p>Revision G: 1 Does Musa sell rice? 2 Where. 3 They do not eat meat. 4 I don’t have anything. (or: I have nothing.) 5 much. 6 Do not be late.<\/p><p>Revision H: 1 went; bought; studied. 2 She did not cook rice. 3 Did they come early? 4 will go. 5 She won’t come. 6 rains.<\/p><p>Revision I: 1 can; 2 must; 3 should; 4 Could you help me, please? 5 She can cook.<\/p><p>Revision J: 1 They were at school. 2 He doesn’t like rice. 3 Musa and I are friends. 4 She is married to Musa. 5 I like rice very much. 6 The news is good.<\/p>", "<p>Revision K: 1 Good evening. 2 much. 3 could. 4 Sample: Go straight, then turn right at the junction. 5 My name is Musa.<\/p><p>Revision L: 1 I have a new phone. 2 Yesterday they went to the market. 3 I do not sell fish. 4 We will cook rice tomorrow. 5 You should drink water. 6 Mahaifina manomi ne. 7 Akuyar tana ƙarƙashin bishiya. 8 Ina kake zaune? 9 Ba ta zo ba. 10 Kada ka yi gudu a aji. Other natural wording is acceptable if the meaning is correct.<\/p><h2>Comprehensive Final Test Answers<\/h2><p>Part A (1 mark each): 1 (b); 2 (b); 3 (b); 4 (b); 5 (b); 6 (b); 7 (a); 8 (c); 9 (b); 10 (b); 11 (b); 12 (b); 13 (a); 14 (b); 15 (b); 16 (a); 17 (c); 18 (b); 19 (b); 20 (b).<\/p><p>Part B (1 mark each): 21 am; 22 are; 23 goes; 24 are playing; 25 much; 26 tallest; 27 in; 28 Are; 29 bought; 30 must.<\/p><p>Part C (1 mark each): 31 She goes to school. 32 He doesn’t like meat. (or: He does not like meat.) 33 I agree. 34 Did you see Musa? 35 She is a teacher. 36 The children are at home. 37 I want some rice. (or: I want rice.) 38 I go home. 39 If it rains, we will stay. 40 Aisha and I are friends.<\/p><p>Part D (1 mark each): 41 My name is Musa. 42 I go to the market. (or: I am going to the market.) 43 She did not come. 44 We will go tomorrow. 45 You should read the book. 46 Kasuwa babba ce. 47 Ba mu da ƙwai yau. 48 Kana sayar da shinkafa? 49 Musa da Aisha abokai ne. 50 Don Allah ka rufe ƙofar. Other natural wording is acceptable if the meaning is correct.<\/p><p>Part E (sample answer, 10 marks): I live in Kano. I work on a farm every day. Yesterday I went to the market. I will visit my uncle tomorrow. I do not eat meat. Do you like rice? Give two marks for each correct sentence. The five sentences must include a simple present<\/p>", "<p>sentence, a past sentence, a future sentence, a negative sentence, and a question.<\/p>", "<h2>Glossary of Grammar Terms<\/h2><p>Ma’anar Kalmomin Nahawu<\/p><div class=\"tw\"><table><tr><th>Term<\/th><th>Meaning<\/th><th>Hausa explanation<\/th><\/tr><tr><td>adjective<\/td><td>a word that describes a noun (big, new)<\/td><td>sifa: kalma mai bayyana suna<\/td><\/tr><tr><td>adverb<\/td><td>a word that tells how, when, or where something happens (quickly, today)<\/td><td>kalma mai ƙara bayani a kan aikatau (yadda, lokaci, wuri)<\/td><\/tr><tr><td>article<\/td><td>a, an, or the, used before a noun<\/td><td>kalmomin a, an, the kafin suna<\/td><\/tr><tr><td>base verb<\/td><td>the verb with no ending (go, sell)<\/td><td>aikatau a asalinsa, ba -s, -ed, ko -ing<\/td><\/tr><tr><td>comparative<\/td><td>a form that compares two things (taller, more expensive)<\/td><td>kwatanta abubuwa biyu<\/td><\/tr><tr><td>conjunction<\/td><td>a word that joins words or sentences (and, but, or)<\/td><td>kalmar da ke haɗa kalmomi ko jimloli<\/td><\/tr><tr><td>consonant<\/td><td>a letter or sound that is not a vowel<\/td><td>baƙaƙe<\/td><\/tr><tr><td>countable noun<\/td><td>a noun we can count (book, goat)<\/td><td>suna wanda ake iya ƙirgawa<\/td><\/tr><tr><td>definite article<\/td><td>“the”: a particular thing<\/td><td>“the”: abu takamaimai<\/td><\/tr><tr><td>exclamation<\/td><td>a sentence that shows strong feeling<\/td><td>jimla ta mamaki ko ji a rai<\/td><\/tr><tr><td>future tense<\/td><td>a verb form for things that have not happened yet (will go)<\/td><td>zamanin gaba<\/td><\/tr><tr><td>helping verb<\/td><td>a verb that helps the main verb (do, does, did, will, can)<\/td><td>aikatau mai taimako<\/td><\/tr><tr><td>indefinite article<\/td><td>“a” or “an”: any one thing<\/td><td>“a/an”: kowane ɗaya<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Term<\/th><th>Meaning<\/th><th>Hausa explanation<\/th><\/tr><tr><td>interjection<\/td><td>a word that shows sudden feeling (Oh! Wow!)<\/td><td>kalmar mamaki ko ji a rai<\/td><\/tr><tr><td>irregular verb<\/td><td>a verb with a special past form (go → went)<\/td><td>aikatau mai keɓantaccen tsari<\/td><\/tr><tr><td>modal verb<\/td><td>a helping verb such as can, could, should, must<\/td><td>aikatau mai taimako da ke nuna iyawa, shawara, ko wajibci<\/td><\/tr><tr><td>negative<\/td><td>a sentence that says “not”<\/td><td>jimlar musantawa<\/td><\/tr><tr><td>noun<\/td><td>a word for a person, place, thing, animal, or idea<\/td><td>suna<\/td><\/tr><tr><td>object<\/td><td>the person or thing that receives the action<\/td><td>abin da aka aikata a kai<\/td><\/tr><tr><td>object pronoun<\/td><td>me, you, him, her, it, us, them<\/td><td>wakilin suna na abin da aka aikata<\/td><\/tr><tr><td>past tense<\/td><td>a verb form for finished actions (went, played)<\/td><td>zamanin da ya wuce<\/td><\/tr><tr><td>plural<\/td><td>more than one<\/td><td>jam’i<\/td><\/tr><tr><td>possessive adjective<\/td><td>my, your, his, her, its, our, their<\/td><td>kalmar mallaka kafin suna<\/td><\/tr><tr><td>possessive pronoun<\/td><td>mine, yours, his, hers, ours, theirs<\/td><td>kalmar mallaka mai zaman kanta<\/td><\/tr><tr><td>preposition<\/td><td>a word that shows place, time, or direction (in, on, at, to)<\/td><td>kalma mai nuna wuri, lokaci, ko alkibla<\/td><\/tr><tr><td>present continuous<\/td><td>am/is/are + verb-ing: an action happening now<\/td><td>zamanin da ake aiki a yanzu<\/td><\/tr><tr><td>pronoun<\/td><td>a word that takes the place of a noun (he, she, they)<\/td><td>wakilin suna<\/td><\/tr><tr><td>proper noun<\/td><td>the name of one particular person or place (Musa, Kano)<\/td><td>suna na musamman<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Term<\/th><th>Meaning<\/th><th>Hausa explanation<\/th><\/tr><tr><td>regular verb<\/td><td>a verb that adds -ed in the past (work → worked)<\/td><td>aikatau mai ƙara -ed<\/td><\/tr><tr><td>sentence<\/td><td>a group of words that gives a complete idea<\/td><td>jimla<\/td><\/tr><tr><td>short answer<\/td><td>a brief answer: Yes, I do.<\/td><td>gajeren amsa<\/td><\/tr><tr><td>simple present<\/td><td>a verb form for habits and facts (I sell)<\/td><td>zamanin yanzu na yau da kullum<\/td><\/tr><tr><td>singular<\/td><td>one<\/td><td>guda ɗaya<\/td><\/tr><tr><td>subject<\/td><td>the person or thing that does the action<\/td><td>mai aikatawa<\/td><\/tr><tr><td>superlative<\/td><td>a form for the most or least (tallest, most expensive)<\/td><td>mafi-girma / mafi<\/td><\/tr><tr><td>tense<\/td><td>the form of a verb that shows time<\/td><td>lokacin aikatau<\/td><\/tr><tr><td>uncountable noun<\/td><td>a noun we do not count (rice, water, advice)<\/td><td>suna wanda ba a ƙirgawa<\/td><\/tr><tr><td>verb<\/td><td>a word for an action or a state (eat, is)<\/td><td>aikatau<\/td><\/tr><tr><td>vowel<\/td><td>the letters a, e, i, o, u<\/td><td>wasali<\/td><\/tr><tr><td>word order<\/td><td>the order of words in a sentence<\/td><td>jerin kalmomi a jimla<\/td><\/tr><\/table><\/div>", "<h2>About the Author<\/h2><p>Game da Marubuci Lukuman Muhammad Abubakar Fagge is a Nigerian author and entrepreneur interested in education, agriculture, business, technology, and career development. Through LUKUMAN LEARNING, he aims to make practical learning resources accessible to readers.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Lukuman Muhammad Abubakar Fagge marubuci ne kuma ɗan kasuwa ɗan Najeriya mai sha’awar ilimi, noma, kasuwanci, fasaha, da ci gaban sana’a. Ta hanyar LUKUMAN LEARNING, yana neman sauƙaƙa wa masu karatu samun kayan koyo masu amfani.<\/div>", "<h2>Thank You for Reading<\/h2><p>You have now worked through the basics of English grammar, with Hausa explanations to guide you. Grammar is learned by practice. Read aloud, write a little every day, and use the checklist in Chapter 14 on your own writing. Make mistakes, correct them, and keep going.<\/p><p>Mun gode da karatunku. Koyon nahawu yana buƙatar yin atisaye. Ku riƙa karatu da ƙarfi, ku riƙa rubutu kaɗan kowace rana, kuma ku yi amfani da jerin dubawa na Babi na 14. Ku yi kuskure, ku gyara, ku ci gaba.<\/p><p>LUKUMAN LEARNING<\/p>"], "t": [[0, "Cover"], [1, "Copyright"], [3, "Preface"], [10, "Chapter 1: Introduction to English Grammar"], [22, "Chapter 2: Nouns"], [34, "Chapter 3: Pronouns"], [45, "Chapter 4: The Verb “To Be”: Am, Is, and Are"], [57, "Chapter 5: Simple Present Tense"], [71, "Chapter 6: Articles: A, An, and The"], [80, "Chapter 7: Adjectives"], [91, "Chapter 8: Prepositions"], [102, "Chapter 9: Asking Questions"], [112, "Chapter 10: Negative Sentences"], [122, "Chapter 11: Simple Past Tense"], [1
