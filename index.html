<script>
const D={"p": ["<h1>ENGLISH–HAUSA<\/h1><h1>GRAMMAR BOOK 1<\/h1><h2>A Beginner’s Guide to Learning English Grammar with<\/h2><h2>Hausa Explanations<\/h2><h2>Lukuman Muhammad Abubakar Fagge<\/h2><p>LUKUMAN LEARNING<\/p>", "<p>English–Hausa Grammar Book 1: A Beginner’s Guide to Learning English Grammar with Hausa Explanations<\/p><p>Copyright © 2026 Lukuman Muhammad Abubakar Fagge. All rights reserved.<\/p><p>No part of this book may be reproduced, stored, or transmitted in any form or by any means without the prior written permission of the author, except for short quotations used in reviews or for educational discussion.<\/p><p>Published under the LUKUMAN LEARNING brand.<\/p><p>First edition: 2026<\/p><p>The examples, conversations, and exercises in this book were written for this book.<\/p>", "<h3>Dedication<\/h3><p>To every learner who has the courage to begin, and to every reader who keeps going when it is difficult.<\/p><p>Ga kowane ɗalibi da ya yi ƙarfin hali ya fara, da kuma kowane mai karatu da bai yi kasa a gwiwa ba.<\/p>", "<h2>Preface<\/h2><p>Gabatarwa Many people in Northern Nigeria hear and use English every day. They see it on signboards, on phones, in schools, in offices, and in the market. Yet many of them still feel unsure when they must write a sentence, answer a question at an interview, or speak politely to a customer. This book was written to help with that problem.<\/p><p>The book starts at the very beginning. It assumes that you may never have studied English grammar properly. Each rule is explained in simple English first. Then it is explained again in Hausa, so that you can understand it clearly in the language you know best. The examples come from places you know: the market, the school, the farm, the shop, the office, and the home.<\/p><p>Grammar is not meant to frighten anyone. Grammar is simply the way words are arranged so that other people can understand us. When you understand the pattern, you can build your own sentences with confidence, instead of copying sentences you do not fully understand.<\/p><p>Please read slowly, say the examples aloud, and write the exercises in a notebook. Check your answers at the back of the book. If you make mistakes, do not be discouraged. Mistakes are a normal part of learning.<\/p><p>I pray that this book will be useful to you. Lukuman Muhammad Abubakar Fagge<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Wannan littafi an rubuta shi ne domin masu koyon Turanci waɗanda suke jin Hausa. Za a fara daga farko, a hankali. Ana bayyana kowace ƙa’ida da Turanci mai sauƙi, sannan a sake yin bayani da Hausa. Misalai duk daga rayuwar yau da kullum ne: kasuwa, makaranta, gona, shago, ofis, da gida.<\/div>", "<p>Nahawu ba abin tsoro ba ne. Shi ne tsarin da ake jera kalmomi domin wasu su fahimce mu. Idan ka fahimci tsarin, za ka iya gina jimlolinka da kanka. Ka karanta a hankali, ka riƙa faɗin misalan da baki, ka kuma yi atisaye a littafin rubutu.<\/p>", "<h2>How to Use This Book<\/h2><p>Yadda Ake Amfani da Wannan Littafi Each chapter follows the same pattern, so you always know what to expect:<\/p><p>• Learning Objectives tell you what you will be able to do after the chapter.<\/p><p>• Introduction and Hausa Explanation explain the topic in two languages.<\/p><p>• Rules and Examples show the pattern, with Hausa translations.<\/p><p>• Common Mistakes show errors that learners often make, and the correct form.<\/p><p>• Guided Practice and Exercises let you practise. Do them in writing.<\/p><p>• Summary and Review Questions help you remember what you learned. Answers to all exercises are in the Answer Key at the end of the book. Try every exercise before you look at the answers.<\/p><h2>The Learning Path<\/h2><p>The chapters are arranged in a careful order. Each stage uses what you learned in the stage before it.<\/p><div class=\"tw\"><table><tr><th>Stage<\/th><th>Chapters<\/th><th>What you learn<\/th><\/tr><tr><td>1. Foundations<\/td><td>1–3<\/td><td>What grammar is; nouns; pronouns. These are the building blocks of every sentence.<\/td><\/tr><tr><td>2. Simple sentences<\/td><td>4–6<\/td><td>The verb “to be”; the simple present tense; articles.<\/td><\/tr><tr><td>3. Making sentences richer<\/td><td>7–8<\/td><td>Adjectives and prepositions.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Stage<\/th><th>Chapters<\/th><th>What you learn<\/th><\/tr><tr><td>4. Questions and negatives<\/td><td>9–10<\/td><td>Asking questions and saying “no” correctly.<\/td><\/tr><tr><td>5. Time and ability<\/td><td>11–13<\/td><td>Past, future, and the modal verbs can, could, should, must.<\/td><\/tr><tr><td>6. Putting it together<\/td><td>14–15<\/td><td>Common mistakes and everyday conversations.<\/td><\/tr><\/table><\/div><h2>Tips for Hausa-Speaking Learners<\/h2><p>• Read each English example aloud, then read the Hausa meaning.<\/p><p>• Do not translate word for word. Sometimes English and Hausa say the same idea in different ways. The book will point out these differences.<\/p><p>• Study for a short time every day. Twenty minutes each day is better than three hours once a week.<\/p><p>• Make your own sentences about your own life. This is the fastest way to learn.<\/p>", "<h2>Learning Objectives of the Book<\/h2><p>Manufofin Littafin After completing this book, you should be able to:<\/p><p>• Name the main parts of an English sentence and the eight parts of speech.<\/p><p>• Use nouns, pronouns, articles, adjectives, and prepositions correctly.<\/p><p>• Use am, is, and are, and the simple present, past, and future tenses.<\/p><p>• Ask questions and write negative sentences correctly.<\/p><p>• Use can, could, should, and must to talk about ability, advice, and duty.<\/p><p>• Recognise and correct common mistakes in your own writing.<\/p><p>• Take part in simple everyday conversations in English.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Bayan ka kammala wannan littafi, za ka iya gane sassan jimla, ka yi amfani da suna, wakilin suna, aikatau, da sifa daidai; ka yi tambaya, ka yi jimla ta musantawa; ka yi magana a kan abin da ya wuce da abin da zai zo; sannan ka yi tattaunawa ta yau da kullum da Turanci.<\/div>", "<h2>Table of Contents<\/h2><p>Front Matter Title Page · Copyright Page · Dedication · Preface · How to Use This Book · Learning Objectives · Table of Contents<\/p><p>Chapter 1: Introduction to English Grammar What grammar is · words and sentences · the eight parts of speech · kinds of sentences · capital letters and punctuation · how English and Hausa build sentences Chapter 2: Nouns Common and proper nouns · singular and plural · countable and uncountable nouns · possession Chapter 3: Pronouns Subject pronouns · object pronouns · possessives · this, that, these, those Chapter 4: The Verb “To Be”: Am, Is, and Are Positive, negative, and question forms · describing people, jobs, places, and feelings Chapter 5: Simple Present Tense Habits and routines · facts · the -s ending with he, she, it Chapter 6: Articles: A, An, and The When to use a, an, the, or no article Chapter 7: Adjectives Describing nouns · word order · comparing things Chapter 8: Prepositions Place, time, and movement: in, on, at, to, from, with, and more Chapter 9: Asking Questions Yes/no questions · question words · do, does, is, are Chapter 10: Negative Sentences Not, do not, does not, no, never<\/p>", "<p>Chapter 11: Simple Past Tense Regular and irregular verbs · did · past time words Chapter 12: Simple Future Tense Will and going to · plans and predictions Chapter 13: Can, Could, Should, and Must Ability, permission, advice, and duty Chapter 14: Common English Grammar Mistakes Frequent errors of Hausa-speaking learners, with corrections Chapter 15: Everyday English Conversations Greetings, shopping, work, travel, and telephone conversations<\/p><p>Back Matter Essential English–Hausa Vocabulary · Revision Exercises · Comprehensive Final Test · Complete Answer Key · Glossary of Grammar Terms · About the Author<\/p>", "<div class=\"ch\">Chapter 1<\/div><h1>Introduction to English Grammar<\/h1><p>Gabatarwa ga Nahawun Turanci<\/p><h2>Learning Objectives<\/h2><p>After this chapter, you will be able to:<\/p><p>• Explain what grammar is and why it is useful.<\/p><p>• Say what a word, a sentence, and a subject are.<\/p><p>• Name the eight parts of speech and give an example of each.<\/p><p>• Recognise four kinds of sentences: statements, questions, commands, and exclamations.<\/p><p>• Use capital letters and punctuation marks correctly.<\/p><p>• Understand some important differences between English and Hausa sentences.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Manufofin Babi: Bayan wannan babi, za ka iya bayyana ma’anar nahawu; ka san kalma da jimla; ka gane nau’o’in kalmomi takwas; ka san nau’o’in jimla huɗu; ka yi amfani da manyan haruffa da alamomin rubutu daidai; sannan ka fahimci bambance-bambancen da ke tsakanin jimlar Turanci da ta Hausa.<\/div><h2>1.1 What Is Grammar?<\/h2><p>Grammar is the set of rules that tells us how to put words together to make clear sentences. When we follow these rules, other people can understand us. When we break them, people may be confused.<\/p><p>Look at these two groups of words:<\/p>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Musa sells rice in the market. Rice market the in sells Musa.<\/td><td>Musa yana sayar da shinkafa a kasuwa.<\/td><\/tr><tr><td><\/td><td>(Kalmomi ne a jere ba tare da tsari ba.)<\/td><\/tr><\/table><\/div><p>Both groups use the same words. Only the first one is a good English sentence, because the words are in the right order. Grammar teaches us the right order and the right form of words.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Nahawu shi ne ƙa’idojin da ke nuna yadda ake jera kalmomi domin a samu jimla mai ma’ana. Idan mun bi ƙa’idojin, mutane suna fahimtar mu. Idan ba mu bi ba, sai a ruɗe.<\/td><\/tr><tr><td>A misalin da ke sama, kalmomin iri ɗaya ne, amma jimla ta farko ce kaɗai daidai a Turanci domin an jera kalmomin yadda ya dace.<\/div><p>Why learn grammar?<\/p><p>• To speak and write clearly at school, at work, and in business.<\/p><p>• To avoid mistakes that can change the meaning of what you say.<\/p><p>• To feel confident when you talk to customers, teachers, employers, or visitors.<\/p><p>• To prepare for exams, interviews, and job applications.<\/p><h2>1.2 Words and Sentences<\/h2><p>A word is a single unit of language, such as market, Musa, sell, or big. A sentence is a group of words that gives a complete idea. A sentence usually has two main parts:<\/p><p>• The subject: who or what the sentence is about.<\/p><p>• The verb: the action word, or the word that says what the subject is or does.<\/p>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Fatima cooks rice.<\/td><td>Fatima tana dafa shinkafa. (Subject: Fatima; verb: cooks)<\/td><\/tr><tr><td>The children are at school.<\/td><td>Yara suna makaranta. (Subject: The children)<\/td><\/tr><tr><td>My father is a farmer.<\/td><td>Mahaifina manomi ne. (Subject: My father)<\/td><\/tr><\/table><\/div><p>Many sentences also have an object. The object is the person or thing that receives the action.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Audu ate rice.<\/td><td>Audu ya ci shinkafa.<\/td><\/tr><tr><td>Aisha sells tomatoes.<\/td><td>Aisha tana sayar da tumatur.<\/td><\/tr><tr><td>We buy yams at the market.<\/td><td>Muna sayen doya a kasuwa.<\/td><\/tr><\/table><\/div><p>In the first sentence, Audu is the subject, ate is the verb, and rice is the object. This pattern is called Subject + Verb + Object. It is the most common pattern in English.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Jimla ita ce rukunin kalmomi masu cikakkiyar ma’ana. Yawanci jimla tana da mai aikatawa (subject: wanda jimlar ta shafa), da aikatau (verb: aikin da ake yi), kuma sau da yawa da abin da aka aikata (object).<\/td><\/tr><tr><td>Misali: “Audu ya ci shinkafa.” Audu ne mai aikatawa, “ya ci” aikatau ne, shinkafa kuma ita ce abin da aka ci. Tsarin Turanci shi ne: Mai aikatawa + Aikatau + Abin da aka aikata.<\/div>", "<h2>1.3 The Eight Parts of Speech<\/h2><p>Every English word belongs to a group called a part of speech. The group depends on the job the word does in the sentence. There are eight main groups.<\/p><div class=\"tw\"><table><tr><th>Part of speech Noun (suna) Pronoun (wakilin suna) Verb (aikatau) Adjective (sifa) Adverb Preposition Conjunction Interjection<\/th><th>Job<\/th><th>Examples<\/th><\/tr><tr><td><\/td><td>Names a person, place, thing, or idea<\/td><td>boy, Kano, market, rice, teacher<\/td><\/tr><tr><td><\/td><td>Takes the place of a noun<\/td><td>I, you, he, she, we, they<\/td><\/tr><tr><td><\/td><td>Shows action or state<\/td><td>eat, go, sell, write, read, is<\/td><\/tr><tr><td><\/td><td>Describes a noun<\/td><td>big, small, new, hot, good<\/td><\/tr><tr><td><\/td><td>Tells how, when, or where an action happens<\/td><td>quickly, slowly, today, here<\/td><\/tr><tr><td><\/td><td>Shows place, time, or relationship<\/td><td>in, on, at, to, with<\/td><\/tr><tr><td><\/td><td>Joins words or sentences<\/td><td>and, but, or, because<\/td><\/tr><tr><td><\/td><td>Shows sudden feeling<\/td><td>Oh! Wow! Ah!<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Suna (Noun): kalmar da ke ambaton mutum, wuri, abu, ko tunani. Misali: yaro, Kano, kasuwa, shinkafa.<\/td><\/tr><tr><td>Wakilin suna (Pronoun): kalmar da ke maye gurbin suna, kamar ni, kai, shi, ita, mu, su.<\/td><\/tr><tr><td>Aikatau (Verb): kalmar da ke nuna aiki ko hali, kamar ci, tafi, sayar, rubuta, karanta.<\/td><\/tr><tr><td>Sifa (Adjective): kalmar da ke bayyana suna, kamar babba, ƙarami, sabo.<\/div>", "<div class=\"box\"><b>Adverb: kalmar da ke ƙara bayani a kan aikatau, wato yadda, lokacin, ko wurin da aka yi aikin; misali: da sauri, a hankali, yau.<\/b><br>Preposition: kalmar da ke nuna wuri, lokaci, ko dangantaka tsakanin kalmomi; misali: a, cikin, zuwa, da.<\/td><\/tr><tr><td>Conjunction: kalmar da ke haɗa kalmomi ko jimloli, kamar da, amma, ko.<\/td><\/tr><tr><td>Interjection: kalmar da ake faɗa idan an yi mamaki ko an ji wani abu a rai, kamar “Kai!”.<\/div><p>A word can sometimes belong to more than one group, depending on how we use it. For example, work is a verb in “I work in a shop” and a noun in “My work is hard.” Always look at the job the word is doing.<\/p><p>Example: finding the parts of speech Read this sentence: Aisha buys new shoes in the market.<\/p><div class=\"tw\"><table><tr><th>Word<\/th><th>Part of speech<\/th><th>Hausa meaning<\/th><\/tr><tr><td>Aisha<\/td><td>noun<\/td><td>Aisha (suna)<\/td><\/tr><tr><td>buys<\/td><td>verb<\/td><td>tana saya<\/td><\/tr><tr><td>new<\/td><td>adjective<\/td><td>sababbi<\/td><\/tr><tr><td>shoes<\/td><td>noun<\/td><td>takalma<\/td><\/tr><tr><td>in<\/td><td>preposition<\/td><td>a / cikin<\/td><\/tr><tr><td>the<\/td><td>article (see Chapter 6)<\/td><td>—<\/td><\/tr><tr><td>market<\/td><td>noun<\/td><td>kasuwa<\/td><\/tr><\/table><\/div><p>Full Hausa meaning: Aisha tana sayen sababbin takalma a kasuwa.<\/p><h2>1.4 Four Kinds of Sentences<\/h2><div class=\"tw\"><table><tr><th>Kind<\/th><th>Purpose<\/th><th>English example<\/th><th>Hausa meaning<\/th><\/tr><tr><td>Statement<\/td><td>Gives information<\/td><td>I go to the market.<\/td><td>Ina zuwa kasuwa.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Kind<\/th><th>Purpose<\/th><th>English example<\/th><th>Hausa meaning<\/th><\/tr><tr><td>Question<\/td><td>Asks something<\/td><td>Where are you going?<\/td><td>Ina za ka/ki je?<\/td><\/tr><tr><td>Command<\/td><td>Tells someone to do something<\/td><td>Close the door.<\/td><td>Rufe ƙofar.<\/td><\/tr><tr><td>Exclamation<\/td><td>Shows strong feeling<\/td><td>What a big market!<\/td><td>Kai, wannan kasuwa babba ce!<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>A Turanci akwai nau’o’in jimla huɗu: jimla ta bayani (statement), ta tambaya (question), ta umarni (command), da ta mamaki ko ji a rai (exclamation). A Hausa, “ka” ana amfani da ita ga namiji, “ki” kuma ga mace; a Turanci kalmar “you” ɗaya ce ga kowa.<\/div><h2>1.5 Capital Letters and Punctuation<\/h2><p>Capital letters and punctuation marks help the reader understand the sentence. Learn these basic rules.<\/p><p>Use a capital letter for:<\/p><p>• The first word of every sentence: The market is big.<\/p><p>• The word I: Today I am at school.<\/p><p>• Names of people: Musa, Aisha, Abubakar.<\/p><p>• Names of places: Nigeria, Kano, Wudil.<\/p><p>• Days and months: Monday, Friday, March.<\/p><p>Punctuation marks<\/p><div class=\"tw\"><table><tr><th>Mark<\/th><th>Name<\/th><th>Use<\/th><th>Example<\/th><\/tr><tr><td>.<\/td><td>full stop<\/td><td>Ends a statement or command<\/td><td>I am a trader.<\/td><\/tr><tr><td>?<\/td><td>question mark<\/td><td>Ends a question<\/td><td>How are you?<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Mark<\/th><th>Name<\/th><th>Use<\/th><th>Example<\/th><\/tr><tr><td>!<\/td><td>exclamation mark<\/td><td>Shows strong feeling<\/td><td>Stop!<\/td><\/tr><tr><td>,<\/td><td>comma<\/td><td>Separates items or short pauses<\/td><td>I sell rice, beans, and maize.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>A Turanci, ana fara kowace jimla da babban harafi, kuma ana rubuta sunan mutum, sunan wuri, rana, da wata da babban harafi. Kalmar “I” (ni) kullum babban harafi ce. Ana kammala jimlar bayani da digo (.), jimlar tambaya da alamar tambaya (?), jimlar mamaki da alamar mamaki (!).<\/div><h2>1.6 English and Hausa: Some Important<\/h2><h2>Differences<\/h2><p>Hausa and English are different languages, so they do not always build sentences in the same way. Knowing the differences will help you avoid mistakes.<\/p><p>Difference 1: English sentences need a subject In Hausa, the subject can sometimes be left out because the verb form already shows who is meant. In English, we must say the subject.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>He is a farmer. (not: Is a farmer.)<\/td><td>Manomi ne. / Shi manomi ne.<\/td><\/tr><tr><td>She sells fish. (not: Sells fish.)<\/td><td>Tana sayar da kifi.<\/td><\/tr><\/table><\/div><p>Difference 2: Hausa shows the person inside the verb phrase In Hausa, small words such as ya, tana, and muna show who does the action. English uses a separate pronoun or noun, and the verb often stays the same.<\/p>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Audu ate rice.<\/td><td>Audu ya ci shinkafa.<\/td><\/tr><tr><td>We buy yams.<\/td><td>Muna sayen doya.<\/td><\/tr><\/table><\/div><p>Difference 3: English nouns do not take “ne/ce” In Hausa, we say Mahaifina manomi ne (“My father is a farmer”) using ne. In English, we use the verb is: My father is a farmer. You will study this in detail in Chapter 4.<\/p><div class=\"box\"><b>Do not translate word for word<\/b><br>If you translate every Hausa word one by one, the English may sound strange or be wrong. First understand the whole idea, then say it the English way.<\/div><h2>1.7 Grammar in Daily Life<\/h2><p>Here is a short conversation between two people who meet near a school in Kano. Read it aloud.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Amina: Good morning, Musa.<\/td><td>Amina: Ina kwana, Musa.<\/td><\/tr><tr><td>Musa: Good morning, Amina. How are you?<\/td><td>Musa: Ina kwana, Amina. Kina lafiya?<\/td><\/tr><tr><td>Amina: I am fine, thank you.<\/td><td>Amina: Ina lafiya, na gode.<\/td><\/tr><tr><td>Musa: Where are you going?<\/td><td>Musa: Ina za ki je?<\/td><\/tr><tr><td>Amina: I am going to school.<\/td><td>Amina: Ina zuwa makaranta.<\/td><\/tr><tr><td>Musa: See you later.<\/td><td>Musa: Sai an jima.<\/td><\/tr><\/table><\/div><p>Notice the grammar: each sentence begins with a capital letter, names begin with capital letters, and the questions end with a question mark. The sentences are short, but they are complete.<\/p>", "<p>Here are some other everyday sentences:<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>My name is Musa.<\/td><td>Sunana Musa.<\/td><\/tr><tr><td>The market is big.<\/td><td>Kasuwa babba ce.<\/td><\/tr><tr><td>The teacher is in the class.<\/td><td>Malami yana cikin aji.<\/td><\/tr><tr><td>Where is the school?<\/td><td>Ina makarantar take?<\/td><\/tr><tr><td>I am going to school.<\/td><td>Ina zuwa makaranta.<\/td><\/tr><\/table><\/div><p>Note: Hausa often has more than one correct way to say something. The Hausa translations in this book show one natural way.<\/p><h2>1.8 Common Mistakes and Corrections<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>my name is musa.<\/td><td>My name is Musa.<\/td><td>Begin a sentence and a name with a capital letter. (Ana fara jimla da sunaye da babban harafi.)<\/td><\/tr><tr><td>i am a teacher.<\/td><td>I am a teacher.<\/td><td>“I” is always a capital letter. (“I” kullum babban harafi ne.)<\/td><\/tr><tr><td>Is a farmer.<\/td><td>He is a farmer.<\/td><td>English needs a subject. (A Turanci dole a faɗi “He” ko “She”.)<\/td><\/tr><tr><td>Where is the market<\/td><td>Where is the market?<\/td><td>A question ends with a question mark. (Tambaya tana ƙarewa da alamar tambaya.)<\/td><\/tr><tr><td>we go to kano on friday<\/td><td>We go to Kano on Friday.<\/td><td>Capital letters for names of places and days. Add a full stop.<\/td><\/tr><\/table><\/div>", "<h2>1.9 Guided Practice<\/h2><p>Do these examples together with the explanation. Read the sentence, find the subject and the verb, then check.<\/p><div class=\"tw\"><table><tr><th>Sentence<\/th><th>Subject<\/th><th>Verb<\/th><\/tr><tr><td>Musa sells tomatoes.<\/td><td>Musa<\/td><td>sells<\/td><\/tr><tr><td>The children play football.<\/td><td>The children<\/td><td>play<\/td><\/tr><tr><td>Aisha reads a book.<\/td><td>Aisha<\/td><td>reads<\/td><\/tr><\/table><\/div><p>Now correct this sentence step by step: where are you going<\/p><p>• Step 1: Begin with a capital letter → Where<\/p><p>• Step 2: It is a question, so end with a question mark → ?<\/p><p>• Result: Where are you going?<\/p><h2>1.10 Exercises<\/h2><p>Exercise 1A: Parts of speech Write the part of speech for each word: noun, pronoun, verb, adjective, adverb, preposition, or conjunction.<br>1. market<br>2. run<br>3. she<br>4. big<br>5. quickly<br>6. in<br>7. and<br>8. teacher<br>9. eat<br>10. small<\/p><p>Exercise 1B: Punctuation Write the correct mark at the end of each sentence (. ? !).<br>1. Where is the market ___<br>2. Musa sells rice ___<br>3. What a big market ___<br>4. Amina is my sister ___<br>5. How are you ___<\/p><p>Exercise 1C: Multiple choice 1. A noun is a word for: (a) an action (b) the name of a person, place, or thing (c) a joining word<\/p><p>2. Which word is a verb? (a) rice (b) sell (c) green<\/p>", "<p>3. “She” is a: (a) noun (b) pronoun (c) verb<\/p><p>4. Which sentence is correct? (a) Is a farmer. (b) He is a farmer. (c) Farmer he is.<\/p><p>5. Which word is an adjective? (a) quickly (b) small (c) in<\/p><p>Exercise 1D: Sentence correction Correct each sentence.<br>1. my name is musa.<br>2. i am a student<br>3. Is a trader.<br>4. where is the school<br>5. we go to kano on friday<\/p><p>Exercise 1E: Sentence construction Write one sentence for each instruction.<br>1. Use the noun “market”.<br>2. Use the verb “sell”.<br>3. Use the adjective “new”.<br>4. Ask a question with “where”.<\/p><p>Exercise 1F: Translation Hausa to English:<br>1. Sunana Musa.<br>2. Mahaifina manomi ne.<br>3. Yara suna makaranta.<br>4. Muna sayen doya a kasuwa.<br>5. Fatima tana dafa shinkafa.<\/p><p>English to Hausa: 6. The market is big. 7. Musa sells tomatoes. 8. Aisha buys new shoes. 9. Where is the school? 10. I am going to school.<\/p><p>Exercise 1G: Everyday communication task Write three sentences to introduce yourself to a new neighbour. Give your name, your town, and your work or school. Begin each sentence with a capital letter and end it with a full stop.<\/p><h2>1.11 Chapter Summary<\/h2><p>• Grammar is the set of rules for putting words together clearly.<\/p>", "<p>• A sentence has a subject and a verb. Many sentences also have an object.<\/p><p>• The eight parts of speech are noun, pronoun, verb, adjective, adverb, preposition, conjunction, and interjection.<\/p><p>• There are four kinds of sentences: statements, questions, commands, and exclamations.<\/p><p>• Begin sentences, names, days, months, and the word “I” with capital letters. End sentences with the correct mark.<\/p><p>• English needs a subject in every sentence; Hausa can sometimes omit it.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Taƙaitawa: Nahawu ƙa’idojin jera kalmomi ne. Jimla tana da mai aikatawa da aikatau. Akwai nau’o’in kalmomi takwas da nau’o’in jimla huɗu. Ana amfani da babban harafi da alamomin rubutu yadda ya dace. A Turanci dole a faɗi mai aikatawa a kowace jimla.<\/div><h2>1.12 Review Questions<\/h2><p>1. What is grammar?<br>2. Name the two main parts of a sentence.<br>3. Name the eight parts of speech.<br>4. Give one example of each of the four kinds of sentences.<br>5. Why can we not say “Is a farmer” in English?<\/p>", "<div class=\"ch\">Chapter 2<\/div><h1>Nouns<\/h1><p>Suna<\/p><h2>Learning Objectives<\/h2><p>After this chapter, you will be able to:<\/p><p>• Say what a noun is and find nouns in a sentence.<\/p><p>• Tell the difference between common nouns and proper nouns.<\/p><p>• Make the plural of regular and irregular nouns.<\/p><p>• Use countable and uncountable nouns correctly.<\/p><p>• Show possession with ’s and s’.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Manufofin Babi: Bayan wannan babi, za ka iya gane suna a cikin jimla; ka bambanta suna na gama-gari da suna na musamman; ka yi jam’in (plural) kalmomin Turanci; ka yi amfani da kalmomin da ake iya ƙirgawa da waɗanda ba a iya ƙirgawa; sannan ka nuna mallaka da ’s.<\/div><h2>2.1 What Is a Noun?<\/h2><p>A noun is a word that names a person, a place, a thing, an animal, or an idea. Nouns are the most common words in English. Almost every sentence has at least one noun.<\/p><div class=\"tw\"><table><tr><th>Kind<\/th><th>English nouns<\/th><th>Hausa meaning<\/th><\/tr><tr><td>Person<\/td><td>teacher, farmer, student, driver<\/td><td>malami, manomi, ɗalibi, direba<\/td><\/tr><tr><td>Place<\/td><td>market, school, farm, mosque, shop<\/td><td>kasuwa, makaranta, gona, masallaci, shago<\/td><\/tr><tr><td>Thing<\/td><td>book, phone, bag, chair<\/td><td>littafi, waya, jaka, kujera<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Kind<\/th><th>English nouns<\/th><th>Hausa meaning<\/th><\/tr><tr><td>Animal<\/td><td>goat, cow, chicken<\/td><td>akuya, saniya, kaza<\/td><\/tr><tr><td>Idea<\/td><td>honesty, peace, happiness<\/td><td>gaskiya, zaman lafiya, farin ciki<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Suna kalma ce da ke ambaton mutum, wuri, abu, dabba, ko tunani. A Turanci, ana kiran suna noun.<\/td><\/tr><tr><td>Bambanci mai muhimmanci: a Hausa, kowane suna namiji ne ko mace (misali: “littafi” namiji ne, “kujera” mace ce). A Turanci, mafi yawan sunaye ba su da jinsi. Kalmar “teacher” tana nufin namiji ko mace. Haka “student” da “farmer”. Idan muna so mu nuna jinsi, sai mu yi amfani da “he” ko “she”, ko mu ƙara kalma kamar “male” ko “female”.<\/div><p>Now look at nouns inside sentences. A noun can be the subject (the one who does the action) or the object (the one who receives the action).<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>The farmer sells maize.<\/td><td>Manomi yana sayar da masara.<\/td><\/tr><tr><td>Aisha buys a bag.<\/td><td>Aisha tana sayen jaka.<\/td><\/tr><\/table><\/div><p>In the first sentence, farmer is the subject and maize is the object.<\/p><h2>2.2 Common Nouns and Proper Nouns<\/h2><p>A common noun names any person, place, or thing of a kind. We do not begin it with a capital letter unless it starts a sentence. A proper noun names one particular person, place, or thing. We always begin it with a capital letter.<\/p>", "<div class=\"tw\"><table><tr><th>Common noun<\/th><th>Proper noun<\/th><th>Hausa meaning<\/th><\/tr><tr><td>girl<\/td><td>Aisha<\/td><td>yarinya, Aisha<\/td><\/tr><tr><td>country<\/td><td>Nigeria<\/td><td>ƙasa, Najeriya<\/td><\/tr><tr><td>city<\/td><td>Kano<\/td><td>birni, Kano<\/td><\/tr><tr><td>river<\/td><td>River Niger<\/td><td>kogi, Kogin Neja<\/td><\/tr><tr><td>day<\/td><td>Friday<\/td><td>rana, Juma’a<\/td><\/tr><tr><td>month<\/td><td>March<\/td><td>wata, Maris<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Aisha is a girl.<\/td><td>Aisha yarinya ce.<\/td><\/tr><tr><td>Kano is a big city.<\/td><td>Kano babban birni ne.<\/td><\/tr><tr><td>Nigeria is my country.<\/td><td>Najeriya ƙasata ce.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Suna na gama-gari (common noun) yana nufin kowane abu a rukuninsa, kamar “city” (birni). Suna na musamman (proper noun) yana nufin abu ɗaya kaɗai, kamar “Kano”. A Turanci, ana fara suna na musamman da babban harafi koyaushe, haka ma sunayen rana da wata.<\/div><h2>2.3 Singular and Plural Nouns<\/h2><p>Singular means one. Plural means more than one. Most English nouns make the plural by adding -s.<\/p><div class=\"tw\"><table><tr><th>Singular<\/th><th>Plural<\/th><th>Hausa (singular)<\/th><\/tr><tr><td>book<\/td><td>books<\/td><td>littafi<\/td><\/tr><tr><td>shop<\/td><td>shops<\/td><td>shago<\/td><\/tr><tr><td>farm<\/td><td>farms<\/td><td>gona<\/td><\/tr><tr><td>market<\/td><td>markets<\/td><td>kasuwa<\/td><\/tr><\/table><\/div>", "<p>Some nouns change in other ways. Learn these rules:<\/p><p>Rule 1: Add -es after s, x, ch, sh, and z<\/p><div class=\"tw\"><table><tr><th>Singular<\/th><th>Plural<\/th><th>Hausa (singular)<\/th><\/tr><tr><td>bus<\/td><td>buses<\/td><td>bas<\/td><\/tr><tr><td>box<\/td><td>boxes<\/td><td>akwati<\/td><\/tr><tr><td>church<\/td><td>churches<\/td><td>coci<\/td><\/tr><tr><td>dish<\/td><td>dishes<\/td><td>faranti<\/td><\/tr><\/table><\/div><p>Rule 2: Consonant + y → change y to -ies<\/p><div class=\"tw\"><table><tr><th>Singular<\/th><th>Plural<\/th><th>Hausa (singular)<\/th><\/tr><tr><td>baby<\/td><td>babies<\/td><td>jariri<\/td><\/tr><tr><td>city<\/td><td>cities<\/td><td>birni<\/td><\/tr><tr><td>family<\/td><td>families<\/td><td>iyali<\/td><\/tr><\/table><\/div><p>But if a vowel (a, e, i, o, u) comes before the y, just add -s: boy → boys, day → days.<\/p><p>Rule 3: Nouns ending in -f or -fe often change to -ves<\/p><div class=\"tw\"><table><tr><th>Singular<\/th><th>Plural<\/th><th>Hausa (singular)<\/th><\/tr><tr><td>leaf<\/td><td>leaves<\/td><td>ganye<\/td><\/tr><tr><td>knife<\/td><td>knives<\/td><td>wuƙa<\/td><\/tr><\/table><\/div><p>Rule 4: Some nouns ending in -o take -es<\/p><div class=\"tw\"><table><tr><th>Singular<\/th><th>Plural<\/th><th>Hausa (singular)<\/th><\/tr><tr><td>tomato<\/td><td>tomatoes<\/td><td>tumatur<\/td><\/tr><tr><td>potato<\/td><td>potatoes<\/td><td>dankali<\/td><\/tr><\/table><\/div>", "<p>But some words ending in -o take only -s: radio → radios, photo → photos.<\/p><p>Rule 5: Irregular plurals Some nouns do not follow any rule. You must learn them.<\/p><div class=\"tw\"><table><tr><th>Singular<\/th><th>Plural<\/th><th>Hausa (singular)<\/th><\/tr><tr><td>man<\/td><td>men<\/td><td>namiji<\/td><\/tr><tr><td>woman<\/td><td>women<\/td><td>mace<\/td><\/tr><tr><td>child<\/td><td>children<\/td><td>yaro ko yarinya<\/td><\/tr><tr><td>person<\/td><td>people<\/td><td>mutum<\/td><\/tr><tr><td>foot<\/td><td>feet<\/td><td>ƙafa<\/td><\/tr><tr><td>tooth<\/td><td>teeth<\/td><td>haƙori<\/td><\/tr><tr><td>sheep<\/td><td>sheep<\/td><td>tunkiya<\/td><\/tr><tr><td>fish<\/td><td>fish<\/td><td>kifi<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>A Turanci, yawancin sunaye suna samun jam’i (plural) ta ƙara -s. Amma wasu suna canzawa ta hanyoyi daban-daban (misali: child → children).<\/td><\/tr><tr><td>A Hausa ma jam’i ba shi da doka guda ɗaya. Misali: yaro → yara, kasuwa → kasuwanni, littafi → littattafai, shago → shaguna. Don haka, kar ka yi ƙoƙarin juya jam’in Hausa zuwa na Turanci; ka koyi kowanne daban.<\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>There are many shops in the market.<\/td><td>Akwai shaguna da yawa a kasuwa.<\/td><\/tr><tr><td>The children are at school.<\/td><td>Yara suna makaranta.<\/td><\/tr><tr><td>My mother sells tomatoes.<\/td><td>Mahaifiyata tana sayar da tumatur.<\/td><\/tr><\/table><\/div>", "<h2>2.4 Countable and Uncountable Nouns<\/h2><p>Countable nouns are things we can count: one book, two books, three goats. Uncountable nouns are things we do not count one by one, such as rice, water, sugar, and oil. Uncountable nouns have no plural form (we do not say “rices” or “waters”).<\/p><div class=\"tw\"><table><tr><th>Countable<\/th><th>Uncountable<\/th><\/tr><tr><td>book (littafi), goat (akuya), student (ɗalibi), shop (shago)<\/td><td>rice (shinkafa), water (ruwa), sugar (sukari), oil (mai), salt (gishiri), milk (madara), sand (yashi), money (kuɗi), advice (shawara), information (bayani), furniture (kayan ɗaki)<\/td><\/tr><\/table><\/div><p>We can measure uncountable nouns with a container or a unit. Then we count the container.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>two bags of rice<\/td><td>buhu biyu na shinkafa<\/td><\/tr><tr><td>a cup of water<\/td><td>kofi ɗaya na ruwa<\/td><\/tr><tr><td>a bottle of oil<\/td><td>kwalbar mai ɗaya<\/td><\/tr><tr><td>a piece of advice<\/td><td>shawara ɗaya<\/td><\/tr><\/table><\/div><p>Use many with countable nouns and much with uncountable nouns.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>How many students are in your class?<\/td><td>Ɗalibai nawa ne a ajinku?<\/td><\/tr><tr><td>How much rice do you want?<\/td><td>Shinkafa nawa kake so?<\/td><\/tr><tr><td>She has many books.<\/td><td>Tana da littattafai da yawa.<\/td><\/tr><tr><td>There is not much water.<\/td><td>Ba ruwa da yawa.<\/td><\/tr><\/table><\/div><p>Remember<\/p>", "<p>Do not add -s to uncountable nouns. Say “information”, “advice”, and “furniture”, not “informations”, “advices”, and “furnitures”.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Wasu sunaye a Turanci ba a ƙirga su, don haka ba su da jam’i: rice, water, sugar, oil, advice, information, furniture. Idan muna so mu ƙirga su, sai mu ƙirga abin da ke ɗauke da su: “two bags of rice” (buhu biyu na shinkafa). Ka yi amfani da many don abin da ake ƙirgawa, da much don abin da ba a ƙirgawa.<\/div><h2>2.5 Possessive Nouns<\/h2><p>We use ’s to show that something belongs to someone.<\/p><p>• Singular noun: add ’s → Musa’s bag, the teacher’s book.<\/p><p>• Plural noun ending in -s: add only ’ → the farmers’ market.<\/p><p>• Plural noun not ending in -s: add ’s → the children’s school.<\/p><div class=\"tw\"><table><tr><th>English Aisha’s phone is new. The teacher’s book is on the table. The children’s school is near. This is the farmers’ market.<\/th><th>Hausa<\/th><\/tr><tr><td><\/td><td>Wayar Aisha sabuwa ce.<\/td><\/tr><tr><td><\/td><td>Littafin malami yana kan tebur.<\/td><\/tr><tr><td><\/td><td>Makarantar yara tana kusa.<\/td><\/tr><tr><td><\/td><td>Wannan kasuwar manoma ce.<\/td><\/tr><\/table><\/div><p>We can also use the word of for things: the leg of the chair (ƙafar kujera).<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>A Hausa, ana nuna mallaka ta hanyar haɗa kalmomi biyu: “littafin malami”, “jakar Musa”, “kasuwar Kano”. A Turanci, ana ƙara ’s a bayan mai mallakar: “the teacher’s book”, “Musa’s bag”. Ka lura: mai mallakar yana zuwa kafin abin da yake mallaka a Turanci, amma a Hausa abin da ake mallaka yana zuwa kafin mai mallakar.<\/div>", "<h2>2.6 Nouns in Daily Life<\/h2><p>A conversation in a shop in Kano. Read it aloud.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Customer: Good afternoon. Do you have rice?<\/td><td>Mai saye: Barka da rana. Kuna da shinkafa?<\/td><\/tr><tr><td>Trader: Yes, we have rice and beans.<\/td><td>Ɗan kasuwa: Ee, muna da shinkafa da wake.<\/td><\/tr><tr><td>Customer: I want two bags of rice and one bag of beans.<\/td><td>Mai saye: Ina son buhu biyu na shinkafa da buhu ɗaya na wake.<\/td><\/tr><tr><td>Trader: Anything else?<\/td><td>Ɗan kasuwa: Akwai wani abu kuma?<\/td><\/tr><tr><td>Customer: Yes, one bottle of oil.<\/td><td>Mai saye: Ee, kwalbar mai ɗaya.<\/td><\/tr><tr><td>Trader: Here you are.<\/td><td>Ɗan kasuwa: Gashi nan.<\/td><\/tr><tr><td>Customer: Thank you.<\/td><td>Mai saye: Na gode.<\/td><\/tr><\/table><\/div><p>Notice the uncountable nouns (rice, beans, oil) measured with bags and bottle. Notice also that beans is a plural noun.<\/p><h2>2.7 Common Mistakes and Corrections<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>I need some informations.<\/td><td>I need some information.<\/td><td>“Information” is uncountable. (Ba shi da jam’i.)<\/td><\/tr><tr><td>She gave me good advices.<\/td><td>She gave me good advice.<\/td><td>“Advice” is uncountable.<\/td><\/tr><tr><td>We bought new furnitures.<\/td><td>We bought new furniture.<\/td><td>“Furniture” is uncountable.<\/td><\/tr><tr><td>The childrens are at school.<\/td><td>The children are at school.<\/td><td>“Children” is already plural.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>Musas bag is new.<\/td><td>Musa’s bag is new.<\/td><td>Use ’s for possession. (A yi amfani da ’s.)<\/td><\/tr><tr><td>He has three goat.<\/td><td>He has three goats.<\/td><td>After a number above one, use the plural.<\/td><\/tr><tr><td>nigeria is big.<\/td><td>Nigeria is big.<\/td><td>Proper nouns begin with a capital letter.<\/td><\/tr><\/table><\/div><h2>2.8 Guided Practice<\/h2><p>Make the plural step by step.<\/p><p>• shop → ends in -p. No special rule. Add -s → shops.<\/p><p>• box → ends in -x. Add -es → boxes.<\/p><p>• city → consonant (t) + y. Change y to -ies → cities.<\/p><p>• child → irregular. Learn it → children. Now choose much or many: “How ___ sugar do you want?” Sugar is uncountable, so the answer is much.<\/p><h2>2.9 Exercises<\/h2><p>Exercise 2A: Find the nouns Write all the nouns in each sentence.<br>1. The farmer sells maize in the market.<br>2. Aisha has a new phone.<br>3. Kano is a big city.<br>4. My brother is a driver.<br>5. Honesty is important.<\/p><p>Exercise 2B: Common or proper? Write “common” or “proper” for each noun.<br>1. teacher<br>2. Nigeria<br>3. school<br>4. Musa<br>5. river<br>6. Friday<\/p>", "<p>Exercise 2C: Plurals Write the plural of each noun.<br>1. book<br>2. box<br>3. baby<br>4. child<br>5. tomato<br>6. day<br>7. knife<br>8. woman<br>9. church<br>10. sheep<\/p><p>Exercise 2D: Much or many? Write much or many.<br>1. How ___ rice do you want?<br>2. How ___ students are in your class?<br>3. There is not ___ water.<br>4. She has ___ books.<br>5. We do not have ___ sugar.<\/p><p>Exercise 2E: Possession Write the correct form of the word in brackets.<br>1. This is ___ (Fatima) shop.<br>2. The ___ (teacher) car is new.<br>3. The ___ (children) school is near.<br>4. These are my ___ (brothers) phones. (Two brothers own them.)<\/p><p>Exercise 2F: Multiple choice<br>1. What is the plural of “city”? (a) citys (b) cities (c) cityes<br>2. Which noun is uncountable? (a) goat (b) rice (c) shop<br>3. Which is correct? (a) two rices (b) two bags of rice (c) two rice<br>4. Which is correct? (a) Musas bag (b) Musa’s bag (c) Musa bag’s<br>5. Which is correct? (a) She gave me good advices. (b) She gave me good advice. (c) She gave me good advicees.<\/p><p>Exercise 2G: Sentence correction Correct each sentence. 1. I need some informations.<\/p>", "<p>2. The childrens are at school. 3. We bought new furnitures. 4. Amina book is on the table. 5. He has three goat. 6. nigeria is a big country.<\/p><p>Exercise 2H: Sentence construction<br>1. Write a sentence with two proper nouns.<br>2. Write a sentence with the plural of “shop”.<br>3. Write a sentence with “some” and an uncountable noun.<br>4. Write a sentence with the possessive form of a friend’s name.<\/p><p>Exercise 2I: Translation Hausa to English:<br>1. Manomi yana sayar da masara a kasuwa.<br>2. Wayar Aisha sabuwa ce.<br>3. Malami yana da littattafai da yawa.<br>4. Ina son ruwa kaɗan.<br>5. Kano babban birni ne. English to Hausa:<br>6. The children’s school is near.<br>7. We need some sugar.<br>8. The shops are open.<br>9. My mother has two goats.<br>10. Honesty is good.<\/p><p>Exercise 2J: Everyday communication task You are going to the market. Write a shopping list of five things. Use the correct plural form or a measure word for each item (for example, “two bags of rice”).<\/p>", "<h2>2.10 Chapter Summary<\/h2><p>• A noun names a person, place, thing, animal, or idea.<\/p><p>• Proper nouns begin with a capital letter; common nouns do not (unless they start a sentence).<\/p><p>• Most plurals add -s. Learn the rules for -es, -ies, -ves, and the irregular plurals.<\/p><p>• Uncountable nouns (rice, water, advice) have no plural. Use much, not many.<\/p><p>• Use ’s for possession: Musa’s bag; the children’s school; the farmers’ market.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Taƙaitawa: Suna yana ambaton mutum, wuri, abu, dabba, ko tunani. Sunayen musamman suna farawa da babban harafi. Yawancin jam’i suna ƙara -s, amma akwai keɓantattu. Wasu sunaye ba a ƙirga su (rice, water, advice). Ana nuna mallaka da ’s.<\/div><h2>2.11 Review Questions<\/h2><p>1. What is a noun? Give one example of each kind.<br>2. What is the difference between a common noun and a proper noun?<br>3. Write the plural of “family”, “bus”, and “man”.<br>4. Why can we not say “informations”?<br>5. How do we show possession in English?<\/p>", "<div class=\"ch\">Chapter 3<\/div><h1>Pronouns<\/h1><p>Wakilin Suna<\/p><h2>Learning Objectives<\/h2><p>After this chapter, you will be able to:<\/p><p>• Explain what a pronoun is and why we use pronouns.<\/p><p>• Use subject pronouns: I, you, he, she, it, we, they.<\/p><p>• Use object pronouns: me, you, him, her, it, us, them.<\/p><p>• Use possessive adjectives (my, your, his…) and possessive pronouns (mine, yours, his…).<\/p><p>• Use this, that, these, and those.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Manufofin Babi: Bayan wannan babi, za ka iya amfani da wakilan suna na mai aikatawa (I, you, he, she, it, we, they), na abin da aka aikata (me, him, her, us, them), kalmomin mallaka (my, your, his, her, our, their; mine, yours, hers…), da this, that, these, those.<\/div><h2>3.1 What Is a Pronoun?<\/h2><p>A pronoun is a word that takes the place of a noun. We use pronouns so that we do not repeat the same noun again and again.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Musa is a farmer. Musa sells maize. Musa is a farmer. He sells maize.<\/td><td>Musa manomi ne. Musa yana sayar da masara. (maimaita sunan)<\/td><\/tr><tr><td><\/td><td>Musa manomi ne. Yana sayar da masara.<\/td><\/tr><\/table><\/div><h4>Bayani da Hausa (Hausa Explanation)<\/h4>", "<p>Wakilin suna (pronoun) kalma ce da ke maye gurbin suna, don kada mu yawaita maimaita suna ɗaya. Misali, maimakon mu ce “Musa” sau biyu, sai mu ce “He” a karo na biyu.<\/p><h2>3.2 Subject Pronouns<\/h2><p>We use subject pronouns before the verb, to say who does the action.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>Example<\/th><th>Hausa meaning<\/th><\/tr><tr><td>I<\/td><td>ni<\/td><td>I sell rice.<\/td><td>Ina sayar da shinkafa.<\/td><\/tr><tr><td>you<\/td><td>kai / ke / ku<\/td><td>You sell rice.<\/td><td>Kana / Kina / Kuna sayar da shinkafa.<\/td><\/tr><tr><td>he<\/td><td>shi<\/td><td>He sells rice.<\/td><td>Yana sayar da shinkafa.<\/td><\/tr><tr><td>she<\/td><td>ita<\/td><td>She sells rice.<\/td><td>Tana sayar da shinkafa.<\/td><\/tr><tr><td>it<\/td><td>shi / ita<\/td><td>It is useful.<\/td><td>Yana da amfani.<\/td><\/tr><tr><td>we<\/td><td>mu<\/td><td>We sell rice.<\/td><td>Muna sayar da shinkafa.<\/td><\/tr><tr><td>they<\/td><td>su<\/td><td>They sell rice.<\/td><td>Suna sayar da shinkafa.<\/td><\/tr><\/table><\/div><p>How to choose<\/p><p>• Use he for a man or boy, she for a woman or girl.<\/p><p>• Use it for a thing, an animal, or an idea: The book is new. It is useful.<\/p><p>• Use we when you are included: Aisha and I are friends. We study together.<\/p><p>• Use they for more than one person or thing: The students are late. They are at the gate. Important difference<\/p>", "<p>In Hausa there are three words for “you”: kai (to a man), ke (to a woman), and ku (to more than one person). In English, you is used for one person or many, man or woman.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Wakilan suna na mai aikatawa suna zuwa kafin aikatau. A Turanci, kalmar “you” ɗaya ce ga kowa. “He” na namiji ne, “she” na mace ce, “it” kuma na abu ko dabba ne.<\/td><\/tr><tr><td>A Hausa, “shi” yana iya nufin “he” ko “it”. A Turanci, dole ne ka zaɓa: idan mutum ne namiji, “he”; idan abu ne, “it”.<\/div><h2>3.3 Object Pronouns<\/h2><p>We use object pronouns after a verb or after a preposition (in, on, at, to, with, for…). They tell who receives the action.<\/p><div class=\"tw\"><table><tr><th>Subject<\/th><th>Object<\/th><th>Example<\/th><th>Hausa meaning<\/th><\/tr><tr><td>I<\/td><td>me<\/td><td>Musa sees me.<\/td><td>Musa yana ganina.<\/td><\/tr><tr><td>you<\/td><td>you<\/td><td>Musa sees you.<\/td><td>Musa yana ganinka / ganinki.<\/td><\/tr><tr><td>he<\/td><td>him<\/td><td>Aisha sees him.<\/td><td>Aisha tana ganinsa.<\/td><\/tr><tr><td>she<\/td><td>her<\/td><td>Musa sees her.<\/td><td>Musa yana ganinta.<\/td><\/tr><tr><td>it<\/td><td>it<\/td><td>I see it.<\/td><td>Ina ganinsa / ganinta.<\/td><\/tr><tr><td>we<\/td><td>us<\/td><td>The teacher helps us.<\/td><td>Malami yana taimakonmu.<\/td><\/tr><tr><td>they<\/td><td>them<\/td><td>I like them.<\/td><td>Ina son su.<\/td><\/tr><\/table><\/div><p>After a preposition, we also use object pronouns:<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Please sit with me.<\/td><td>Ka zauna tare da ni, don Allah.<\/td><\/tr><tr><td>Aisha is with her mother.<\/td><td>Aisha tana tare da mahaifiyarta.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>The teacher speaks to us.<\/td><td>Malami yana magana da mu.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Do not use “me” as the subject<\/b><br>Wrong: Me and Aisha go to school. Correct: Aisha and I go to school. It is polite to put the other person first.<\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Ana amfani da object pronoun bayan aikatau ko bayan preposition: “sees me”, “with us”, “for them”. A Hausa, ana ƙara ƙarin kalma a bayan aikatau (ganina, ganinsa, ganinta). A Turanci, ana rubuta kalmar daban.<\/div><h2>3.4 Possessive Adjectives<\/h2><p>Possessive adjectives show who owns something. They come before a noun.<\/p><div class=\"tw\"><table><tr><th>Pronoun<\/th><th>Possessive adjective<\/th><th>Example<\/th><th>Hausa meaning<\/th><\/tr><tr><td>I<\/td><td>my<\/td><td>my book<\/td><td>littafina<\/td><\/tr><tr><td>you<\/td><td>your<\/td><td>your book<\/td><td>littafinka / littafinki<\/td><\/tr><tr><td>he<\/td><td>his<\/td><td>his book<\/td><td>littafinsa<\/td><\/tr><tr><td>she<\/td><td>her<\/td><td>her book<\/td><td>littafinta<\/td><\/tr><tr><td>it<\/td><td>its<\/td><td>its food<\/td><td>abincinsa / abincinta<\/td><\/tr><tr><td>we<\/td><td>our<\/td><td>our book<\/td><td>littafinmu<\/td><\/tr><tr><td>they<\/td><td>their<\/td><td>their book<\/td><td>littafinsu<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>My father is a farmer.<\/td><td>Mahaifina manomi ne.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Her mother is a teacher.<\/td><td>Mahaifiyarta malama ce.<\/td><\/tr><tr><td>Our school is big.<\/td><td>Makarantarmu babba ce.<\/td><\/tr><tr><td>Their shop is in the market.<\/td><td>Shagonsu yana kasuwa.<\/td><\/tr><tr><td>Your phone is on the table.<\/td><td>Wayarka tana kan tebur.<\/td><\/tr><tr><td>The goat is eating its food.<\/td><td>Akuyar tana cin abincinta.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>its and it’s<\/b><br>its (no apostrophe) shows possession: The goat eats its food. it’s (with apostrophe) means “it is”: It’s hot today.<\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Possessive adjective tana nuna mai mallaka, kuma tana zuwa kafin suna a Turanci: “my book”. A Hausa, ana ƙara ƙarin kalma a bayan suna: “littafina”. Ka lura da wannan bambanci a wurin jeri.<\/div><h2>3.5 Possessive Pronouns<\/h2><p>Possessive pronouns stand alone. They replace a possessive adjective and a noun, so we do not repeat the noun.<\/p><div class=\"tw\"><table><tr><th>Possessive adjective<\/th><th>Possessive pronoun<\/th><th>Hausa<\/th><\/tr><tr><td>my<\/td><td>mine<\/td><td>nawa / tawa<\/td><\/tr><tr><td>your<\/td><td>yours<\/td><td>naka / taka<\/td><\/tr><tr><td>his<\/td><td>his<\/td><td>nasa / tasa<\/td><\/tr><tr><td>her<\/td><td>hers<\/td><td>nata / tata<\/td><\/tr><tr><td>our<\/td><td>ours<\/td><td>namu / tamu<\/td><\/tr><tr><td>their<\/td><td>theirs<\/td><td>nasu / tasu<\/td><\/tr><\/table><\/div><p>(“Its” has no possessive pronoun form that we commonly use.)<\/p>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>This book is mine.<\/td><td>Wannan littafin nawa ne.<\/td><\/tr><tr><td>That bag is hers.<\/td><td>Wancan jakar tata ce.<\/td><\/tr><tr><td>The shop is ours.<\/td><td>Shagon namu ne.<\/td><\/tr><tr><td>These phones are theirs.<\/td><td>Waɗannan wayoyin nasu ne.<\/td><\/tr><tr><td>Is this pen yours?<\/td><td>Wannan alƙalamin naka ne?<\/td><\/tr><tr><td>Yes, it is mine.<\/td><td>Ee, nawa ne.<\/td><\/tr><\/table><\/div><p>Compare: This is my book. (adjective + noun) and This book is mine. (pronoun alone).<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Possessive pronoun tana tsayawa ita kaɗai, ba tare da suna ba: “This book is mine” (Wannan littafin nawa ne). A Hausa, ana zaɓar “na” ko “ta” bisa ga jinsin abin da ake magana a kai.<\/div><h2>3.6 This, That, These, and Those<\/h2><p>We use this, that, these, and those to point to things. They show if something is near or far, and one or more than one.<\/p><div class=\"tw\"><table><tr><th><\/th><th>Near<\/th><th>Far<\/th><\/tr><tr><td>One<\/td><td>this: wannan<\/td><td>that: wancan<\/td><\/tr><tr><td>More than one<\/td><td>these: waɗannan<\/td><td>those: waɗancan<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>This is my shop.<\/td><td>Wannan shagona ne.<\/td><\/tr><tr><td>That is the school.<\/td><td>Wancan makaranta ce.<\/td><\/tr><tr><td>These are my goats.<\/td><td>Waɗannan awakina ne.<\/td><\/tr><tr><td>Those are your books.<\/td><td>Waɗancan littattafanka ne.<\/td><\/tr><\/table><\/div>", "<div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>This (wannan) da these (waɗannan) suna nuna abu kusa. That (wancan) da those (waɗancan) suna nuna abu nesa. This da that na abu ɗaya ne; these da those na abubuwa fiye da ɗaya ne.<\/div><h2>3.7 Pronouns in Daily Life<\/h2><p>Two classmates are looking for a bag. Read it aloud.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Musa: Aisha, is this your bag?<\/td><td>Musa: Aisha, wannan jakarki ce?<\/td><\/tr><tr><td>Aisha: No, it is not mine. Mine is red.<\/td><td>Aisha: A’a, ba tawa ba ce. Tawa ja ce.<\/td><\/tr><tr><td>Musa: Is it Fatima’s?<\/td><td>Musa: Ko ta Fatima ce?<\/td><\/tr><tr><td>Aisha: Yes, it is hers. She is in the class with her brother.<\/td><td>Aisha: Ee, tata ce. Tana cikin aji tare da ɗan’uwanta.<\/td><\/tr><\/table><\/div><p>Notice the pronouns: your, it, mine, hers, she, her.<\/p><h2>3.8 Common Mistakes and Corrections<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>Musa is my brother. It is a farmer.<\/td><td>Musa is my brother. He is a farmer.<\/td><td>Use “he” for a man; “it” is for things.<\/td><\/tr><tr><td>Me and Aisha are friends.<\/td><td>Aisha and I are friends.<\/td><td>Use “I” as the subject.<\/td><\/tr><tr><td>This is she bag.<\/td><td>This is her bag.<\/td><td>Use the possessive adjective “her”.<\/td><\/tr><tr><td>The goat eats it’s food.<\/td><td>The goat eats its food.<\/td><td>“its” shows possession.<\/td><\/tr><tr><td>The teacher helps we.<\/td><td>The teacher helps us.<\/td><td>Use the object pronoun “us”.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>Those is my phone.<\/td><td>That is my phone.<\/td><td>“That” is for one thing; “those” is for more than one.<\/td><\/tr><\/table><\/div><h2>3.9 Guided Practice<\/h2><p>Replace the nouns with pronouns step by step. Aisha sees Musa.<\/p><p>• Step 1: Aisha is the subject, a woman → She.<\/p><p>• Step 2: Musa is the object, a man → him.<\/p><p>• Result: She sees him.<\/p><h2>3.10 Exercises<\/h2><p>Exercise 3A: Replace the noun Write the correct subject pronoun.<br>1. Musa is a farmer. ___ sells maize.<br>2. Aisha is my sister. ___ is a nurse.<br>3. The book is new. ___ is useful.<br>4. My friends and I are students. ___ study in Kano.<br>5. Musa and Aisha are traders. ___ sell in the market.<\/p><p>Exercise 3B: Subject or object pronoun? Choose the correct word.<br>1. (I / Me) like rice.<br>2. Musa helps (we / us).<br>3. The teacher sees (they / them).<br>4. (She / Her) is my mother.<br>5. Please give the book to (he / him).<\/p>", "<p>Exercise 3C: Possessive adjectives Write my, your, his, her, its, our, or their.<br>1. I love ___ family.<br>2. Musa sells ___ maize in the market. (Musa)<br>3. Aisha and Fatima are in ___ classroom.<br>4. We love ___ school.<br>5. The goat eats ___ food.<br>6. You have ___ book. (to one person)<\/p><p>Exercise 3D: Possessive pronouns Write mine, yours, his, hers, ours, or theirs.<br>1. This phone belongs to me. It is ___.<br>2. That bag belongs to Aisha. It is ___.<br>3. These shops belong to them. They are ___.<br>4. The house belongs to us. It is ___.<br>5. Is this pen ___? (to one person)<\/p><p>Exercise 3E: This, that, these, those Write this, that, these, or those.<br>1. (one book, near me) ___ is my book.<br>2. (one school, far from me) ___ is my school.<br>3. (two phones, near me) ___ are my phones.<br>4. (three cars, far from me) ___ are their cars.<br>5. (many goats, near me) ___ are my goats.<\/p><p>Exercise 3F: Multiple choice<br>1. Which is correct? (a) Me and Aisha go to school. (b) Aisha and I go to school. (c) Aisha and me go to school.<br>2. In “The goat eats its food”, “its” is: (a) a verb (b) a possessive adjective (c) a noun<\/p>", "<p>3. Which is correct? (a) The goat eats it’s food. (b) The goat eats its food. (c) The goat eats its’ food. 4. This book is ___. (a) my (b) mine (c) me 5. (near, many shoes) ___ are my shoes. (a) This (b) That (c) These<\/p><p>Exercise 3G: Sentence correction Correct each sentence.<br>1. Musa is my brother. It is a farmer.<br>2. Me and Aisha are friends.<br>3. This is she bag.<br>4. The goat eats it’s food.<br>5. The teacher helps we.<br>6. Those is my phone.<\/p><p>Exercise 3H: Translation Hausa to English:<br>1. Wannan littafin nawa ne.<br>2. Tana sayar da kifi a kasuwa.<br>3. Makarantarmu babba ce.<br>4. Muna son su.<br>5. Wancan shagon nasa ne. English to Hausa:<br>6. This is my bag.<br>7. Those are their goats.<br>8. I see her.<br>9. Your book is on the table. (to a man)<br>10. The phone is hers.<\/p>", "<p>Exercise 3I: Everyday communication task Write four sentences about your family. Use my, his, her, and our at least once each.<\/p><h2>3.11 Chapter Summary<\/h2><p>• Pronouns replace nouns: I, you, he, she, it, we, they.<\/p><p>• Object pronouns come after verbs and prepositions: me, you, him, her, it, us, them.<\/p><p>• Possessive adjectives come before a noun: my, your, his, her, its, our, their.<\/p><p>• Possessive pronouns stand alone: mine, yours, his, hers, ours, theirs.<\/p><p>• This/that are for one; these/those are for more than one. This/these are near; that/those are far.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Taƙaitawa: Wakilin suna yana maye gurbin suna. A Turanci akwai wakilan mai aikatawa (I, you, he, she, it, we, they), na abin da aka aikata (me, him, her, us, them), kalmomin mallaka kafin suna (my, your…), da kalmomin mallaka masu zaman kansu (mine, yours…). Ka tuna: “its” ba shi da alamar ’, “it’s” kuma yana nufin “it is”.<\/div><h2>3.12 Review Questions<\/h2><p>1. What is a pronoun? Why do we use pronouns?<br>2. Write the object form of: I, he, she, we, they.<br>3. What is the difference between “my” and “mine”?<br>4. What is the difference between “its” and “it’s”?<br>5. When do we use “these” and “those”?<\/p>", "<div class=\"ch\">Chapter 4<\/div><h1>The Verb “To Be”: Am, Is, and Are<\/h1><p>Aikatau “To Be”: Am, Is, da Are<\/p><h2>Learning Objectives<\/h2><p>After this chapter, you will be able to:<\/p><p>• Use am, is, and are with the correct subject.<\/p><p>• Use the short forms: I’m, he’s, they’re, and so on.<\/p><p>• Make negative sentences with am not, is not, and are not.<\/p><p>• Ask questions and give short answers with am, is, and are.<\/p><p>• Use “there is” and “there are”.<\/p><p>• Avoid the common mistake of leaving out the verb “to be”.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Manufofin Babi: Bayan wannan babi, za ka iya amfani da am, is, da are daidai; ka yi jimlolin musantawa da tambaya da su; ka yi amfani da “there is” da “there are”; sannan ka guji kuskuren bar wa jimla aikatau na “to be”.<\/div><h2>4.1 What Is the Verb “To Be”?<\/h2><p>The verb to be links the subject to more information. It tells us who or what someone is, where something is, or how someone or something is. In the present, it has three forms: am, is, and are.<\/p><div class=\"tw\"><table><tr><th>Subject<\/th><th>Verb<\/th><th>Short form<\/th><th>Example<\/th><\/tr><tr><td>I<\/td><td>am<\/td><td>I’m<\/td><td>I am a student.<\/td><\/tr><tr><td>you<\/td><td>are<\/td><td>you’re<\/td><td>You are my friend.<\/td><\/tr><tr><td>he<\/td><td>is<\/td><td>he’s<\/td><td>He is a farmer.<\/td><\/tr><tr><td>she<\/td><td>is<\/td><td>she’s<\/td><td>She is a teacher.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Subject<\/th><th>Verb<\/th><th>Short form<\/th><th>Example<\/th><\/tr><tr><td>it<\/td><td>is<\/td><td>it’s<\/td><td>It is hot today.<\/td><\/tr><tr><td>we<\/td><td>are<\/td><td>we’re<\/td><td>We are neighbours.<\/td><\/tr><tr><td>they<\/td><td>are<\/td><td>they’re<\/td><td>They are in the market.<\/td><\/tr><\/table><\/div><p>Other subjects follow the same pattern: a singular noun takes is (Musa is here); a plural noun takes are (The shops are open); two subjects joined with and take are (Musa and Aisha are friends).<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>A Hausa ba mu da aikatau ɗaya kamar “to be”. Ana bayyana ma’anar ta hanyoyi daban-daban: ne/ce don nuna wane ne ko menene (Musa manomi ne), yana/tana/suna don wuri ko hali (Yara suna makaranta), da “akwai” don nuna samuwa.<\/td><\/tr><tr><td>A Turanci, kowace jimla da ke bayyana wane ne mutum, ina yake, ko yaya yake, dole ta ɗauki am, is, ko are. Kar ka bar su!<\/div><h2>4.2 Positive Sentences<\/h2><p>Here are the main uses of am, is, and are. Notice how Hausa says the same ideas in different ways.<\/p><p>1. To say who or what someone is (identity and jobs)<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Musa is a farmer.<\/td><td>Musa manomi ne.<\/td><\/tr><tr><td>Aisha is a teacher.<\/td><td>Aisha malama ce.<\/td><\/tr><tr><td>My brother is a driver.<\/td><td>Ɗan’uwana direba ne.<\/td><\/tr><tr><td>We are neighbours.<\/td><td>Maƙwabta ne mu.<\/td><\/tr><\/table><\/div><p>ne and ce<\/p>", "<p>In Hausa, ne is used after masculine and plural nouns and ce after feminine nouns. In English we always use is/are/am, and we say nothing about gender in the verb.<\/p><p>2. To describe someone or something<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>The market is big.<\/td><td>Kasuwa babba ce.<\/td><\/tr><tr><td>The bag is heavy.<\/td><td>Jakar tana da nauyi.<\/td><\/tr><tr><td>It is hot today.<\/td><td>Yau ana zafi.<\/td><\/tr><\/table><\/div><p>3. To say where someone or something is<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>The children are at school.<\/td><td>Yara suna makaranta.<\/td><\/tr><tr><td>They are in the mosque.<\/td><td>Suna cikin masallaci.<\/td><\/tr><tr><td>The rice is in the bag.<\/td><td>Shinkafar tana cikin buhu.<\/td><\/tr><\/table><\/div><p>4. To talk about feelings and conditions<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I am happy.<\/td><td>Ina farin ciki.<\/td><\/tr><tr><td>She is tired.<\/td><td>Tana gajiya.<\/td><\/tr><tr><td>We are hungry.<\/td><td>Muna jin yunwa.<\/td><\/tr><tr><td>They are thirsty.<\/td><td>Suna jin ƙishirwa.<\/td><\/tr><tr><td>I am fine.<\/td><td>Ina lafiya.<\/td><\/tr><\/table><\/div><p>5. To give your age In English we use be for age. We do not say “I have twenty years”.<\/p>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I am twenty years old.<\/td><td>Ina da shekara ashirin.<\/td><\/tr><tr><td>She is ten years old.<\/td><td>Tana da shekara goma.<\/td><\/tr><tr><td>He is twenty-five.<\/td><td>Yana da shekara ashirin da biyar.<\/td><\/tr><\/table><\/div><h2>4.3 Negative Sentences<\/h2><p>To make a negative sentence, add not after am, is, or are.<\/p><div class=\"tw\"><table><tr><th>Full form<\/th><th>Short form<\/th><\/tr><tr><td>I am not<\/td><td>I’m not<\/td><\/tr><tr><td>he / she / it is not<\/td><td>he’s not / he isn’t<\/td><\/tr><tr><td>you / we / they are not<\/td><td>you’re not / you aren’t<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Remember<\/b><br>We do not say “amn’t” in standard English. Say I’m not or I am not.<\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Musa is not a teacher.<\/td><td>Musa ba malami ba ne.<\/td><\/tr><tr><td>Aisha is not a farmer.<\/td><td>Aisha ba manomiya ba ce.<\/td><\/tr><tr><td>The market is not big.<\/td><td>Kasuwar ba babba ba ce.<\/td><\/tr><tr><td>He is not at home.<\/td><td>Ba ya gida.<\/td><\/tr><tr><td>She is not at home.<\/td><td>Ba ta gida.<\/td><\/tr><tr><td>They are not at school.<\/td><td>Ba sa makaranta.<\/td><\/tr><tr><td>I am not tired.<\/td><td>Ba na gajiya.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>A Turanci, ana ƙara not bayan am, is, ko are. A Hausa kuwa, ana amfani da “ba… ba” (Musa ba malami ba ne) ko “ba ya/ba ta/ba<\/div>", "<p>sa…” (Ba ya gida). Ka tuna: “I am not” ko “I’m not” ne daidai, ba “amn’t” ba.<\/p><h2>4.4 Questions and Short Answers<\/h2><p>To ask a question, put am, is, or are before the subject.<\/p><div class=\"tw\"><table><tr><th>Statement<\/th><th>Question<\/th><\/tr><tr><td>You are a student.<\/td><td>Are you a student?<\/td><\/tr><tr><td>Musa is at school.<\/td><td>Is Musa at school?<\/td><\/tr><tr><td>They are tired.<\/td><td>Are they tired?<\/td><\/tr><tr><td>I am late.<\/td><td>Am I late?<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Is Musa a farmer?<\/td><td>Musa manomi ne?<\/td><\/tr><tr><td>Is she at home?<\/td><td>Tana gida?<\/td><\/tr><tr><td>Are you a student?<\/td><td>Kai ɗalibi ne?<\/td><\/tr><tr><td>Are you tired?<\/td><td>Kana gajiya?<\/td><\/tr><\/table><\/div><p>We can also use a question word (who, what, where, how) before the verb.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Where is the market?<\/td><td>Ina kasuwar take?<\/td><\/tr><tr><td>Who is he?<\/td><td>Wane ne shi?<\/td><\/tr><tr><td>What is your name?<\/td><td>Menene sunanka? / Menene sunanki?<\/td><\/tr><tr><td>How are you?<\/td><td>Kana lafiya? / Kina lafiya?<\/td><\/tr><\/table><\/div>", "<p>Short answers In a short answer, use the verb be again. Do not use a short form in a positive short answer.<\/p><div class=\"tw\"><table><tr><th>Question<\/th><th>Positive short answer<\/th><th>Negative short answer<\/th><\/tr><tr><td>Are you a student?<\/td><td>Yes, I am.<\/td><td>No, I am not. / No, I’m not.<\/td><\/tr><tr><td>Is Musa at school?<\/td><td>Yes, he is.<\/td><td>No, he is not. / No, he isn’t.<\/td><\/tr><tr><td>Are they at home?<\/td><td>Yes, they are.<\/td><td>No, they are not. / No, they aren’t.<\/td><\/tr><\/table><\/div><p>Hausa example: Is Musa at school? → Musa yana makaranta? Yes, he is. → Ee, yana makaranta. No, he is not. → A’a, ba ya makaranta.<\/p><div class=\"box\"><b>Wrong: “Yes, he’s.”<\/b><br>We say Yes, he is. We do not say Yes, he’s.<\/div><h2>4.5 There Is and There Are<\/h2><p>We use there is for one thing and there are for more than one. We use them to say that something exists or is present in a place.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>There is a shop near the school.<\/td><td>Akwai shago kusa da makaranta.<\/td><\/tr><tr><td>There are many students in the class.<\/td><td>Akwai ɗalibai da yawa a aji.<\/td><\/tr><tr><td>There is some rice in the bag.<\/td><td>Akwai shinkafa a cikin buhu.<\/td><\/tr><\/table><\/div><p>Negative: There is not (isn’t) any water. Question: Is there a market near here? Are there any goats on the farm?<\/p><h4>Bayani da Hausa (Hausa Explanation)<\/h4>", "<p>A Hausa, ana amfani da “akwai” don nuna cewa wani abu yana nan. A Turanci, “there is” na abu ɗaya ne ko wanda ba a ƙirga (There is some rice), “there are” kuma na abubuwa da yawa (There are many students).<\/p><h2>4.6 “To Be” in Daily Life<\/h2><p>A teacher meets a new student. Read it aloud.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Teacher: Good morning. What is your name?<\/td><td>Malami: Ina kwana. Menene sunanka?<\/td><\/tr><tr><td>Student: My name is Ibrahim. I am from Kano.<\/td><td>Ɗalibi: Sunana Ibrahim. Ni ɗan Kano ne.<\/td><\/tr><tr><td>Teacher: How old are you?<\/td><td>Malami: Shekarunka nawa?<\/td><\/tr><tr><td>Student: I am twenty years old.<\/td><td>Ɗalibi: Ina da shekara ashirin.<\/td><\/tr><tr><td>Teacher: Are you a student?<\/td><td>Malami: Kai ɗalibi ne?<\/td><\/tr><tr><td>Student: Yes, I am. I am a student at the university.<\/td><td>Ɗalibi: Ee, ni ɗalibi ne a jami’a.<\/td><\/tr><tr><td>Teacher: Are your parents in Kano?<\/td><td>Malami: Iyayenka suna Kano?<\/td><\/tr><tr><td>Student: Yes, they are. My father is a farmer, and my mother is a trader.<\/td><td>Ɗalibi: Ee, suna Kano. Mahaifina manomi ne, mahaifiyata kuma ’yar kasuwa ce.<\/td><\/tr><\/table><\/div><h2>4.7 Common Mistakes and Corrections<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>He a teacher.<\/td><td>He is a teacher.<\/td><td>English needs the verb “to be”. (Dole a faɗi “is”.)<\/td><\/tr><tr><td>The market big.<\/td><td>The market is big.<\/td><td>Do not leave out “is”.<\/td><\/tr><tr><td>They in the shop.<\/td><td>They are in the shop.<\/td><td>Add “are” before a place.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>I is a trader.<\/td><td>I am a trader.<\/td><td>Use “am” with “I”.<\/td><\/tr><tr><td>They is farmers.<\/td><td>They are farmers.<\/td><td>Use “are” with “they”.<\/td><\/tr><tr><td>Musa and Aisha is friends.<\/td><td>Musa and Aisha are friends.<\/td><td>Two subjects joined by “and” take “are”.<\/td><\/tr><tr><td>I am agree.<\/td><td>I agree.<\/td><td>“Agree” is a verb, so we do not add “am”. (Aikatau ne; Chapter 5 will explain.)<\/td><\/tr><\/table><\/div><h2>4.8 Guided Practice<\/h2><p>Make a question and a negative sentence from Musa is at home.<\/p><p>• Question: put is before the subject → Is Musa at home?<\/p><p>• Negative: add not after is → Musa is not at home.<\/p><p>• Short answers: Yes, he is. / No, he is not.<\/p><h2>4.9 Exercises<\/h2><p>Exercise 4A: Fill in am, is, or are<br>1. I ___ a student.<br>2. Musa ___ my brother.<br>3. We ___ friends.<br>4. The shops ___ open.<br>5. It ___ hot today.<br>6. Aisha and Fatima ___ in the class.<br>7. You ___ my teacher.<br>8. The rice ___ in the bag.<\/p><p>Exercise 4B: Short forms Write the short form.<br>1. I am<br>2. She is<br>3. They are<br>4. We are<br>5. It is<br>6. You are<\/p>", "<p>Exercise 4C: Negative sentences Make each sentence negative.<br>1. I am a driver.<br>2. Musa is at home.<br>3. They are farmers.<br>4. The market is big.<br>5. We are late.<\/p><p>Exercise 4D: Questions Make each sentence a question.<br>1. You are a student.<br>2. Aisha is at school.<br>3. They are in the shop.<br>4. The food is hot.<br>5. Musa is your brother.<\/p><p>Exercise 4E: Short answers Complete each short answer.<br>1. Is Musa a farmer? Yes, he ___.<br>2. Are you tired? No, I ___ not.<br>3. Are they at home? Yes, they ___.<br>4. Is the shop open? No, it ___ not.<br>5. Are Aisha and Fatima sisters? Yes, they ___.<\/p><p>Exercise 4F: There is or there are<br>1. ___ a shop near the school.<br>2. ___ many students in the class.<br>3. ___ some rice in the bag.<br>4. ___ two goats on the farm.<\/p>", "<p>Exercise 4G: Multiple choice<br>1. She ___ a nurse. (a) am (b) is (c) are<br>2. They ___ in the market. (a) is (b) am (c) are<br>3. Which is correct? (a) I is hungry. (b) I am hungry. (c) I are hungry.<br>4. Which is a question? (a) Is he a farmer? (b) He is a farmer. (c) He is not a farmer.<br>5. Musa and Aisha ___ friends. (a) is (b) are (c) am<\/p><p>Exercise 4H: Sentence correction Correct each sentence.<br>1. He a teacher.<br>2. I is a trader.<br>3. They is at school.<br>4. Musa and Aisha is friends.<br>5. The market big.<br>6. I am agree.<\/p><p>Exercise 4I: Sentence construction<br>1. Write about your job or school using “am”.<br>2. Write about your father or mother using “is”.<br>3. Write about your friends using “are”.<br>4. Write a question with “Is”.<br>5. Write a negative sentence with “is not”.<\/p><p>Exercise 4J: Translation Hausa to English:<br>1. Ni ɗalibi ne. (a man speaking)<br>2. Mahaifiyata malama ce.<br>3. Suna cikin masallaci.<\/p>", "<p>4. Musa ba ya gida. 5. Kana gajiya? English to Hausa: 6. My brother is a driver. 7. We are neighbours. 8. The students are in the class. 9. She is not a farmer. 10. Is the market big?<\/p><p>Exercise 4K: Everyday communication task Complete the dialogue with am, is, or are. Then read it aloud with a friend.<\/p><p>A: Good morning. What ___ your name? B: My name ___ Amina. A: ___ you a student? B: Yes, I ___.<\/p><h2>4.10 Chapter Summary<\/h2><p>• Use am with I, is with he/she/it and singular nouns, are with you/we/they and plural nouns.<\/p><p>• Negative: add not (I am not; he is not; they are not).<\/p><p>• Question: put am/is/are before the subject (Are you a student?).<\/p><p>• Short answers: Yes, I am. / No, he is not. Never “Yes, he’s.”<\/p><p>• There is = one or uncountable; there are = more than one.<\/p><p>• Never leave out am/is/are in English.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Taƙaitawa: A Turanci, am na “I” ne, is na he/she/it da suna ɗaya, are na you/we/they da jam’i. Ana musantawa da not. Ana tambaya<\/div>", "<p>ta sa am/is/are kafin mai aikatawa. Kar a bar aikatau na “to be” a jimla, domin Hausa na iya barinsa amma Turanci ba ya yarda.<\/p><h2>4.11 Review Questions<\/h2><p>1. Which form of “to be” do we use with “I”?<br>2. Make “They are farmers” negative and a question.<br>3. What is wrong with “He a teacher”?<br>4. How do we answer “Is Musa at home?” in a short answer?<br>5. When do we use “there is” and “there are”?<\/p>", "<div class=\"ch\">Chapter 5<\/div><h1>Simple Present Tense<\/h1><p>Zamanin Yanzu Mai Sauƙi: Abin da Ake Yi Kullum<\/p><h2>Learning Objectives<\/h2><p>After this chapter, you will be able to:<\/p><p>• Use the simple present tense for habits, routines, facts, and permanent situations.<\/p><p>• Add -s or -es correctly with he, she, and it.<\/p><p>• Make simple negative sentences with do not and does not.<\/p><p>• Ask simple questions with do and does, and give short answers.<\/p><p>• Use words like always, usually, often, sometimes, and never.<\/p><p>• Use have and has correctly.<\/p><p>• Recognise the present continuous (am/is/are + verb-ing) and tell it apart from the simple present.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Manufofin Babi: Bayan wannan babi, za ka iya amfani da simple present don faɗin abin da ake yi kullum, gaskiyar da ba ta canzawa, da halin da ya daɗe; ka ƙara -s ko -es daidai; ka yi jimlolin musantawa da tambaya da do/does; sannan ka yi amfani da kalmomi kamar always, usually, often, sometimes, never.<\/div><h2>5.1 What Is the Simple Present Tense?<\/h2><p>We use the simple present tense to talk about things that happen again and again, things that are always true, and situations that stay the same for a long time.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I sell rice in the market.<\/td><td>Ina sayar da shinkafa a kasuwa.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Musa gets up at five o’clock.<\/td><td>Musa yakan tashi da ƙarfe biyar.<\/td><\/tr><tr><td>A hen lays eggs.<\/td><td>Kaza tana yin ƙwai.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Simple present ana amfani da shi don abin da ake yi akai-akai (Musa yakan tashi da ƙarfe biyar), gaskiyar da ba ta canzawa (Kaza tana yin ƙwai), da halin da ya daɗe (Mahaifina yana aiki a gona).<\/td><\/tr><tr><td>Ka lura: a Hausa, kalmomi kamar “ina”, “yana”, “suna” suna iya nufin abin da ake yi yanzu ko abin da ake yi kullum. A Turanci kuwa, akwai bambanci: “I sell rice” (kullum) da “I am selling rice now” (yanzu). A wannan babi muna koyon na farko sosai. Za a gabatar da na biyun a taƙaice a sashe na 5.7, sannan a yi cikakken bayani a Littafi na 2.<\/div><h2>5.2 How to Form the Simple Present<\/h2><p>With I, you, we, and they, use the base form of the verb (the verb with no ending). With he, she, and it, add -s or -es.<\/p><div class=\"tw\"><table><tr><th>Subject<\/th><th>Verb<\/th><th>Hausa meaning<\/th><\/tr><tr><td>I<\/td><td>sell<\/td><td>Ina sayar da shinkafa.<\/td><\/tr><tr><td>you<\/td><td>sell<\/td><td>Kana sayar da shinkafa.<\/td><\/tr><tr><td>he<\/td><td>sells<\/td><td>Yana sayar da shinkafa.<\/td><\/tr><tr><td>she<\/td><td>sells<\/td><td>Tana sayar da shinkafa.<\/td><\/tr><tr><td>we<\/td><td>sell<\/td><td>Muna sayar da shinkafa.<\/td><\/tr><tr><td>they<\/td><td>sell<\/td><td>Suna sayar da shinkafa.<\/td><\/tr><\/table><\/div><p>A singular noun takes the same form as he/she/it: Musa sells rice. A plural noun takes the same form as they: The traders sell rice.<\/p>", "<p>Spelling rules for he, she, and it<\/p><p>• Most verbs: add -s → work → works; sell → sells; read → reads.<\/p><p>• Verbs ending in s, sh, ch, x, z, or o: add -es → watch → watches; wash → washes; fix → fixes; go → goes; do → does.<\/p><p>• Consonant + y: change y to -ies → study → studies; carry → carries; try → tries.<\/p><p>• Vowel + y: add -s → play → plays; buy → buys; pay → pays.<\/p><p>• Irregular: have → has.<\/p><div class=\"tw\"><table><tr><th>Base verb<\/th><th>he / she / it<\/th><th>Hausa meaning<\/th><\/tr><tr><td>work<\/td><td>works<\/td><td>yi aiki<\/td><\/tr><tr><td>sell<\/td><td>sells<\/td><td>sayar<\/td><\/tr><tr><td>eat<\/td><td>eats<\/td><td>ci<\/td><\/tr><tr><td>read<\/td><td>reads<\/td><td>karanta<\/td><\/tr><tr><td>go<\/td><td>goes<\/td><td>tafi<\/td><\/tr><tr><td>do<\/td><td>does<\/td><td>yi<\/td><\/tr><tr><td>watch<\/td><td>watches<\/td><td>kalla<\/td><\/tr><tr><td>wash<\/td><td>washes<\/td><td>wanke<\/td><\/tr><tr><td>teach<\/td><td>teaches<\/td><td>koyar<\/td><\/tr><tr><td>fix<\/td><td>fixes<\/td><td>gyara<\/td><\/tr><tr><td>study<\/td><td>studies<\/td><td>yi karatu<\/td><\/tr><tr><td>carry<\/td><td>carries<\/td><td>ɗauka<\/td><\/tr><tr><td>try<\/td><td>tries<\/td><td>gwada<\/td><\/tr><tr><td>play<\/td><td>plays<\/td><td>yi wasa<\/td><\/tr><tr><td>buy<\/td><td>buys<\/td><td>saya<\/td><\/tr><tr><td>pay<\/td><td>pays<\/td><td>biya<\/td><\/tr><tr><td>have<\/td><td>has<\/td><td>mallaka (ina da)<\/td><\/tr><\/table><\/div><h4>Bayani da Hausa (Hausa Explanation)<\/h4>", "<p>A Turanci, idan mai aikatawa he, she, it, ko suna ɗaya ne, aikatau yana ƙara -s ko -es: “He sells”, “She goes”. Wannan ba ya faruwa a Hausa, don haka masu koyo kan manta. Ka tuna: “I sell”, amma “he sells”.<\/p><h2>5.3 When Do We Use the Simple Present?<\/h2><p>1. Habits and routines<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Musa goes to school every day.<\/td><td>Musa yakan tafi makaranta kowace rana.<\/td><\/tr><tr><td>My mother cooks in the evening.<\/td><td>Mahaifiyata tana dafa abinci da yamma.<\/td><\/tr><tr><td>We eat rice on Fridays.<\/td><td>Muna cin sh
