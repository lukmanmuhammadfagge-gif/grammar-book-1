e sees someone. (use anyone)<br>4. We have some eggs. (use any)<br>5. He is always late. (use never)<\/p><p>Exercise 10G: Multiple choice<br>1. Which is correct? (a) He not sell fish. (b) He does not sell fish. (c) He does not sells fish.<br>2. Which is correct? (a) I don’t have nothing. (b) I don’t have anything. (c) I not have anything.<br>3. “Do ___ forget your book.” (a) not (b) no (c) never<br>4. There is ___ water. (a) not (b) no (c) nothing<br>5. Which is correct? (a) She doesn’t likes rice. (b) She doesn’t like rice. (c) She don’t like rice.<\/p><p>Exercise 10H: Sentence correction Correct each sentence.<br>1. He not sell fish.<br>2. She doesn’t sells fish.<br>3. I not have a phone.<\/p>", "<p>4. I don’t have nothing. 5. They are not farmer. 6. I am not agree. 7. She don’t like rice. 8. Nobody don’t know the answer.<\/p><p>Exercise 10I: Sentence construction<br>1. Write a negative sentence with “is not”.<br>2. Write a negative sentence with “does not”.<br>3. Write a negative command with “Do not”.<br>4. Write a sentence with “never”.<br>5. Write a sentence with “no” + a noun.<\/p><p>Exercise 10J: Translation Hausa to English:<br>1. Mahaifina ba malami ba ne.<br>2. Ba na sayar da kifi.<br>3. Ba shi da keke.<br>4. Babu ruwa a gida.<br>5. Kada ka makara. (to a man) English to Hausa:<br>6. This bag is not mine.<br>7. They do not eat meat.<br>8. We do not have eggs today.<br>9. Nobody is at home.<br>10. Do not forget your book. (to a man)<\/p>", "<p>Exercise 10K: Everyday communication task Write five negative sentences about yourself and your family (things you do not do or do not have). Use at least one sentence with “never” and one negative command.<\/p><h2>10.12 Chapter Summary<\/h2><p>• With am/is/are: add not (is not, are not, I am not).<\/p><p>• With other verbs in the present: do not / does not + base verb.<\/p><p>• Short forms: isn’t, aren’t, don’t, doesn’t, I’m not.<\/p><p>• Negative commands: Do not / Don’t + base verb.<\/p><p>• No = not any; never = not at any time; nobody and nothing are negative words.<\/p><p>• English uses only one negative in a sentence.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Taƙaitawa: A Turanci, ana musantawa da not bayan am/is/are, ko do not / does not kafin aikatau na asali (ba tare da -s ba). Hani: Do not + aikatau. No, never, nobody, nothing kalmomin musantawa ne; kada a haɗa biyu a jimla ɗaya (“I don’t have nothing” ✗).<\/div><h2>10.13 Review Questions<\/h2><p>1. How do we make a negative sentence with “is”, “are”, and “am”?<br>2. Make “She teaches English” negative.<br>3. What is the short form of “does not” and “are not”?<br>4. What is wrong with “I don’t have nothing”? Correct it two ways.<br>5. Write a negative command about being late.<\/p>", "<div class=\"ch\">Chapter 11<\/div><h1>Simple Past Tense<\/h1><p>Zamanin da Ya Wuce Mai Sauƙi<\/p><h2>Learning Objectives<\/h2><p>After this chapter, you will be able to:<\/p><p>• Use the simple past tense to talk about finished actions.<\/p><p>• Form the past tense of regular verbs and spell it correctly.<\/p><p>• Use common irregular past forms, including was and were.<\/p><p>• Make negative sentences with did not (didn’t) and questions with did.<\/p><p>• Use past time words such as yesterday, last week, and ago.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Manufofin Babi: Bayan wannan babi, za ka iya amfani da simple past don magana a kan abin da ya wuce; ka yi past na kalmomi na yau da kullum (regular) da na keɓantattu (irregular); ka yi amfani da was/were; ka yi jimlar musantawa da did not da tambaya da did; sannan ka yi amfani da kalmomin lokaci kamar yesterday da last week.<\/div><h2>11.1 What Is the Simple Past Tense?<\/h2><p>We use the simple past tense to talk about actions that started and finished in the past. Often we say when it happened.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I went to the market yesterday.<\/td><td>Na tafi kasuwa jiya.<\/td><\/tr><tr><td>We cooked rice last night.<\/td><td>Mun dafa shinkafa daren jiya.<\/td><\/tr><tr><td>Aisha studied English last year.<\/td><td>Aisha ta yi karatun Turanci bara.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Time word<\/th><th>Hausa<\/th><\/tr><tr><td>yesterday<\/td><td>jiya<\/td><\/tr><tr><td>last night<\/td><td>daren jiya<\/td><\/tr><tr><td>last week<\/td><td>makon da ya wuce<\/td><\/tr><tr><td>last month<\/td><td>watan da ya wuce<\/td><\/tr><tr><td>last year<\/td><td>bara<\/td><\/tr><tr><td>two days ago<\/td><td>kwana biyu da suka wuce<\/td><\/tr><tr><td>this morning (it is over)<\/td><td>yau da safe<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Simple past yana nuna aikin da ya faru ya kuma ƙare. A Hausa, ana nuna wannan da “na, ka/kin, ya, ta, mun, kun, sun” a gaban aikatau: Na tafi, Ya tafi, Sun tafi.<\/td><\/tr><tr><td>A Turanci kuwa, aikatau yana canzawa sau ɗaya (go → went), kuma iri ɗaya ne ga kowane mai aikatawa: I went, he went, they went. Ba a ƙara -s ba.<\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I went<\/td><td>Na tafi<\/td><\/tr><tr><td>you went<\/td><td>Ka tafi (namiji) / Kin tafi (mace)<\/td><\/tr><tr><td>he went<\/td><td>Ya tafi<\/td><\/tr><tr><td>she went<\/td><td>Ta tafi<\/td><\/tr><tr><td>we went<\/td><td>Mun tafi<\/td><\/tr><tr><td>you went (plural)<\/td><td>Kun tafi<\/td><\/tr><tr><td>they went<\/td><td>Sun tafi<\/td><\/tr><\/table><\/div>", "<h2>11.2 Regular Verbs: Add -ed<\/h2><p>Most verbs are regular. To make the past, add -ed (or -d). The past form is the same for every subject.<\/p><p>Spelling rules<\/p><p>• Most verbs: add -ed → work → worked; play → played; cook → cooked; clean → cleaned.<\/p><p>• Verbs ending in e: add -d → live → lived; like → liked; use → used.<\/p><p>• Consonant + y: change y to -ied → study → studied; carry → carried; try → tried.<\/p><p>• Vowel + y: add -ed → play → played; stay → stayed.<\/p><p>• One short syllable ending in consonant–vowel–consonant: double the last letter → stop → stopped; plan → planned.<\/p><div class=\"tw\"><table><tr><th>Base verb<\/th><th>Past<\/th><th>Hausa meaning<\/th><\/tr><tr><td>work<\/td><td>worked<\/td><td>yi aiki<\/td><\/tr><tr><td>play<\/td><td>played<\/td><td>yi wasa<\/td><\/tr><tr><td>cook<\/td><td>cooked<\/td><td>dafa<\/td><\/tr><tr><td>walk<\/td><td>walked<\/td><td>yi tafiya<\/td><\/tr><tr><td>clean<\/td><td>cleaned<\/td><td>share<\/td><\/tr><tr><td>live<\/td><td>lived<\/td><td>zauna<\/td><\/tr><tr><td>like<\/td><td>liked<\/td><td>so<\/td><\/tr><tr><td>study<\/td><td>studied<\/td><td>yi karatu<\/td><\/tr><tr><td>carry<\/td><td>carried<\/td><td>ɗauka<\/td><\/tr><tr><td>try<\/td><td>tried<\/td><td>gwada<\/td><\/tr><tr><td>stay<\/td><td>stayed<\/td><td>zauna<\/td><\/tr><tr><td>stop<\/td><td>stopped<\/td><td>tsaya / daina<\/td><\/tr><tr><td>plan<\/td><td>planned<\/td><td>shirya<\/td><\/tr><tr><td>want<\/td><td>wanted<\/td><td>so<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Base verb<\/th><th>Past<\/th><th>Hausa meaning<\/th><\/tr><tr><td>need<\/td><td>needed<\/td><td>buƙata<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Musa worked on the farm yesterday.<\/td><td>Musa ya yi aiki a gona jiya.<\/td><\/tr><tr><td>We cooked rice last night.<\/td><td>Mun dafa shinkafa daren jiya.<\/td><\/tr><tr><td>They played football after school.<\/td><td>Sun yi wasan ƙwallon ƙafa bayan makaranta.<\/td><\/tr><tr><td>I cleaned the house this morning.<\/td><td>Na share gida yau da safe.<\/td><\/tr><tr><td>She studied English last year.<\/td><td>Ta yi karatun Turanci bara.<\/td><\/tr><\/table><\/div><p>Pronunciation: the -ed ending sounds like /t/ after some verbs (worked), like /d/ after others (played), and like /id/ after t and d (wanted, needed).<\/p><h2>11.3 Irregular Verbs<\/h2><p>Some very common verbs are irregular. They do not take -ed. You must learn each past form.<\/p><div class=\"tw\"><table><tr><th>Base verb<\/th><th>Past<\/th><th>Hausa meaning<\/th><\/tr><tr><td>go<\/td><td>went<\/td><td>tafi<\/td><\/tr><tr><td>come<\/td><td>came<\/td><td>zo<\/td><\/tr><tr><td>see<\/td><td>saw<\/td><td>gani<\/td><\/tr><tr><td>eat<\/td><td>ate<\/td><td>ci<\/td><\/tr><tr><td>drink<\/td><td>drank<\/td><td>sha<\/td><\/tr><tr><td>buy<\/td><td>bought<\/td><td>saya<\/td><\/tr><tr><td>sell<\/td><td>sold<\/td><td>sayar<\/td><\/tr><tr><td>have<\/td><td>had<\/td><td>mallaka (da)<\/td><\/tr><tr><td>do<\/td><td>did<\/td><td>yi<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Base verb<\/th><th>Past<\/th><th>Hausa meaning<\/th><\/tr><tr><td>make<\/td><td>made<\/td><td>yi<\/td><\/tr><tr><td>take<\/td><td>took<\/td><td>ɗauka<\/td><\/tr><tr><td>give<\/td><td>gave<\/td><td>ba<\/td><\/tr><tr><td>get<\/td><td>got<\/td><td>samu<\/td><\/tr><tr><td>know<\/td><td>knew<\/td><td>sani<\/td><\/tr><tr><td>say<\/td><td>said<\/td><td>ce<\/td><\/tr><tr><td>tell<\/td><td>told<\/td><td>gaya<\/td><\/tr><tr><td>write<\/td><td>wrote<\/td><td>rubuta<\/td><\/tr><tr><td>read<\/td><td>read (sounds like “red”)<\/td><td>karanta<\/td><\/tr><tr><td>run<\/td><td>ran<\/td><td>gudu<\/td><\/tr><tr><td>sit<\/td><td>sat<\/td><td>zauna<\/td><\/tr><tr><td>stand<\/td><td>stood<\/td><td>tsaya (tsaye)<\/td><\/tr><tr><td>sleep<\/td><td>slept<\/td><td>yi barci<\/td><\/tr><tr><td>leave<\/td><td>left<\/td><td>bar<\/td><\/tr><tr><td>bring<\/td><td>brought<\/td><td>kawo<\/td><\/tr><tr><td>pay<\/td><td>paid<\/td><td>biya<\/td><\/tr><tr><td>meet<\/td><td>met<\/td><td>haɗu da<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I went to the market yesterday.<\/td><td>Na tafi kasuwa jiya.<\/td><\/tr><tr><td>She bought rice.<\/td><td>Ta sayi shinkafa.<\/td><\/tr><tr><td>We ate rice and beans.<\/td><td>Mun ci shinkafa da wake.<\/td><\/tr><tr><td>He saw his friend.<\/td><td>Ya ga abokinsa.<\/td><\/tr><tr><td>They came early.<\/td><td>Sun zo da wuri.<\/td><\/tr><tr><td>Musa sold maize.<\/td><td>Musa ya sayar da masara.<\/td><\/tr><tr><td>My father gave me money.<\/td><td>Mahaifina ya ba ni kuɗi.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I wrote a letter.<\/td><td>Na rubuta wasiƙa.<\/td><\/tr><\/table><\/div><p>Was and were Was and were are the past of am, is, are.<\/p><div class=\"tw\"><table><tr><th>Subject<\/th><th>Past of be<\/th><th>Example<\/th><\/tr><tr><td>I, he, she, it<\/td><td>was<\/td><td>The market was crowded.<\/td><\/tr><tr><td>you, we, they<\/td><td>were<\/td><td>They were tired.<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>The market was crowded yesterday.<\/td><td>Jiya kasuwar ta cika da mutane.<\/td><\/tr><tr><td>They were tired.<\/td><td>Sun gaji.<\/td><\/tr><tr><td>I was at school yesterday.<\/td><td>Jiya ina makaranta.<\/td><\/tr><\/table><\/div><h2>11.4 Negative Sentences: Did Not<\/h2><p>To make a past negative, use did not (didn’t) + the base verb (no -ed, no past form).<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I did not go to school.<\/td><td>Ban tafi makaranta ba.<\/td><\/tr><tr><td>Musa did not sell fish yesterday.<\/td><td>Musa bai sayar da kifi jiya ba.<\/td><\/tr><tr><td>We did not eat meat.<\/td><td>Ba mu ci nama ba.<\/td><\/tr><tr><td>She did not cook rice.<\/td><td>Ba ta dafa shinkafa ba.<\/td><\/tr><tr><td>They did not come.<\/td><td>Ba su zo ba.<\/td><\/tr><\/table><\/div><p>With was/were, add not: He was not (wasn’t) at home. They were not (weren’t) tired.<\/p>", "<div class=\"box\"><b>Remember<\/b><br>After did not, use the base verb: “I did not go”, not “I did not went”. The past is already shown by did.<\/div><h2>11.5 Questions and Short Answers<\/h2><p>Put Did at the beginning, then the subject, then the base verb.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Did you go to school?<\/td><td>Ka tafi makaranta?<\/td><\/tr><tr><td>Did Musa sell fish?<\/td><td>Musa ya sayar da kifi?<\/td><\/tr><tr><td>Did they come?<\/td><td>Sun zo?<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>Question<\/th><th>Yes<\/th><th>No<\/th><\/tr><tr><td>Did you go to school?<\/td><td>Yes, I did.<\/td><td>No, I did not. / No, I didn’t.<\/td><\/tr><tr><td>Was the market big?<\/td><td>Yes, it was.<\/td><td>No, it was not. / No, it wasn’t.<\/td><\/tr><tr><td>Were they at home?<\/td><td>Yes, they were.<\/td><td>No, they were not. / No, they weren’t.<\/td><\/tr><\/table><\/div><p>Question words go first:<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>What did you buy?<\/td><td>Me ka saya?<\/td><\/tr><tr><td>Where did she go?<\/td><td>Ina ta tafi?<\/td><\/tr><tr><td>When did they arrive?<\/td><td>Yaushe suka isa?<\/td><\/tr><tr><td>Who came?<\/td><td>Wa ya zo?<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Who as subject<\/b><br>When who or what is the subject, do not use did: Who came? (not “Who did come?”).<\/div>", "<h2>11.6 The Simple Past in Daily Life<\/h2><p>Two friends talk on Monday. Read it aloud.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Musa: Did you go to the market on Saturday?<\/td><td>Musa: Kin je kasuwa ranar Asabar?<\/td><\/tr><tr><td>Aisha: Yes, I did. I bought rice and tomatoes.<\/td><td>Aisha: Ee, na je. Na sayi shinkafa da tumatur.<\/td><\/tr><tr><td>Musa: Did you see Fatima there?<\/td><td>Musa: Kin ga Fatima a can?<\/td><\/tr><tr><td>Aisha: No, I did not see her. She did not go to the market.<\/td><td>Aisha: A’a, ban gan ta ba. Ba ta je kasuwa ba.<\/td><\/tr><tr><td>Musa: What did you do on Sunday?<\/td><td>Musa: Me kika yi ranar Lahadi?<\/td><\/tr><tr><td>Aisha: I stayed at home. I cooked and cleaned the house.<\/td><td>Aisha: Na zauna a gida. Na dafa abinci, na kuma share gida.<\/td><\/tr><\/table><\/div><h2>11.7 Common Mistakes and Corrections<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>I go to the market yesterday.<\/td><td>I went to the market yesterday.<\/td><td>Use the past form with a past time word.<\/td><\/tr><tr><td>She goed home.<\/td><td>She went home.<\/td><td>“Go” is irregular.<\/td><\/tr><tr><td>He didn’t went to school.<\/td><td>He didn’t go to school.<\/td><td>After didn’t, use the base verb.<\/td><\/tr><tr><td>Did you saw Musa?<\/td><td>Did you see Musa?<\/td><td>After did, use the base verb.<\/td><\/tr><tr><td>Musa buyed fish.<\/td><td>Musa bought fish.<\/td><td>“Buy” is irregular.<\/td><\/tr><tr><td>I was go to school.<\/td><td>I went to school.<\/td><td>Do not use was before a main verb.<\/td><\/tr><tr><td>She studyed English.<\/td><td>She studied English.<\/td><td>Consonant + y → -ied.<\/td><\/tr><tr><td>We stoped at the gate.<\/td><td>We stopped at the gate.<\/td><td>Double the p.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>Yesterday I am at school.<\/td><td>Yesterday I was at school.<\/td><td>Use was with a past time word.<\/td><\/tr><\/table><\/div><h2>11.8 Guided Practice<\/h2><p>Write about Musa / sell / maize / yesterday in the past.<\/p><p>• “Sell” is irregular → sold.<\/p><p>• Positive: Musa sold maize yesterday.<\/p><p>• Negative: Musa did not sell maize yesterday. (base verb: sell)<\/p><p>• Question: Did Musa sell maize yesterday? (base verb: sell)<\/p><h2>11.9 Exercises<\/h2><p>Exercise 11A: Regular past forms Write the past form.<br>1. work<br>2. live<br>3. study<br>4. stop<br>5. play<br>6. carry<br>7. plan<br>8. clean<br>9. like<br>10. try<\/p><p>Exercise 11B: Irregular past forms Write the past form.<br>1. go<br>2. see<br>3. eat<br>4. buy<br>5. come<br>6. sell<br>7. write<br>8. give<br>9. have<br>10. make<\/p><p>Exercise 11C: Complete the sentences Write the simple past of the verb in brackets.<br>1. Musa (sell) maize yesterday.<br>2. We (cook) rice last night.<br>3. Aisha (go) to school on Monday.<br>4. They (play) football after school.<br>5. I (buy) a new phone last week.<\/p>", "<p>6. She (be) at home yesterday. 7. The children (be) tired. 8. My father (come) home late.<\/p><p>Exercise 11D: Negative sentences Make each sentence negative.<br>1. I went to school.<br>2. Musa sold fish.<br>3. They came early.<br>4. We ate meat.<br>5. She was at home.<br>6. They were tired.<\/p><p>Exercise 11E: Questions Make each sentence a question.<br>1. You went to the market.<br>2. Musa sold maize.<br>3. They came early.<br>4. She was at school.<br>5. You were tired.<\/p><p>Exercise 11F: Questions with question words Write a question about the words in capital letters.<br>1. Aisha bought RICE.<br>2. Musa went TO KANO.<br>3. They arrived YESTERDAY.<br>4. MUSA sold the goat.<br>5. They went to school BY BUS.<\/p><p>Exercise 11G: Short answers Write a short answer.<\/p>", "<p>1. Did you go to school? (Yes)<br>2. Did Musa sell fish? (No)<br>3. Were they at home? (Yes)<br>4. Was the market big? (No)<br>5. Did she cook rice? (Yes)<\/p><p>Exercise 11H: Multiple choice<br>1. The past of “go” is: (a) goed (b) went (c) gone<br>2. Which is correct? (a) I didn’t went. (b) I didn’t go. (c) I not go.<br>3. Which is correct? (a) Did you saw him? (b) Did you see him? (c) Do you saw him?<br>4. The past of “study” is: (a) studyed (b) studied (c) studdied<br>5. She ___ at home yesterday. (a) is (b) was (c) were<\/p><p>Exercise 11I: Sentence correction Correct each sentence.<br>1. I go to the market yesterday.<br>2. She goed home.<br>3. He didn’t went to school.<br>4. Did you saw Musa?<br>5. Musa buyed fish.<br>6. I was go to school.<br>7. They didn’t came.<br>8. She studyed English.<br>9. We stoped at the gate.<br>10. Yesterday I am at school.<\/p><p>Exercise 11J: Sentence construction<br>1. Write two sentences about what you did yesterday.<br>2. Write a negative sentence with “did not”.<\/p>", "<p>3. Write a question with “Did”. 4. Write a sentence with “was” or “were”. 5. Write a sentence with “ago”.<\/p><p>Exercise 11K: Translation Hausa to English:<br>1. Na tafi kasuwa jiya.<br>2. Mun dafa shinkafa daren jiya.<br>3. Ba su zo ba.<br>4. Ta sayi sabuwar waya.<br>5. Musa bai sayar da kifi ba. English to Hausa:<br>6. Musa worked on the farm yesterday.<br>7. We ate rice and beans.<br>8. She did not cook rice.<br>9. Did you go to school? (to a man)<br>10. They came early.<\/p><p>Exercise 11L: Everyday communication task Write five sentences about what you did last weekend. Use the simple past tense.<\/p><h2>11.10 Chapter Summary<\/h2><p>• Use the simple past for actions that started and finished in the past.<\/p><p>• Regular verbs: add -ed (-d; -ied after consonant + y; double the last letter in short verbs like stop).<\/p><p>• Irregular verbs must be learned: go → went, see → saw, buy → bought, and so on.<\/p><p>• Be: was (I, he, she, it) and were (you, we, they).<\/p>", "<p>• Negative: did not + base verb. Question: Did + subject + base verb.<\/p><p>• The past form is the same for every subject. Never add -s.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Taƙaitawa: Simple past yana nuna abin da ya faru ya ƙare. Kalmomi na yau da kullum suna ƙara -ed; masu keɓanta kuma dole a koye su (go → went). Was/were su ne past na am/is/are. Don musantawa: did not + aikatau na asali; don tambaya: Did + mai aikatawa + aikatau na asali. Bayan did, aikatau ba ya komawa past: “Did you see him?” ba “Did you saw him?” ba.<\/div><h2>11.11 Review Questions<\/h2><p>1. When do we use the simple past tense? Give two examples.<br>2. Write the past of “carry”, “stop”, “eat”, and “buy”.<br>3. What is wrong with “She didn’t went to school”?<br>4. Make “They came early” a question and give a short answer.<br>5. When do we use was and when do we use were?<\/p><div class=\"ch\">Chapter 12<\/div><h1>Simple Future Tense<\/h1><p>Zamanin Gaba Mai Sauƙi<\/p><h2>Learning Objectives<\/h2><p>After this chapter, you will be able to:<\/p><p>• Use will to talk about the future.<\/p><p>• Make negative sentences with will not (won’t).<\/p><p>• Ask questions with will and give short answers.<\/p><p>• Use will for decisions, promises, offers, and predictions.<\/p><p>• Use be going to for plans.<\/p>", "<p>• Use the simple present after if in future sentences.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Manufofin Babi: Bayan wannan babi, za ka iya amfani da will don magana a kan abin da zai faru nan gaba; ka yi jimlar musantawa da will not/won’t da tambaya da will; ka yi amfani da will don yanke shawara, alƙawari, taimako, da hasashe; ka yi amfani da be going to don shirye-shirye; sannan ka yi amfani da simple present bayan “if”.<\/div><h2>12.1 What Is the Simple Future Tense?<\/h2><p>We use the simple future tense to talk about things that have not happened yet. The most common form is will + base verb.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I will go to the market tomorrow.<\/td><td>Zan tafi kasuwa gobe.<\/td><\/tr><tr><td>Musa will sell the goat next week.<\/td><td>Musa zai sayar da akuyar mako mai zuwa.<\/td><\/tr><tr><td>It will rain tomorrow.<\/td><td>Za a yi ruwan sama gobe.<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>Time word<\/th><th>Hausa<\/th><\/tr><tr><td>tomorrow<\/td><td>gobe<\/td><\/tr><tr><td>tonight<\/td><td>yau da dare<\/td><\/tr><tr><td>next week<\/td><td>mako mai zuwa<\/td><\/tr><tr><td>next month<\/td><td>wata mai zuwa<\/td><\/tr><tr><td>next year<\/td><td>shekara mai zuwa<\/td><\/tr><tr><td>soon<\/td><td>ba da daɗewa ba<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>A Hausa, ana nuna gaba da “zan, za ka/ki, zai, za ta, za mu, za ku, za su” a gaban aikatau: Zan tafi, Zai tafi, Za su tafi.<\/div>", "<p>A Turanci, ana amfani da will + aikatau na asali ga kowane mai aikatawa. Will ba ya canzawa, ba ya ɗaukar -s, kuma ba ya biyo bayan “to”.<\/p><h2>12.2 Positive Sentences<\/h2><p>Form: subject + will + base verb. Will is the same for all subjects.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Short form<\/th><th>Hausa<\/th><\/tr><tr><td>I will go<\/td><td>I’ll go<\/td><td>Zan tafi<\/td><\/tr><tr><td>you will go<\/td><td>you’ll go<\/td><td>Za ka tafi / Za ki tafi / Za ku tafi<\/td><\/tr><tr><td>he will go<\/td><td>he’ll go<\/td><td>Zai tafi<\/td><\/tr><tr><td>she will go<\/td><td>she’ll go<\/td><td>Za ta tafi<\/td><\/tr><tr><td>it will go<\/td><td>it’ll go<\/td><td>—<\/td><\/tr><tr><td>we will go<\/td><td>we’ll go<\/td><td>Za mu tafi<\/td><\/tr><tr><td>they will go<\/td><td>they’ll go<\/td><td>Za su tafi<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>We will cook rice tonight.<\/td><td>Za mu dafa shinkafa yau da dare.<\/td><\/tr><tr><td>They will travel to Kano on Friday.<\/td><td>Za su tafi Kano ranar Juma’a.<\/td><\/tr><tr><td>She will be a teacher.<\/td><td>Za ta zama malama.<\/td><\/tr><tr><td>I will be at home tomorrow.<\/td><td>Gobe zan kasance a gida.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Remember<\/b><br>Say He will go, not “He will goes” or “He will to go”. After will, always use the base verb. With the verb be, use will be: “I will be late”, not “I will am late”.<\/div><h2>12.3 Negative Sentences<\/h2><p>Add not after will: will not. The short form is won’t.<\/p>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I will not go.<\/td><td>Ba zan tafi ba.<\/td><\/tr><tr><td>She won’t come.<\/td><td>Ba za ta zo ba.<\/td><\/tr><tr><td>They will not sell the farm.<\/td><td>Ba za su sayar da gona ba.<\/td><\/tr><tr><td>It will not rain tomorrow.<\/td><td>Ba za a yi ruwan sama gobe ba.<\/td><\/tr><tr><td>Musa will not be late.<\/td><td>Musa ba zai makara ba.<\/td><\/tr><\/table><\/div><p>Notice that will not becomes won’t, not “willn’t”.<\/p><h2>12.4 Questions and Short Answers<\/h2><p>Put will before the subject. Do not use do/does with will.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Will you come tomorrow?<\/td><td>Za ka zo gobe?<\/td><\/tr><tr><td>Will Musa sell the goat?<\/td><td>Musa zai sayar da akuyar?<\/td><\/tr><tr><td>Will it rain tomorrow?<\/td><td>Za a yi ruwan sama gobe?<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>Question<\/th><th>Yes<\/th><th>No<\/th><\/tr><tr><td>Will you come tomorrow?<\/td><td>Yes, I will.<\/td><td>No, I will not. / No, I won’t.<\/td><\/tr><tr><td>Will Musa sell the goat?<\/td><td>Yes, he will.<\/td><td>No, he will not. / No, he won’t.<\/td><\/tr><\/table><\/div><p>Do not use a short form in a positive short answer: say Yes, I will, not “Yes, I’ll”.<\/p><p>Question words go first:<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>What will you buy?<\/td><td>Me za ka saya?<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Where will they stay?<\/td><td>Ina za su zauna?<\/td><\/tr><tr><td>When will the market open?<\/td><td>Yaushe kasuwa za ta buɗe?<\/td><\/tr><tr><td>Who will help us?<\/td><td>Wa zai taimake mu?<\/td><\/tr><\/table><\/div><h2>12.5 Uses of Will<\/h2><div class=\"tw\"><table><tr><th>Use<\/th><th>Example<\/th><th>Hausa<\/th><\/tr><tr><td>a prediction<\/td><td>You will pass the exam.<\/td><td>Za ka ci jarabawa.<\/td><\/tr><tr><td>a decision at the moment of speaking<\/td><td>It is hot. I will open the window.<\/td><td>Akwai zafi. Zan buɗe taga.<\/td><\/tr><tr><td>a promise<\/td><td>I will pay you tomorrow.<\/td><td>Zan biya ka gobe.<\/td><\/tr><tr><td>an offer<\/td><td>I will carry your bag.<\/td><td>Zan ɗauki jakarka.<\/td><\/tr><\/table><\/div><h2>12.6 Be Going To (Plans)<\/h2><p>We also use be going to + base verb for plans we have already made, and for predictions when we can see signs.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I am going to sell maize at the market.<\/td><td>Zan sayar da masara a kasuwa.<\/td><\/tr><tr><td>She is going to study English at university.<\/td><td>Za ta karanta Turanci a jami’a.<\/td><\/tr><tr><td>Look at the clouds! It is going to rain.<\/td><td>Ku kalli gizagizai! Za a yi ruwan sama.<\/td><\/tr><tr><td>We are not going to travel tomorrow.<\/td><td>Ba za mu yi tafiya gobe ba.<\/td><\/tr><tr><td>Are you going to cook tonight?<\/td><td>Za ka dafa abinci yau da dare?<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Will<\/th><th>Be going to<\/th><\/tr><tr><td>decisions at the moment, promises, offers<\/td><td>plans already made; signs we can see now<\/td><\/tr><tr><td>I will help you.<\/td><td>I am going to build a house.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>A Hausa, “zan, zai, za su” suna aiki ga will da be going to duka. A Turanci, mai koyo na farko zai iya amfani da will a mafi yawan lokuta, sannan ya yi amfani da be going to don shirye-shiryen da aka riga aka yi.<\/div><h2>12.7 Future Sentences with If<\/h2><p>After if, use the simple present, not will. Use will in the other part of the sentence.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>If it rains tomorrow, we will stay at home.<\/td><td>Idan an yi ruwan sama gobe, za mu zauna a gida.<\/td><\/tr><tr><td>If you study, you will pass the exam.<\/td><td>Idan ka yi karatu, za ka ci jarabawa.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Wrong: “If it will rain”<\/b><br>Say If it rains, not “If it will rain”.<\/div><h2>12.8 The Future in Daily Life<\/h2><p>Two friends plan tomorrow. Read it aloud.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Aisha: What will you do tomorrow, Musa?<\/td><td>Aisha: Me za ka yi gobe, Musa?<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Musa: I will go to the farm in the morning. Then I will sell maize at the market.<\/td><td>Musa: Zan tafi gona da safe. Sannan zan sayar da masara a kasuwa.<\/td><\/tr><tr><td>Aisha: Will you come home early?<\/td><td>Aisha: Za ka dawo gida da wuri?<\/td><\/tr><tr><td>Musa: No, I will not. I will come home after six o’clock.<\/td><td>Musa: A’a, ba zan dawo da wuri ba. Zan dawo bayan ƙarfe shida.<\/td><\/tr><tr><td>Aisha: OK. I will cook dinner.<\/td><td>Aisha: To. Zan dafa abincin dare.<\/td><\/tr><tr><td>Musa: Thank you.<\/td><td>Musa: Na gode.<\/td><\/tr><\/table><\/div><h2>12.9 Common Mistakes and Corrections<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>I will goes.<\/td><td>I will go.<\/td><td>Base verb after will.<\/td><\/tr><tr><td>She will to come.<\/td><td>She will come.<\/td><td>No “to” after will.<\/td><\/tr><tr><td>He wills sell the goat.<\/td><td>He will sell the goat.<\/td><td>Will never takes -s.<\/td><\/tr><tr><td>I will not goes.<\/td><td>I will not go.<\/td><td>Base verb after will not.<\/td><\/tr><tr><td>Do you will come?<\/td><td>Will you come?<\/td><td>Will makes its own question.<\/td><\/tr><tr><td>If it will rain, we will stay.<\/td><td>If it rains, we will stay.<\/td><td>Simple present after if.<\/td><\/tr><tr><td>Tomorrow I went to the market.<\/td><td>Tomorrow I will go to the market.<\/td><td>Use the future for tomorrow.<\/td><\/tr><tr><td>I will am late.<\/td><td>I will be late.<\/td><td>Will + be.<\/td><\/tr><\/table><\/div><h2>12.10 Guided Practice<\/h2><p>Write about Aisha / cook / rice / tonight in the future.<\/p><p>• Positive: Aisha will cook rice tonight.<\/p><p>• Negative: Aisha will not cook rice tonight. (or: won’t)<\/p>", "<p>• Question: Will Aisha cook rice tonight?<\/p><p>• Short answer: Yes, she will. / No, she will not.<\/p><h2>12.11 Exercises<\/h2><p>Exercise 12A: Complete with will Write will + the verb in brackets.<br>1. I (go) to the market tomorrow.<br>2. Musa (sell) the goat next week.<br>3. We (cook) rice tonight.<br>4. It (rain) tomorrow.<br>5. They (travel) to Kano on Friday.<br>6. She (be) a teacher.<\/p><p>Exercise 12B: Negative sentences Make each sentence negative.<br>1. I will go.<br>2. She will come.<br>3. They will sell the farm.<br>4. It will rain tomorrow.<br>5. Musa will be late.<\/p><p>Exercise 12C: Questions Make each sentence a question.<br>1. You will come tomorrow.<br>2. Musa will sell the goat.<br>3. It will rain.<br>4. They will stay in Kano.<br>5. She will help us.<\/p>", "<p>Exercise 12D: Questions with question words Write a question about the words in capital letters.<br>1. You will buy RICE.<br>2. They will stay IN KANO.<br>3. The market will open AT EIGHT.<br>4. MUSA will help us.<br>5. She will travel BY BUS.<\/p><p>Exercise 12E: Short answers Write a short answer.<br>1. Will you come tomorrow? (Yes)<br>2. Will Musa sell the goat? (No)<br>3. Will it rain tomorrow? (Yes)<br>4. Will they stay in Kano? (No)<br>5. Will she help us? (Yes)<\/p><p>Exercise 12F: Be going to Write am/is/are going to + the verb in brackets.<br>1. I (sell) maize at the market.<br>2. Musa (study) English.<br>3. They (buy) a new car.<br>4. We (not travel) tomorrow.<br>5. ___ you (cook) rice tonight? (write the whole question)<\/p><p>Exercise 12G: Sentences with if Write the correct form of the verb in brackets.<br>1. If it (rain) tomorrow, we will stay at home.<br>2. If you (study), you will pass the exam.<br>3. If Musa (come), I will tell him.<br>4. We will go to the market if it (not rain).<\/p>", "<p>5. If she (be) late, we will wait.<\/p><p>Exercise 12H: Multiple choice<br>1. Which is correct? (a) I will goes. (b) I will go. (c) I will to go.<br>2. The short form of “will not” is: (a) willn’t (b) won’t (c) wouldn’t<br>3. Which is correct? (a) Do you will come? (b) Will you come? (c) You will come?<br>4. If it ___ tomorrow, we will stay at home. (a) will rain (b) rains (c) rained<br>5. Which is correct? (a) She will be a teacher. (b) She will is a teacher. (c) She wills be a teacher.<\/p><p>Exercise 12I: Sentence correction Correct each sentence.<br>1. She will to come.<br>2. He wills sell the goat.<br>3. I will not goes.<br>4. Do you will come?<br>5. If it will rain, we will stay.<br>6. Tomorrow I went to the market.<br>7. I will am late.<\/p><p>Exercise 12J: Sentence construction<br>1. Write two sentences about what you will do tomorrow.<br>2. Write a negative sentence with “will not”.<br>3. Write a question with “Will”.<br>4. Write a promise with “I will”.<br>5. Write a plan with “going to”.<\/p><p>Exercise 12K: Translation Hausa to English:<\/p>", "<p>1. Zan tafi kasuwa gobe.<br>2. Za mu dafa shinkafa yau da dare.<br>3. Ba zan tafi ba.<br>4. Za ka zo gobe? (to a man)<br>5. Za a yi ruwan sama gobe. English to Hausa:<br>6. Musa will sell the goat next week.<br>7. She will not come.<br>8. They will travel to Kano.<br>9. What will you buy? (to a man)<br>10. I will carry your bag.<\/p><p>Exercise 12L: Everyday communication task Write five sentences about your plans for next week. Use will and be going to.<\/p><h2>12.12 Chapter Summary<\/h2><p>• Future: will + base verb, for all subjects (I’ll, he’ll, they’ll).<\/p><p>• Negative: will not / won’t. Question: Will + subject + base verb.<\/p><p>• Use will for predictions, decisions, promises, and offers.<\/p><p>• Use be going to for plans already made.<\/p><p>• After if, use the simple present: If it rains, we will stay.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Taƙaitawa: Don nan gaba, a yi amfani da will + aikatau na asali. Don musantawa: will not / won’t. Don tambaya: Will + mai aikatawa + aikatau. A yi amfani da be going to don shirye-shirye. Bayan if, a yi amfani da simple present: “If it rains, we will stay at home”.<\/div>", "<h2>12.13 Review Questions<\/h2><p>1. How do we form the simple future with will?<br>2. Make “She will come” negative, using the short form.<br>3. Make “They will stay in Kano” a question and give a short answer.<br>4. What is the difference between will and be going to?<br>5. Correct: “If it will rain tomorrow, we will stay at home.”<\/p><div class=\"ch\">Chapter 13<\/div><h1>Can, Could, Should, and Must<\/h1><p>Iyawa, Roƙo, Shawara, da Wajibci<\/p><h2>Learning Objectives<\/h2><p>After this chapter, you will be able to:<\/p><p>• Use can and cannot (can’t) to talk about ability.<\/p><p>• Use can and could to ask for something politely.<\/p><p>• Use should and should not (shouldn’t) to give advice.<\/p><p>• Use must and must not (mustn’t) to talk about rules and strong duty.<\/p><p>• Form positive sentences, negative sentences, and questions with these four words.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Manufofin Babi: Bayan wannan babi, za ka iya amfani da can don iyawa; could don roƙo cikin ladabi; should don bayar da shawara; must don dokoki da wajibci; sannan ka yi jimlolin tabbatarwa, musantawa, da tambaya da su.<\/div>", "<h2>13.1 What Are These Words?<\/h2><p>Can, could, should, and must are called modal verbs. They are helping words that go before another verb. They add a meaning, such as ability, advice, or duty. Here is a simple guide.<\/p><div class=\"tw\"><table><tr><th>Meaning<\/th><th>Word<\/th><th>Example<\/th><th>Hausa<\/th><\/tr><tr><td>Ability (I am able to)<\/td><td>can<\/td><td>I can cook rice.<\/td><td>Ina iya girki.<\/td><\/tr><tr><td>Polite request<\/td><td>could (can)<\/td><td>Could you help me, please?<\/td><td>Don Allah, za ka iya taimaka mini?<\/td><\/tr><tr><td>Advice (a good idea)<\/td><td>should<\/td><td>You should study every day.<\/td><td>Ya kamata ka yi karatu kowace rana.<\/td><\/tr><tr><td>Duty or rule (strong)<\/td><td>must<\/td><td>Students must come on time.<\/td><td>Dole ne ɗalibai su zo a kan lokaci.<\/td><\/tr><\/table><\/div><p>Four grammar rules are the same for all four words:<\/p><p>• The form never changes: he can, she should, not “he cans” or “she shoulds”.<\/p><p>• The next verb is the base verb, with no to: I can swim, not “I can to swim”.<\/p><p>• For a question, put the modal first: Can you swim? Do not use do/does.<\/p><p>• For a negative, add not: cannot (can’t), could not (couldn’t), should not (shouldn’t), must not (mustn’t).<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Can, could, should, must kalmomi ne masu taimakon aikatau (modal verbs). Suna zuwa kafin aikatau na asali. Ba sa canzawa saboda mai aikatawa (“he can”, ba “he cans” ba), ba a sa “to” bayansu, kuma ana yin tambaya ta sa su a gaba (“Can you swim?”).<\/div>", "<h2>13.2 Can: Ability<\/h2><p>We use can to say that someone is able to do something. The negative is cannot (one word) or can’t.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I can cook rice.<\/td><td>Ina iya dafa shinkafa.<\/td><\/tr><tr><td>She can speak English.<\/td><td>Tana iya magana da Turanci.<\/td><\/tr><tr><td>A fish can swim, but it cannot walk.<\/td><td>Kifi yana iya iyo, amma ba ya iya tafiya.<\/td><\/tr><tr><td>I cannot swim.<\/td><td>Ba na iya iyo.<\/td><\/tr><tr><td>Can you drive?<\/td><td>Kana iya tuƙi?<\/td><\/tr><tr><td>Can he read?<\/td><td>Yana iya karatu?<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>Question<\/th><th>Yes<\/th><th>No<\/th><\/tr><tr><td>Can you drive?<\/td><td>Yes, I can.<\/td><td>No, I cannot. / No, I can’t.<\/td><\/tr><tr><td>Can she cook?<\/td><td>Yes, she can.<\/td><td>No, she cannot. / No, she can’t.<\/td><\/tr><\/table><\/div><p>Could for past ability Could is the past of can for ability. The negative is could not (couldn’t).<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I could swim when I was a child.<\/td><td>Ina iya iyo lokacin ina yaro.<\/td><\/tr><tr><td>He could not read last year.<\/td><td>Bara bai iya karatu ba.<\/td><\/tr><\/table><\/div>", "<h2>13.3 Can and Could: Permission and Polite<\/h2><h2>Requests<\/h2><p>We also use can and could to ask for something. Could is more polite.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Can I sit here? (friendly)<\/td><td>Zan iya zama a nan?<\/td><\/tr><tr><td>Could you help me, please? (polite)<\/td><td>Don Allah, za ka iya taimaka mini?<\/td><\/tr><tr><td>Could you repeat the word, please?<\/td><td>Don Allah, za ka iya maimaita kalmar?<\/td><\/tr><tr><td>Could I use your phone, please?<\/td><td>Don Allah, zan iya amfani da wayarka?<\/td><\/tr><tr><td>Yes, you can.<\/td><td>Ee, za ka iya.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Polite English<\/b><br>Use Could you … , please? with teachers, elders, customers, and people you do not know well. Do not use must to ask for something: “Must you help me?” is wrong for a request.<\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>A Hausa, “za ka iya…?” ana amfani da shi don roƙo da neman izini duka. A Turanci, can ya dace da abokai da yanayi na yau da kullum, could kuma ya fi ladabi, musamman ga malamai, manya, ko mutanen da ba ka sani ba. Kar ka yi amfani da must don roƙo.<\/div><h2>13.4 Should: Advice<\/h2><p>We use should to say that something is a good idea. It is advice, not a rule. The negative is should not (shouldn’t).<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>You should drink water.<\/td><td>Ya kamata ka sha ruwa.<\/td><\/tr><tr><td>He should see a doctor.<\/td><td>Ya kamata ya je wurin likita.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Children should go to school.<\/td><td>Ya kamata yara su je makaranta.<\/td><\/tr><tr><td>Farmers should plant maize before the rains.<\/td><td>Ya kamata manoma su shuka masara kafin damina.<\/td><\/tr><tr><td>You should not be late.<\/td><td>Bai kamata ka makara ba.<\/td><\/tr><tr><td>Should I go now?<\/td><td>Ya kamata in tafi yanzu?<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>Question<\/th><th>Yes<\/th><th>No<\/th><\/tr><tr><td>Should I go now?<\/td><td>Yes, you should.<\/td><td>No, you should not. / No, you shouldn’t.<\/td><\/tr><\/table><\/div><h2>13.5 Must: Duty and Rules<\/h2><p>We use must for a strong duty: a rule, a law, or something very important. Must not (mustn’t) means that something is forbidden.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Students must wear a uniform.<\/td><td>Dole ne ɗalibai su sanya kayan makaranta.<\/td><\/tr><tr><td>Drivers must stop at a red light.<\/td><td>Dole ne direbobi su tsaya a jan haske.<\/td><\/tr><tr><td>You must not run in the class.<\/td><td>Kada ka yi gudu a aji.<\/td><\/tr><tr><td>You must not park here.<\/td><td>Kada ka ajiye mota a nan.<\/td><\/tr><tr><td>A trader must not sell bad food.<\/td><td>Kada ɗan kasuwa ya sayar da abinci mara kyau.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Must not or do not have to?<\/b><br>You must not come means: it is forbidden. You do not have to come means: it is not necessary (you can come if you like). The two are very different. Hausa: Ba dole ba ne ka zo.<\/div>", "<p>In everyday English, people often say have to instead of must: I have to get up early. She has to go to work. (Dole ne in tashi da wuri. Dole ne ta je aiki.)<\/p><h2>13.6 Should or Must?<\/h2><div class=\"tw\"><table><tr><th>Should<\/th><th>Must<\/th><\/tr><tr><td>a good idea; advice<\/td><td>a rule or a strong duty<\/td><\/tr><tr><td>You should rest. (It is good for you.)<\/td><td>You must stop at the red light. (It is the law.)<\/td><\/tr><tr><td>If you do not do it, there may be a problem.<\/td><td>If you do not do it, there will be trouble.<\/td><\/tr><\/table><\/div><h2>13.7 Modal Verbs in Daily Life<\/h2><p>A student talks to a teacher. Read it aloud.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Student: Excuse me, teacher. Can I ask a question?<\/td><td>Ɗalibi: Don Allah, malam. Zan iya yin tambaya?<\/td><\/tr><tr><td>Teacher: Yes, you can.<\/td><td>Malami: Ee, za ka iya.<\/td><\/tr><tr><td>Student: Could you repeat the word, please? I cannot understand it.<\/td><td>Ɗalibi: Don Allah, za ka iya maimaita kalmar? Ban fahimce ta ba.<\/td><\/tr><tr><td>Teacher: Of course. You must listen carefully.<\/td><td>Malami: Hakika. Dole ne ka saurara da kyau.<\/td><\/tr><tr><td>Teacher: You should read the book every day.<\/td><td>Malami: Ya kamata ka karanta littafin kowace rana.<\/td><\/tr><tr><td>Student: Thank you, teacher.<\/td><td>Ɗalibi: Na gode, malam.<\/td><\/tr><\/table><\/div>", "<h2>13.8 Common Mistakes and Corrections<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>She cans cook.<\/td><td>She can cook.<\/td><td>Can never takes -s.<\/td><\/tr><tr><td>I can to swim.<\/td><td>I can swim.<\/td><td>No “to” after can.<\/td><\/tr><tr><td>Can you to help me?<\/td><td>Can you help me?<\/td><td>Base verb, no “to”.<\/td><\/tr><tr><td>Do you can swim?<\/td><td>Can you swim?<\/td><td>Can makes its own question.<\/td><\/tr><tr><td>He must goes to school.<\/td><td>He must go to school.<\/td><td>Base verb after must.<\/td><\/tr><tr><td>She should to rest.<\/td><td>She should rest.<\/td><td>No “to” after should.<\/td><\/tr><tr><td>You must not to run.<\/td><td>You must not run.<\/td><td>Base verb after must not.<\/td><\/tr><tr><td>I should went home.<\/td><td>I should go home.<\/td><td>Base verb, not past.<\/td><\/tr><tr><td>He don’t can swim.<\/td><td>He cannot swim.<\/td><td>Use cannot (can’t), not don’t.<\/td><\/tr><\/table><\/div><h2>13.9 Guided Practice<\/h2><p>Choose the best word. It is dark and you are alone. Your friend wants to walk home alone. What do you say?<\/p><p>• It is a good idea not to walk alone. It is advice, not a law → should not.<\/p><p>• Answer: You shouldn’t walk home alone. Now: Students ___ wear a uniform at our school. This is a school rule → must: Students must wear a uniform.<\/p><h2>13.10 Exercises<\/h2><p>Exercise 13A: Can or cannot? Write can or cannot. 1. A bird ___ fly.<\/p>", "<p>2. A fish ___ walk. 3. I ___ cook rice. 4. A baby ___ read. 5. She ___ speak English.<\/p><p>Exercise 13B: Polite requests Write a polite request with “Could you … , please?”<br>1. close the door<br>2. open the window<br>3. help me<br>4. repeat the word<br>5. lend me a pen<\/p><p>Exercise 13C: Should or shouldn’t? Write should or shouldn’t.<br>1. You are tired. You ___ rest.<br>2. It is dark. You ___ travel alone.<br>3. The exam is tomorrow. You ___ study.<br>4. You have no money. You ___ buy a new phone.<br>5. The children are hungry. We ___ give them food.<\/p><p>Exercise 13D: Must or must not? Write must or must not.<br>1. Students ___ wear a uniform.<br>2. You ___ run in the class.<br>3. We ___ obey the law.<br>4. You ___ park here. (It is forbidden.)<br>5. Drivers ___ stop at a red light.<\/p><p>Exercise 13E: What is the meaning? Write ability, request, advice, or duty.<\/p>", "<p>1. I can swim.<br>2. Could you help me?<br>3. You should drink water.<br>4. Students must come on time.<br>5. She can speak Hausa and English.<br>6. You should see a doctor.<\/p><p>Exercise 13F: Questions Make each sentence a question.<br>1. You can drive.<br>2. He can read.<br>3. I should go.<br>4. She could help.<br>5. We should start now.<\/p><p>Exercise 13G: Negative sentences Make each sentence negative.<br>1. I can swim.<br>2. He could help us.<br>3. You should be late.<br>4. Students must run in the class.<br>5. She can drive.<\/p><p>Exercise 13H: Multiple choice<br>1. Which is correct? (a) She cans cook. (b) She can cook. (c) She can cooks.<br>2. Which is correct? (a) Do you can swim? (b) Can you swim? (c) You can swim?<br>3. You ___ be late. (advice) (a) should not (b) not should (c) don’t should<\/p>", "<p>4. Which is correct? (a) I can to swim. (b) I can swimming. (c) I can swim. 5. Students ___ wear a uniform. (a school rule) (a) can (b) must (c) could 6. ___ you help me, please? (very polite) (a) Could (b) Must (c) Should<\/p><p>Exercise 13I: Sentence correction Correct each sentence.<br>1. She cans cook.<br>2. I can to swim.<br>3. Can you to help me?<br>4. Do you can swim?<br>5. He must goes to school.<br>6. She should to rest.<br>7. You must not to run.<br>8. I should went home.<\/p><p>Exercise 13J: Sentence construction<br>1. Write one thing you can do.<br>2. Write one thing you cannot do.<br>3. Write a polite request with “Could”.<br>4. Write advice with “should”.<br>5. Write a rule with “must”.<\/p><p>Exercise 13K: Translation Hausa to English:<br>1. Ina iya girki.<br>2. Kana iya tuƙi? (to a man)<br>3. Ya kamata ka yi karatu kowace rana.<br>4. Dole ne ɗalibai su zo a kan lokaci.<\/p>", "<p>5. Don Allah, za ka iya taimaka mini? English to Hausa: 6. She can speak English. 7. You should drink water. 8. You must not run in the class. 9. Can I sit here? 10. Farmers should plant maize before the rains.<\/p><p>Exercise 13L: Everyday communication task Write six sentences: two about things you can do, two about things you should do, and two about things you must do at school or at work.<\/p><h2>13.11 Chapter Summary<\/h2><p>• Can = ability (cannot / can’t). Could = polite request; also past ability (could not / couldn’t).<\/p><p>• Should = advice (should not / shouldn’t).<\/p><p>• Must = rule or strong duty (must not / mustn’t = forbidden).<\/p><p>• These verbs never change, never take -s, and are followed by the base verb with no “to”.<\/p><p>• Questions: Can you …? Should I …? Do not use do/does.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Taƙaitawa: Can = iya (ability); could = roƙo cikin ladabi, ko iyawar da ta wuce; should = “ya kamata” (shawara); must = “dole ne” (doka ko wajibci); must not = hani. Kar a ƙara -s, kar a sa “to” bayansu, kuma kar a yi amfani da do/does don tambaya.<\/div><h2>13.12 Review Questions<\/h2><p>1. What is the difference between “should” and “must”?<br>2. Make “She can drive” negative and a question.<br>3. What is wrong with “Do you can swim?”<\/p>", "<p>4. Which is more polite: “Can you help me?” or “Could you help me, please?” 5. What is the difference between “You must not come” and “You do not have to come”?<\/p>", "<div class=\"ch\">Chapter 14<\/div><h1>Common English Grammar Mistakes<\/h1><p>Kura-kuran Nahawun Turanci da Ake Yawan Yi<\/p><h2>Learning Objectives<\/h2><p>After this chapter, you will be able to:<\/p><p>• Recognise the most common mistakes that Hausa-speaking learners make in English.<\/p><p>• Correct mistakes with be, subject–verb agreement, do/does/did, and verb forms.<\/p><p>• Correct mistakes with articles, pronouns, prepositions, questions, negatives, and word order.<\/p><p>• Tell apart words that are often confused, such as there/their and its/it’s.<\/p><p>• Check and correct your own writing with a simple checklist.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Manufofin Babi: Bayan wannan babi, za ka iya gane kura-kuran da masu jin Hausa ke yi a Turanci; ka gyara kura-kurai a kan be, yarjejeniyar mai aikatawa da aikatau, do/does/did, article, wakilin suna, preposition, tambaya, musantawa, da jerin kalmomi; ka bambanta kalmomin da ake ruɗewa a kansu; sannan ka duba rubutunka da kanka.<\/div><h2>14.1 Why Do These Mistakes Happen?<\/h2><p>Most mistakes come from the differences between Hausa and English that you have studied in this book. Hausa has no articles; it can leave out the verb “to be”; its verbs do not add -s; and it makes questions with the voice. When we speak English with Hausa habits,<\/p>", "<p>we make these mistakes. This is normal. Good learners notice a mistake, correct it, and practise the correct form.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Yawancin kura-kuran suna fitowa ne daga bambancin Hausa da Turanci: Hausa ba ta da article; tana iya bar wa jimla aikatau na “to be”; aikatau ɗinta ba ya ƙara -s; kuma tana yin tambaya da ɗaga murya. Kura-kurai abu ne na al’ada a koyo. Ka lura da kuskure, ka gyara shi, sannan ka yi atisaye.<\/div><div class=\"box\"><b>The helper-verb rule<\/b><br>After do, does, did, can, could, will, should, and must, and after to (I want to go), use the base verb: no -s, no -ed, no -ing. Only the helper carries the tense.<\/div><h2>14.2 Mistakes with Be: Am, Is, Are, Was, Were<\/h2><div class=\"tw\"><table><tr><th>Subject<\/th><th>Present<\/th><th>Past<\/th><\/tr><tr><td>I<\/td><td>am<\/td><td>was<\/td><\/tr><tr><td>he / she / it / singular noun<\/td><td>is<\/td><td>was<\/td><\/tr><tr><td>you / we / they / plural noun<\/td><td>are<\/td><td>were<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>She a nurse.<\/td><td>She is a nurse.<\/td><td>English needs “be”. (Dole a faɗi “is”.)<\/td><\/tr><tr><td>We is happy.<\/td><td>We are happy.<\/td><td>“We” takes “are”.<\/td><\/tr><tr><td>They was at school yesterday.<\/td><td>They were at school yesterday.<\/td><td>“They” takes “were” in the past.<\/td><\/tr><tr><td>I were late.<\/td><td>I was late.<\/td><td>“I” takes “was”.<\/td><\/tr><tr><td>The children was tired.<\/td><td>The children were tired.<\/td><td>“Children” is plural.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>My brothers is farmers.<\/td><td>My brothers are farmers.<\/td><td>Plural noun → “are”.<\/td><\/tr><tr><td>He is work in a shop.<\/td><td>He works in a shop.<\/td><td>Do not use “is” before a main verb.<\/td><\/tr><\/table><\/div><h2>14.3 Mistakes with Subject–Verb Agreement<\/h2><p>The verb must agree with the subject. In the simple present, add -s or -es with he, she, it and singular nouns. Use the plural form with plural nouns and with subjects joined by and.<\/p><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>The goat eat grass.<\/td><td>The goat eats grass.<\/td><td>Singular subject → -s.<\/td><\/tr><tr><td>My friend have a phone.<\/td><td>My friend has a phone.<\/td><td>“Has” with a singular subject.<\/td><\/tr><tr><td>A farmer sell maize.<\/td><td>A farmer sells maize.<\/td><td>Singular subject → -s.<\/td><\/tr><tr><td>Musa and Aisha goes to school.<\/td><td>Musa and Aisha go to school.<\/td><td>Two subjects with “and” → plural.<\/td><\/tr><tr><td>My father and my mother is at home.<\/td><td>My father and my mother are at home.<\/td><td>Two subjects → “are”.<\/td><\/tr><tr><td>The people is kind.<\/td><td>The people are kind.<\/td><td>“People” is plural.<\/td><\/tr><tr><td>The news are good.<\/td><td>The news is good.<\/td><td>“News” is singular and uncountable.<\/td><\/tr><tr><td>There is two goats here.<\/td><td>There are two goats here.<\/td><td>“There are” with plural nouns.<\/td><\/tr><\/table><\/div>", "<h2>14.4 Mistakes with Do, Does, Did, and Verb Forms<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>He don’t like meat.<\/td><td>He doesn’t like meat.<\/td><td>“Doesn’t” with he/she/it.<\/td><\/tr><tr><td>Does she likes tea?<\/td><td>Does she like tea?<\/td><td>After “does”, base verb.<\/td><\/tr><tr><td>I didn’t saw him.<\/td><td>I didn’t see him.<\/td><td>After “didn’t”, base verb.<\/td><\/tr><tr><td>Yesterday I eat rice.<\/td><td>Yesterday I ate rice.<\/td><td>Past time word → past form.<\/td><\/tr><tr><td>We did not bought rice.<\/td><td>We did not buy rice.<\/td><td>After “did not”, base verb.<\/td><\/tr><tr><td>She can sings.<\/td><td>She can sing.<\/td><td>After “can”, base verb.<\/td><\/tr><tr><td>I want to goes.<\/td><td>I want to go.<\/td><td>After “to”, base verb.<\/td><\/tr><\/table><\/div><h2>14.5 Mistakes with Articles<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>I like the football.<\/td><td>I like football.<\/td><td>General meaning: no article.<\/td><\/tr><tr><td>I eat the breakfast at seven.<\/td><td>I eat breakfast at seven.<\/td><td>No article with meals.<\/td><\/tr><tr><td>The life is hard.<\/td><td>Life is hard.<\/td><td>General idea: no article.<\/td><\/tr><tr><td>Sun rises in the east.<\/td><td>The sun rises in the east.<\/td><td>There is only one sun.<\/td><\/tr><tr><td>The Kano is a big city.<\/td><td>Kano is a big city.<\/td><td>No article with most city names.<\/td><\/tr><tr><td>My uncle is the farmer.<\/td><td>My uncle is a farmer.<\/td><td>Use “a” for a job.<\/td><\/tr><tr><td>I have a car. A car is red.<\/td><td>I have a car. The car is red.<\/td><td>Second mention → “the”.<\/td><\/tr><\/table><\/div>", "<h2>14.6 Mistakes with Pronouns and Possessives<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>Me and Musa are friends.<\/td><td>Musa and I are friends.<\/td><td>Use “I” as the subject.<\/td><\/tr><tr><td>Give the money to I.<\/td><td>Give the money to me.<\/td><td>Object pronoun after “to”.<\/td><\/tr><tr><td>Musa sells he maize.<\/td><td>Musa sells his maize.<\/td><td>Possessive adjective “his”.<\/td><\/tr><tr><td>This bag is her.<\/td><td>This bag is hers.<\/td><td>Possessive pronoun “hers”.<\/td><\/tr><tr><td>Their is a shop near my house.<\/td><td>There is a shop near my house.<\/td><td>“There” = place; “their” = belonging.<\/td><\/tr><tr><td>This books are new.<\/td><td>These books are new.<\/td><td>“These” with plural nouns.<\/td><\/tr><tr><td>Those book is mine.<\/td><td>Those books are mine.<\/td><td>“Those” + plural noun + “are”.<\/td><\/tr><\/table><\/div><h2>14.7 Mistakes with Prepositions<\/h2><p>Some verbs and adjectives take a particular preposition, and some take none. Learn each one together with its word.<\/p><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>She is married with Musa.<\/td><td>She is married to Musa.<\/td><td>“Married to”.<\/td><\/tr><tr><td>We discussed about the plan.<\/td><td>We discussed the plan.<\/td><td>“Discuss” takes no preposition.<\/td><\/tr><tr><td>He entered into the room.<\/td><td>He entered the room.<\/td><td>“Enter” takes no preposition.<\/td><\/tr><tr><td>I am afraid from dogs.<\/td><td>I am afraid of dogs.<\/td><td>“Afraid of”.<\/td><\/tr><tr><td>It depends of the weather.<\/td><td>It depends on the weather.<\/td><td>“Depend on”.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>This phone is different with that one.<\/td><td>This phone is different from that one.<\/td><td>“Different from”.<\/td><\/tr><tr><td>He explained me the lesson.<\/td><td>He explained the lesson to me.<\/td><td>“Explain … to someone”.<\/td><\/tr><\/table><\/div><h2>14.8 Mistakes with Questions and Negatives<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>What he sells?<\/td><td>What does he sell?<\/td><td>Add do/does.<\/td><\/tr><tr><td>How you know?<\/td><td>How do you know?<\/td><td>Add do/does.<\/td><\/tr><tr><td>Why you did not come?<\/td><td>Why did you not come? / Why didn’t you come?<\/td><td>Put “did” before the subject.<\/td><\/tr><tr><td>He is not know the answer.<\/td><td>He does not know the answer.<\/td><td>Use do/does + not with a main verb.<\/td><\/tr><tr><td>I no like meat.<\/td><td>I do not like meat.<\/td><td>“No” is not used like this.<\/td><\/tr><tr><td>I have no a phone.<\/td><td>I do not have a phone. / I have no phone.<\/td><td>Do not use “no a”.<\/td><\/tr><tr><td>She doesn’t has money.<\/td><td>She does not have any money.<\/td><td>After “doesn’t”, “have”.<\/td><\/tr><\/table><\/div><h2>14.9 Mistakes with Plurals, Adjectives, and Word<\/h2><h2>Order<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>She gave me many advices.<\/td><td>She gave me a lot of advice.<\/td><td>“Advice” is uncountable.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>I bought two bread.<\/td><td>I bought two loaves of bread.<\/td><td>“Bread” is uncountable: count loaves.<\/td><\/tr><tr><td>I have many money.<\/td><td>I have a lot of money. / I have much money.<\/td><td>“Money” is uncountable.<\/td><\/tr><tr><td>This phone is more cheap than that one.<\/td><td>This phone is cheaper than that one.<\/td><td>Short adjective → -er.<\/td><\/tr><tr><td>I like very much rice.<\/td><td>I like rice very much.<\/td><td>“Very much” goes after the object.<\/td><\/tr><tr><td>He speaks well English.<\/td><td>He speaks English well.<\/td><td>The object comes before “well”.<\/td><\/tr><tr><td>Yesterday went I to the market.<\/td><td>Yesterday I went to the market.<\/td><td>Subject before verb in English.<\/td><\/tr><\/table><\/div><h2>14.10 Words That Are Often Confused<\/h2><div class=\"tw\"><table><tr><th>Words<\/th><th>Meaning and example<\/th><\/tr><tr><td>there / their / they’re<\/td><td>there: place (There is a shop.) · their: belonging (their shop) · they’re: they are (They’re at school.)<\/td><\/tr><tr><td>your / you’re<\/td><td>your: belonging (your book) · you’re: you are (You’re late.)<\/td><\/tr><tr><td>its / it’s<\/td><td>its: belonging (its food) · it’s: it is (It’s hot.)<\/td><\/tr><tr><td>then / than<\/td><td>then: next (Cook, then eat.) · than: comparing (taller than me)<\/td><\/tr><tr><td>to / too / two<\/td><td>to: direction (to school) · too: also, or more than needed (too hot) · two: the number 2<\/td><\/tr><\/table><\/div><h2>14.11 Mistakes in Everyday Life: Correct the<\/h2><h2>Message<\/h2><p>Aisha wrote this message to a trader. It has five mistakes. Read the corrected message below.<\/p>", "<div class=\"tw\"><table><tr><th>Message with mistakes<\/th><th>Corrected message<\/th><\/tr><tr><td>Good morning Sir. My name are Aisha. I want buy two bag of rice. How much it is? I will comes tomorrow. Thank you.<\/td><td>Good morning, Sir. My name is Aisha. I want to buy two bags of rice. How much is it? I will come tomorrow. Thank you.<\/td><\/tr><\/table><\/div><p>Mistakes corrected: are → is; want buy → want to buy; bag → bags; How much it is → How much is it; will comes → will come.<\/p><h2>14.12 Your Editing Checklist<\/h2><p>Before you send a message or hand in your work, check:<\/p><p>• Does every sentence begin with a capital letter and end with a full stop or question mark?<\/p><p>• Does every sentence have a subject and a verb (including am/is/are)?<\/p><p>• Do the verbs agree with the subjects (he sells, they sell)?<\/p><p>• After do/does/did/can/will/should/must, is the verb in the base form?<\/p><p>• Have I used a, an, the, or no article correctly?<\/p><p>• Are the plurals, pronouns, and prepositions correct?<\/p><p>• Are my questions and negatives in the correct word order?<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Kafin ka aika saƙo ko ka miƙa aikinka, ka duba: babban harafi da alamar rubutu; mai aikatawa da aikatau (har da am/is/are); yarjejeniyar aikatau da mai aikatawa; aikatau na asali bayan do/does/did/can/will/should/must; article; jam’i, wakilin suna, da preposition; sannan jerin kalmomin tambaya da musantawa.<\/div>", "<h2>14.13 Exercises<\/h2><p>Exercise 14A: Mistakes with be Correct each sentence.<br>1. She a nurse.<br>2. We is happy.<br>3. They was at school yesterday.<br>4. I were late.<br>5. The children was tired.<br>6. He is work in a shop.<\/p><p>Exercise 14B: Agreement Choose the correct word.<br>1. The goat (eat / eats) grass.<br>2. Musa and Aisha (go / goes) to school.<br>3. My friend (have / has) a phone.<br>4. The people (is / are) kind.<br>5. The news (is / are) good.<br>6. There (is / are) two goats here.<\/p><p>Exercise 14C: Do, does, did, and verb forms Correct each sentence.<br>1. He don’t like meat.<br>2. Does she likes tea?<br>3. I didn’t saw him.<br>4. Yesterday I eat rice.<br>5. She can sings.<br>6. I want to goes.<\/p><p>Exercise 14D: Articles Write a, an, the, or – (no article).<\/p>", "<p>1. I like ___ football.<br>2. ___ sun rises in the east.<br>3. She is ___ honest girl.<br>4. I eat ___ breakfast at seven.<br>5. ___ Kano is a big city.<br>6. My brother is ___ driver.<br>7. I have a goat. ___ goat is white.<br>8. ___ life is hard.<\/p><p>Exercise 14E: Pronouns Choose the correct word.<br>1. (Me and Musa / Musa and I) are friends.<br>2. This bag is (her / hers).<br>3. (Their / There) is a shop near my house.<br>4. (This / These) books are new.<br>5. Give the money to (I / me).<br>6. Musa sells (he / his) maize.<\/p><p>Exercise 14F: Prepositions Write the correct preposition, or – if none is needed.<br>1. She is married ___ Musa.<br>2. We discussed ___ the plan.<br>3. He entered ___ the room.<br>4. I am afraid ___ dogs.<br>5. It depends ___ the weather.<br>6. This phone is different ___ that one.<br>7. He explained the lesson ___ me.<\/p><p>Exercise 14G: Questions and negatives Correct each sentence.<\/p>", "<p>1. Why you did not come?<br>2. What he sells?<br>3. How you know?<br>4. He is not know the answer.<br>5. I no like meat.<br>6. I have no a phone.<br>7. She doesn’t has money.<\/p><p>Exercise 14H: Plurals, adjectives, and word order Correct each sentence.<br>1. She gave me many advices.<br>2. I bought two bread.<br>3. I have many money.<br>4. This phone is more cheap than that one.<br>5. I like very much rice.<br>6. He speaks well English.<\/p><p>Exercise 14I: Confused words Choose the correct word.<br>1. (There / Their / They’re) are many students here.<br>2. (Your / You’re) a good teacher.<br>3. The goat ate (its / it’s) food.<br>4. Musa is taller (then / than) Aisha.<br>5. I want to go (to / too / two) the market.<br>6. (They’re / Their) at school now.<\/p><p>Exercise 14J: Edit the paragraph The paragraph has nine mistakes. Rewrite it correctly. My name are Musa. I lives in Kano. I am a trader. I sell rice and bean in the market every day. Yesterday I go to the market early. Their was<\/p>", "<p>many customers. I buyed two bag of rice. Tomorrow I will goes to the farm.<\/p><p>Exercise 14K: Translation Hausa to English:<br>1. Ita malama ce.<br>2. Ba na son nama.<br>3. Jiya sun tafi kasuwa.<br>4. Wannan jakar tata ce.<br>5. Ba zan zo gobe ba. English to Hausa:<br>6. They were at school yesterday.<br>7. Musa and Aisha are friends.<br>8. He does not know the answer.<br>9. I like rice very much.<br>10. She is afraid of dogs.<\/p><p>Exercise 14L: Everyday communication task Write a short message (four or five sentences) to a trader or a teacher. Then use the checklist in 14.12 to check it.<\/p><h2>14.14 Chapter Summary<\/h2><p>• Many mistakes come from Hausa habits: leaving out “be”, forgetting -s, forgetting articles, and making questions without changing the word order.<\/p><p>• Use am/is/are/was/were correctly, and match the verb to the subject.<\/p><p>• After do/does/did/can/will/should/must and after “to”, use the base verb.<\/p><p>• Check articles, pronouns, prepositions, plurals, and word order.<\/p>", "<p>• Use the editing checklist on your own writing.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Taƙaitawa: Kura-kuran Turanci da yawa suna fitowa daga al’adar Hausa: bar wa jimla “be”, mantawa da -s, mantawa da article, da yin tambaya ba tare da canza jerin kalmomi ba. A bi mai aikatawa da aikatau daidai; a yi amfani da aikatau na asali bayan helper verb; a duba article, wakilin suna, preposition, jam’i, da jerin kalmomi; sannan a yi amfani da jerin dubawa.<\/div><h2>14.15 Review Questions<\/h2><p>1. Why do Hausa speakers often leave out “is”, “am”, and “are”?<br>2. Correct and explain: “She don’t likes rice.”<br>3. What is the helper-verb rule?<br>4. What is the difference between “its” and “it’s”?<br>5. Name three prepositions that cause problems (for example, married to) and give a correct sentence for each.<\/p><div class=\"ch\">Chapter 15<\/div><h1>Everyday English Conversations<\/h1><p>Tattaunawar Turanci ta Yau da Kullum<\/p><h2>Learning Objectives<\/h2><p>After this chapter, you will be able to:<\/p><p>• Introduce yourself and greet people politely.<\/p><p>• Talk about family, school, shopping, work, and plans.<\/p><p>• Ask for directions, make telephone calls, and talk about the weather.<\/p><p>• Make polite requests and ask for help.<\/p><p>• Use the grammar from Chapters 1–14 in real conversations.<\/p>", "<div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Manufofin Babi: Bayan wannan babi, za ka iya gabatar da kanka ka kuma yi gaisuwa cikin ladabi; ka yi magana a kan iyali, makaranta, kasuwanci, aiki, da shirye-shirye; ka tambayi hanya, ka yi magana a waya, ka yi magana a kan yanayi; ka yi roƙo cikin ladabi; sannan ka yi amfani da nahawun Babi na 1 zuwa na 14 a tattaunawa ta gaske.<\/div><p>How to use this chapter. Read each dialogue aloud twice. Then cover the Hausa and read the English again. Learn the useful words. Finally, do the short practice activity with a friend or in your notebook.<\/p><h2>15.1 Introducing Yourself<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Aisha: Hello. My name is Aisha. What is your name?<\/td><td>Aisha: Sannu. Sunana Aisha. Menene sunanka?<\/td><\/tr><tr><td>Ibrahim: My name is Ibrahim. Nice to meet you.<\/td><td>Ibrahim: Sunana Ibrahim. Na ji daɗin haɗuwa da ke.<\/td><\/tr><tr><td>Aisha: Nice to meet you too. Where are you from?<\/td><td>Aisha: Ni ma na ji daɗin haɗuwa da kai. Daga ina kake?<\/td><\/tr><tr><td>Ibrahim: I am from Kano. I live near the market.<\/td><td>Ibrahim: Ni ɗan Kano ne. Ina zaune kusa da kasuwa.<\/td><\/tr><tr><td>Aisha: What do you do?<\/td><td>Aisha: Menene aikinka?<\/td><\/tr><tr><td>Ibrahim: I am a student. I also help my father on the farm.<\/td><td>Ibrahim: Ni ɗalibi ne. Ina kuma taimaka wa mahaifina a gona.<\/td><\/tr><\/table><\/div><p>Useful vocabulary<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>name<\/td><td>suna<\/td><td>from<\/td><td>daga<\/td><\/tr><tr><td>live<\/td><td>zauna<\/td><td>student<\/td><td>ɗalibi<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>farm<\/td><td>gona<\/td><td>also<\/td><td>kuma<\/td><\/tr><\/table><\/div><p>Exercise 15A: Practice Complete the introduction with the correct word.<br>1. My name ___ Aisha.<br>2. I ___ from Kano.<br>3. I ___ a student.<br>4. I live ___ Kano.<\/p><h2>15.2 Meeting People and Greetings<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Aisha: Good morning, Malam Sani. How are you?<\/td><td>Aisha: Ina kwana, Malam Sani. Kana lafiya?<\/td><\/tr><tr><td>Malam Sani: Good morning. I am fine, thank you. And you?<\/td><td>Malam Sani: Lafiya lau, na gode. Ke kuma?<\/td><\/tr><tr><td>Aisha: I am fine. How is your family?<\/td><td>Aisha: Ina lafiya. Yaya iyalinka?<\/td><\/tr><tr><td>Malam Sani: They are well, thank God.<\/td><td>Malam Sani: Suna lafiya, alhamdu lillahi.<\/td><\/tr><tr><td>Aisha: Please greet them for me.<\/td><td>Aisha: Don Allah ka gaishe su a madadina.<\/td><\/tr><tr><td>Malam Sani: I will. See you later.<\/td><td>Malam Sani: Zan gaya musu. Sai an jima.<\/td><\/tr><\/table><\/div><p>Useful vocabulary<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>good morning<\/td><td>ina kwana<\/td><td>good afternoon<\/td><td>barka da rana<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>good evening<\/td><td>barka da yamma<\/td><td>How are you?<\/td><td>Kana lafiya? / Kina lafiya?<\/td><\/tr><tr><td>fine<\/td><td>lafiya lau<\/td><td>family<\/td><td>iyali<\/td><\/tr><tr><td>greet<\/td><td>gaishe<\/td><td>See you later.<\/td><td>Sai an jima.<\/td><\/tr><\/table><\/div><p>Exercise 15B: Practice Write the correct greeting: good morning, good afternoon, or good evening.<br>1. at 8 a.m.<br>2. at 3 p.m.<br>3. at 7 p.m.<\/p><h2>15.3 Family and Home<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Aisha: Is this your family photo?<\/td><td>Aisha: Wannan hoton iyalinka ne?<\/td><\/tr><tr><td>Musa: Yes, it is. This is my father, and this is my mother.<\/td><td>Musa: Ee, hoton iyalina ne. Wannan mahaifina ne, wannan kuma mahaifiyata ce.<\/td><\/tr><tr><td>Aisha: How many brothers and sisters do you have?<\/td><td>Aisha: ’Yan’uwa nawa kake da su?<\/td><\/tr><tr><td>Musa: I have two brothers and one sister.<\/td><td>Musa: Ina da ’yan’uwa maza biyu da mace ɗaya.<\/td><\/tr><tr><td>Aisha: Do you all live in the same house?<\/td><td>Aisha: Duk kuna zaune a gida ɗaya?<\/td><\/tr><tr><td>Musa: No. My brothers live in Kaduna. My sister and I live with our parents.<\/td><td>Musa: A’a. ’Yan’uwana suna zaune a Kaduna. Ni da ’yar’uwata muna zaune tare da iyayenmu.<\/td><\/tr><\/table><\/div>", "<p>Useful vocabulary<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>family<\/td><td>iyali<\/td><td>father<\/td><td>mahaifi / baba<\/td><\/tr><tr><td>mother<\/td><td>mahaifiya / uwa<\/td><td>brother<\/td><td>ɗan’uwa<\/td><\/tr><tr><td>sister<\/td><td>’yar’uwa<\/td><td>parents<\/td><td>iyaye<\/td><\/tr><tr><td>house<\/td><td>gida<\/td><td>photo<\/td><td>hoto<\/td><\/tr><\/table><\/div><p>Exercise 15C: Practice Write my, her, our, or their.<br>1. This is ___ mother.<br>2. ___ name is Hauwa. (my mother’s name)<br>3. We live with ___ parents.<br>4. My brothers live in Kaduna. ___ house is big.<\/p><h2>15.4 School and Learning<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Aisha: Do you have an English class today?<\/td><td>Aisha: Kuna da darasin Turanci yau?<\/td><\/tr><tr><td>Musa: Yes, we do. It starts at ten o’clock.<\/td><td>Musa: Ee, muna da shi. Yana farawa da ƙarfe goma.<\/td><\/tr><tr><td>Aisha: Is the lesson difficult?<\/td><td>Aisha: Darasin yana da wuya?<\/td><\/tr><tr><td>Musa: Not very difficult. The teacher explains well, and I practise every day.<\/td><td>Musa: Ba sosai ba. Malami yana bayani da kyau, ni kuma ina yin atisaye kowace rana.<\/td><\/tr><tr><td>Aisha: Can I borrow your exercise book?<\/td><td>Aisha: Zan iya aro littafin rubutunka?<\/td><\/tr><tr><td>Musa: Yes, of course. Please bring it back tomorrow.<\/td><td>Musa: Ee, tabbas. Don Allah ka dawo da shi gobe.<\/td><\/tr><\/table><\/div>", "<p>Useful vocabulary<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>lesson / class<\/td><td>darasi / aji<\/td><td>difficult<\/td><td>mai wuya<\/td><\/tr><tr><td>easy<\/td><td>mai sauƙi<\/td><td>practise<\/td><td>yi atisaye<\/td><\/tr><tr><td>borrow<\/td><td>aro<\/td><td>exercise book<\/td><td>littafin rubutu<\/td><\/tr><tr><td>teacher<\/td><td>malami<\/td><td>explain<\/td><td>yi bayani<\/td><\/tr><\/table><\/div><p>Exercise 15D: Practice Follow the instruction.<br>1. Make a question: The lesson is difficult.<br>2. Make a question: The class starts at ten.<br>3. Make a negative sentence: I practise every day.<\/p><h2>15.5 Markets and Shopping<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Customer: Good morning. How much is a kilo of tomatoes?<\/td><td>Mai saye: Ina kwana. Nawa ne kilon tumatur?<\/td><\/tr><tr><td>Trader: It is two thousand naira.<\/td><td>Ɗan kasuwa: Naira dubu biyu ne.<\/td><\/tr><tr><td>Customer: That is too expensive. Please reduce the price.<\/td><td>Mai saye: Wannan ya yi tsada. Ka rage mini farashin, don Allah.<\/td><\/tr><tr><td>Trader: Okay, one thousand eight hundred naira.<\/td><td>Ɗan kasuwa: To, naira dubu ɗaya da ɗari takwas.<\/td><\/tr><tr><td>Customer: I will take two kilos.<\/td><td>Mai saye: Zan ɗauki kilo biyu.<\/td><\/tr><tr><td>Trader: Here you are. Anything else?<\/td><td>Ɗan kasuwa: Gashi nan. Akwai wani abu kuma?<\/td><\/tr><tr><td>Customer: No, thank you.<\/td><td>Mai saye: A’a, na gode.<\/td><\/tr><\/table><\/div>", "<p>Useful vocabulary<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>How much?<\/td><td>Nawa?<\/td><td>expensive<\/td><td>mai tsada<\/td><\/tr><tr><td>cheap<\/td><td>mai araha<\/td><td>price<\/td><td>farashi<\/td><\/tr><tr><td>reduce<\/td><td>rage<\/td><td>kilo<\/td><td>kilo<\/td><\/tr><tr><td>naira<\/td><td>naira<\/td><td>Anything else?<\/td><td>Akwai wani abu kuma?<\/td><\/tr><\/table><\/div><p>Exercise 15E: Practice Write much, many, too, or will.<br>1. How ___ is a kilo of tomatoes?<br>2. How ___ kilos do you want?<br>3. That is ___ expensive.<br>4. I ___ take two kilos.<\/p><h2>15.6 Shops and Business<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Supplier: Good morning. Do you need more rice today?<\/td><td>Mai kawo kaya: Ina kwana. Kuna buƙatar ƙarin shinkafa yau?<\/td><\/tr><tr><td>Shop owner: Yes, I need ten bags.<\/td><td>Mai shago: Ee, ina buƙatar buhu goma.<\/td><\/tr><tr><td>Supplier: I have them in the car. Do you want to pay now or later?<\/td><td>Mai kawo kaya: Ina da su a mota. Kana so ka biya yanzu ko daga baya?<\/td><\/tr><tr><td>Shop owner: I will pay now. Please give me a receipt.<\/td><td>Mai shago: Zan biya yanzu. Don Allah ka ba ni rasidi.<\/td><\/tr><tr><td>Supplier: No problem.<\/td><td>Mai kawo kaya: Babu matsala.<\/td><\/tr><tr><td>Shop owner: Thank you. Please come again next week.<\/td><td>Mai shago: Na gode. Don Allah ka sake zuwa mako mai zuwa.<\/td><\/tr><\/table><\/div>", "<p>Useful vocabulary<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>supplier<\/td><td>mai kawo kaya<\/td><td>shop owner<\/td><td>mai shago<\/td><\/tr><tr><td>customer<\/td><td>mai saye<\/td><td>pay<\/td><td>biya<\/td><\/tr><tr><td>receipt<\/td><td>rasidi<\/td><td>business<\/td><td>kasuwanci<\/td><\/tr><tr><td>profit<\/td><td>riba<\/td><td>bag (of rice)<\/td><td>buhu<\/td><\/tr><\/table><\/div><p>Exercise 15F: Practice Put the words in order to make a sentence.<br>1. need / I / bags / ten<br>2. receipt / please / me / a / give<br>3. come / next / please / again / week<\/p><h2>15.7 Work and Job Seeking<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Manager: Good morning. Please sit down. What is your name?<\/td><td>Manaja: Ina kwana. Don Allah zauna. Menene sunanki?<\/td><\/tr><tr><td>Aisha: My name is Aisha Sani.<\/td><td>Aisha: Sunana Aisha Sani.<\/td><\/tr><tr><td>Manager: Do you have any experience?<\/td><td>Manaja: Kina da gogewa?<\/td><\/tr><tr><td>Aisha: Yes. I worked in a shop for two years.<\/td><td>Aisha: Ee. Na yi aiki a shago na tsawon shekaru biyu.<\/td><\/tr><tr><td>Manager: Can you use a computer?<\/td><td>Manaja: Kina iya amfani da kwamfuta?<\/td><\/tr><tr><td>Aisha: Yes, I can. I can also speak English and Hausa.<\/td><td>Aisha: Ee, ina iya. Ina kuma iya magana da Turanci da Hausa.<\/td><\/tr><tr><td>Manager: Good. When can you start?<\/td><td>Manaja: To. Yaushe za ki iya fara aiki?<\/td><\/tr><tr><td>Aisha: I can start on Monday.<\/td><td>Aisha: Zan iya farawa ranar Litinin.<\/td><\/tr><\/table><\/div>", "<p>Useful vocabulary<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>interview<\/td><td>tattaunawar neman aiki<\/td><td>experience<\/td><td>gogewa<\/td><\/tr><tr><td>job<\/td><td>aiki<\/td><td>manager<\/td><td>manaja<\/td><\/tr><tr><td>salary<\/td><td>albashi<\/td><td>start<\/td><td>fara<\/td><\/tr><tr><td>computer<\/td><td>kwamfuta<\/td><td>CV<\/td><td>takardar tarihin rayuwa<\/td><\/tr><\/table><\/div><p>Exercise 15G: Practice Follow the instruction.<br>1. Complete: She ___ use a computer. (can / cans)<br>2. Make a negative sentence: I worked in a shop.<br>3. Complete: When ___ you start? (can / do)<\/p><h2>15.8 Asking for Directions<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Visitor: Excuse me. Is there a clinic near here?<\/td><td>Baƙo: Don Allah. Akwai asibiti kusa da nan?<\/td><\/tr><tr><td>Man: Yes. Go straight, then turn right at the junction.<\/td><td>Mutumin: Ee. Ka ci gaba da tafiya kai tsaye, sai ka juya dama a mahaɗar hanya.<\/td><\/tr><tr><td>Visitor: Is it far?<\/td><td>Baƙo: Yana da nisa?<\/td><\/tr><tr><td>Man: No. It is about five minutes on foot.<\/td><td>Mutumin: A’a. Kamar minti biyar ne a ƙafa.<\/td><\/tr><tr><td>Visitor: Thank you very much.<\/td><td>Baƙo: Na gode sosai.<\/td><\/tr><tr><td>Man: You are welcome.<\/td><td>Mutumin: Ba komai.<\/td><\/tr><\/table><\/div>", "<p>Useful vocabulary<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>straight<\/td><td>kai tsaye<\/td><td>left<\/td><td>hagu<\/td><\/tr><tr><td>right<\/td><td>dama<\/td><td>junction<\/td><td>mahaɗar hanya<\/td><\/tr><tr><td>on foot<\/td><td>a ƙafa<\/td><td>far<\/td><td>nesa<\/td><\/tr><tr><td>near<\/td><td>kusa<\/td><td>clinic<\/td><td>asibiti<\/td><\/tr><\/table><\/div><p>Exercise 15H: Practice Write the correct preposition: at, between, on, or along.<br>1. Turn right ___ the junction.<br>2. The clinic is ___ the mosque and the school.<br>3. It is five minutes ___ foot.<br>4. Walk ___ this road.<\/p><h2>15.9 Telephone Conversations<\/h2><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Aisha: Hello. Is this Musa?<\/td><td>Aisha: Sannu. Musa ne?<\/td><\/tr><tr><td>Musa: Yes, speaking. Who is this?<\/td><td>Musa: Ee, ni ne. Wane ne?<\/td><\/tr><tr><td>Aisha: This is Aisha. Could I speak to your father, please?<\/td><td>Aisha: Aisha ce. Don Allah, zan iya yin magana da mahaifinka?<\/td><\/tr><tr><td>Musa: I am sorry. He is not at home. Can I take a message?<\/td><td>Musa: Yi haƙuri. Ba ya gida. Zan iya karɓar saƙo?<\/td><\/tr><tr><td>Aisha: Yes. Please tell him I called.<\/td><td>Aisha: Ee. Don Allah ka gaya masa na kira.<\/td><\/tr><tr><td>Musa: I will tell him. Goodbye.<\/td><td>Musa: Zan gaya masa. Sai an jima.<\/td><\/tr><\/table><\/div>", "<p>Useful vocabulary<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><th>English<\/th><th>Hausa<\/t
