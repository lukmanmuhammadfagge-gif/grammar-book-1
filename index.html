inkafa ranar Juma’a.<\/td><\/tr><\/table><\/div><p>2. Facts that are always true<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>The sun rises in the east.<\/td><td>Rana tana fitowa daga gabas.<\/td><\/tr><tr><td>Goats eat grass.<\/td><td>Awaki suna cin ciyawa.<\/td><\/tr><\/table><\/div><p>3. Permanent situations<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>My father works on a farm.<\/td><td>Mahaifina yana aiki a gona.<\/td><\/tr><tr><td>They live in Kano.<\/td><td>Suna zaune a Kano.<\/td><\/tr><tr><td>She teaches English.<\/td><td>Tana koyar da Turanci.<\/td><\/tr><\/table><\/div>", "<p>4. Fixed times and schedules<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>The market opens at eight o’clock.<\/td><td>Kasuwa tana buɗewa da ƙarfe takwas.<\/td><\/tr><\/table><\/div><p>Words that often go with the simple present<\/p><div class=\"tw\"><table><tr><th>Word<\/th><th>Hausa<\/th><th>Example<\/th><\/tr><tr><td>always<\/td><td>kullum<\/td><td>Musa always sells fish on Monday.<\/td><\/tr><tr><td>usually<\/td><td>yawanci<\/td><td>Aisha usually cooks rice in the evening.<\/td><\/tr><tr><td>often<\/td><td>sau da yawa<\/td><td>We often go to the market.<\/td><\/tr><tr><td>sometimes<\/td><td>wani lokaci<\/td><td>They sometimes visit us.<\/td><\/tr><tr><td>never<\/td><td>ba a taɓa… ba<\/td><td>She is never late.<\/td><\/tr><tr><td>every day<\/td><td>kowace rana<\/td><td>I read every day.<\/td><\/tr><\/table><\/div><p>Put always, usually, often, sometimes, and never before the main verb, but after am/is/are: Musa always sells fish. She is never late. (Hausa: Ba ta taɓa makara ba.)<\/p><h2>5.4 Negative Sentences<\/h2><p>To make a negative sentence, use do not (don’t) with I, you, we, they, and does not (doesn’t) with he, she, it. Then use the base verb (no -s).<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I do not sell fish.<\/td><td>Ba na sayar da kifi.<\/td><\/tr><tr><td>She does not cook rice.<\/td><td>Ba ta dafa shinkafa.<\/td><\/tr><tr><td>They do not eat meat.<\/td><td>Ba sa cin nama.<\/td><\/tr><tr><td>Musa does not work on Friday.<\/td><td>Musa ba ya aiki ranar Juma’a.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>We do not live in Kano.<\/td><td>Ba ma zaune a Kano.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Important<\/b><br>After does not, the verb has no -s. Say He does not sell, not “He does not sells”. The -s is carried by does.<\/div><p>(Chapter 10 will teach negative sentences in more detail.)<\/p><h2>5.5 Questions and Short Answers<\/h2><p>To make a question, put do or does at the beginning. Then use the subject and the base verb.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Do you sell rice?<\/td><td>Kana sayar da shinkafa?<\/td><\/tr><tr><td>Does Musa work here?<\/td><td>Musa yana aiki a nan?<\/td><\/tr><tr><td>Do they live in Kano?<\/td><td>Suna zaune a Kano?<\/td><\/tr><tr><td>Does she teach English?<\/td><td>Tana koyar da Turanci?<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>Question<\/th><th>Yes<\/th><th>No<\/th><\/tr><tr><td>Do you sell rice?<\/td><td>Yes, I do.<\/td><td>No, I do not. / No, I don’t.<\/td><\/tr><tr><td>Does Musa work here?<\/td><td>Yes, he does.<\/td><td>No, he does not. / No, he doesn’t.<\/td><\/tr><\/table><\/div><p>We can add a question word (what, where, when) at the beginning:<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>What do you sell?<\/td><td>Me kake sayarwa?<\/td><\/tr><tr><td>Where does he work?<\/td><td>Ina yake aiki?<\/td><\/tr><tr><td>When does the market open?<\/td><td>Yaushe kasuwa take buɗewa?<\/td><\/tr><\/table><\/div>", "<div class=\"box\"><b>Do not use do/does with am/is/are<\/b><br>Say Are you a trader? not “Do you are a trader?” The verb to be (Chapter 4) makes its own questions.<\/div><h2>5.6 The Verb “Have”<\/h2><p>Have is used with I, you, we, they. Has is used with he, she, it.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I have a phone.<\/td><td>Ina da waya.<\/td><\/tr><tr><td>She has a shop.<\/td><td>Tana da shago.<\/td><\/tr><tr><td>He does not have a bicycle.<\/td><td>Ba shi da keke.<\/td><\/tr><tr><td>Does he have a bicycle?<\/td><td>Yana da keke?<\/td><\/tr><\/table><\/div><p>Notice that after does or does not, we use have, not “has”.<\/p><h2>5.7 A First Look at the Present Continuous<\/h2><p>The simple present tells us what happens again and again. The present continuous tense tells us what is happening now, at this moment, or around this time. This is only a short introduction. Book 2 will teach it in full.<\/p><p>Structure: subject + am / is / are + verb-ing<\/p><div class=\"tw\"><table><tr><th>Positive<\/th><th>Negative<\/th><th>Question<\/th><\/tr><tr><td>I am cooking.<\/td><td>I am not cooking.<\/td><td>Am I cooking?<\/td><\/tr><tr><td>He / She is cooking.<\/td><td>He / She is not cooking.<\/td><td>Is she cooking?<\/td><\/tr><tr><td>You / We / They are cooking.<\/td><td>You / We / They are not cooking.<\/td><td>Are they cooking?<\/td><\/tr><\/table><\/div>", "<p>Spelling of -ing: most verbs just add -ing (cook → cooking; sell → selling; play → playing). Verbs ending in a silent e drop the e (write → writing). Some short verbs double the last letter (run → running; sit → sitting).<\/p><p>Positive sentences<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I am cooking rice now.<\/td><td>Yanzu ina dafa shinkafa.<\/td><\/tr><tr><td>Musa is selling fish.<\/td><td>Musa yana sayar da kifi.<\/td><\/tr><tr><td>The children are playing outside.<\/td><td>Yara suna wasa a waje.<\/td><\/tr><tr><td>It is raining.<\/td><td>Ana ruwan sama.<\/td><\/tr><\/table><\/div><p>Negative sentences<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I am not selling fish now.<\/td><td>Yanzu ba na sayar da kifi.<\/td><\/tr><tr><td>Musa is not working today.<\/td><td>Musa ba ya aiki yau.<\/td><\/tr><tr><td>They are not playing.<\/td><td>Ba sa wasa.<\/td><\/tr><\/table><\/div><p>Questions<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Is Musa selling fish?<\/td><td>Musa yana sayar da kifi?<\/td><\/tr><tr><td>Are the children playing?<\/td><td>Yara suna wasa?<\/td><\/tr><tr><td>What are you doing?<\/td><td>Me kake yi?<\/td><\/tr><\/table><\/div><p>Simple present or present continuous?<\/p><div class=\"tw\"><table><tr><th>Simple present<\/th><th>Present continuous<\/th><\/tr><tr><td>Habits, routines, and facts<\/td><td>Actions happening now or around now<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Simple present<\/th><th>Present continuous<\/th><\/tr><tr><td>I sell rice every day.<\/td><td>I am selling rice now.<\/td><\/tr><tr><td>Musa usually goes to school by bus.<\/td><td>Today he is walking to school.<\/td><\/tr><tr><td>Words: every day, always, usually, often<\/td><td>Words: now, at the moment, today, Look!<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Present continuous yana nuna abin da ake yi a yanzu: “I am cooking” (Ina dafa abinci yanzu). Simple present kuwa yana nuna abin da ake yi kullum: “I cook every day”. A Hausa, kalmomi kamar “ina”, “yana”, “suna” na iya nufin ɗaya ko ɗayan, don haka muna dogara da kalmomin lokaci kamar “yanzu” (now) da “kowace rana” (every day). Hausa tana da kuma “yakan” don abin da ake yi akai- akai (Musa yakan tafi makaranta da bas).<\/div><div class=\"box\"><b>Remember<\/b><br>Always use am/is/are with the -ing verb: “She is cooking”, not “She cooking”. Some verbs are not normally used with -ing: want, like, love, need, know, have (meaning own). Say “I want rice”, not “I am wanting rice”.<\/div><h2>5.8 The Simple Present in Daily Life<\/h2><p>Two friends talk about a normal day. Read it aloud.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Ibrahim: What do you do every morning?<\/td><td>Ibrahim: Me kike yi kowace safiya?<\/td><\/tr><tr><td>Aisha: I get up at five o’clock. I clean the house, and then I cook breakfast.<\/td><td>Aisha: Ina tashi da ƙarfe biyar. Ina share gida, sannan na dafa abincin safe.<\/td><\/tr><tr><td>Ibrahim: Does your brother help you?<\/td><td>Ibrahim: Ɗan’uwanki yana taimaka miki?<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Aisha: Yes, he does. He sweeps the compound and goes to the market.<\/td><td>Aisha: Ee, yana taimaka min. Yana share farfajiya, yana kuma zuwa kasuwa.<\/td><\/tr><tr><td>Ibrahim: What time does the market open?<\/td><td>Ibrahim: Ƙarfe nawa kasuwa take buɗewa?<\/td><\/tr><tr><td>Aisha: It opens at eight o’clock.<\/td><td>Aisha: Tana buɗewa da ƙarfe takwas.<\/td><\/tr><\/table><\/div><h2>5.9 Common Mistakes and Corrections<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>He sell rice.<\/td><td>He sells rice.<\/td><td>Add -s with he/she/it. (A ƙara -s.)<\/td><\/tr><tr><td>She go to school.<\/td><td>She goes to school.<\/td><td>After o, add -es.<\/td><\/tr><tr><td>They studys English.<\/td><td>They study English.<\/td><td>With “they”, use the base verb.<\/td><\/tr><tr><td>He have a shop.<\/td><td>He has a shop.<\/td><td>“Has” with he/she/it.<\/td><\/tr><tr><td>Musa don’t work on Friday.<\/td><td>Musa doesn’t work on Friday.<\/td><td>Use “does not” with a singular subject.<\/td><\/tr><tr><td>Does she sells fish?<\/td><td>Does she sell fish?<\/td><td>After “does”, use the base verb.<\/td><\/tr><tr><td>I am go to school every day.<\/td><td>I go to school every day.<\/td><td>Do not add “am” before a main verb.<\/td><\/tr><\/table><\/div><h2>5.10 Guided Practice<\/h2><p>Make a sentence from: Musa / sell / rice.<\/p><p>• Step 1: The subject is Musa (= he), so the verb needs -s → sells.<\/p><p>• Positive: Musa sells rice.<\/p><p>• Negative: Musa does not sell rice. (no -s after does not)<\/p>", "<p>• Question: Does Musa sell rice? (no -s after does)<\/p><h2>5.11 Exercises<\/h2><p>Exercise 5A: he / she / it forms Write the form used with he, she, or it.<br>1. work<br>2. go<br>3. study<br>4. watch<br>5. play<br>6. have<br>7. teach<br>8. buy<br>9. carry<br>10. read<\/p><p>Exercise 5B: Complete the sentences Write the correct form of the verb in brackets.<br>1. Musa (sell) rice in the market.<br>2. We (live) in Kano.<br>3. My mother (cook) every evening.<br>4. They (go) to school on Monday.<br>5. Aisha (study) English.<br>6. The market (open) at eight o’clock.<br>7. I (have) a new phone.<br>8. The hen (lay) eggs.<\/p><p>Exercise 5C: Negative sentences Make each sentence negative.<br>1. I sell fish.<br>2. She works in Kano.<br>3. They eat meat.<br>4. Musa goes to school on Friday.<br>5. We have a car.<\/p><p>Exercise 5D: Questions Make each sentence a question. 1. You sell rice.<\/p>", "<p>2. Musa works here. 3. They live in Kano. 4. She teaches English. 5. He has a bicycle.<\/p><p>Exercise 5E: Short answers Complete each short answer.<br>1. Do you sell rice? Yes, I ___.<br>2. Does Musa work here? No, he ___ not.<br>3. Do they live in Kano? Yes, they ___.<br>4. Does she teach English? Yes, she ___.<br>5. Do you have a phone? No, I ___ not.<\/p><p>Exercise 5F: Where does the word go? Put the word in brackets in the correct place.<br>1. Musa goes to school. (always)<br>2. She is late. (never)<br>3. I eat rice in the evening. (usually)<br>4. They visit us on Sunday. (sometimes)<br>5. We go to the market on Friday. (often)<\/p><p>Exercise 5G: Multiple choice<br>1. She ___ English. (a) teach (b) teaches (c) teachs<br>2. He ___ not sell fish. (a) do (b) does (c) is<br>3. Which is correct? (a) Does she goes? (b) Does she go? (c) Do she go?<br>4. They ___ in Kano. (a) lives (b) live (c) living<br>5. Which is correct? (a) He have a shop. (b) He has a shop. (c) He haves a shop.<\/p>", "<p>Exercise 5H: Sentence correction Correct each sentence.<br>1. He sell rice.<br>2. She go to school.<br>3. Musa don’t work on Friday.<br>4. Does she sells fish?<br>5. They studys English.<br>6. He have a shop.<\/p><p>Exercise 5I: Sentence construction<br>1. Write two sentences about your daily routine.<br>2. Write a sentence with “always”.<br>3. Write a negative sentence with “does not”.<br>4. Write a question with “Do”.<br>5. Write a sentence about something goats or hens do.<\/p><p>Exercise 5J: Translation Hausa to English:<br>1. Mahaifina yana aiki a gona.<br>2. Kaza tana yin ƙwai.<br>3. Ba ya sayar da kifi.<br>4. Suna zaune a Kano.<br>5. Yaushe kasuwa take buɗewa? English to Hausa:<br>6. Musa gets up at five o’clock.<br>7. We eat rice every day.<br>8. She does not cook in the morning.<br>9. Do you sell rice? (to a man)<br>10. Goats eat grass.<\/p>", "<p>Exercise 5K: Everyday communication task Write five sentences about your daily routine, from morning to evening. Use the simple present tense.<\/p><p>Exercise 5L: Simple present or present continuous? Write the correct form of the verb in brackets.<br>1. Look! The children (play) outside.<br>2. Musa usually (go) to school by bus.<br>3. Today he (walk) to school.<br>4. Aisha (cook) rice every evening.<br>5. I (not / sell) fish now.<br>6. ___ Musa ___ (work) today?<br>7. We (go) to the market every Friday.<br>8. What ___ you ___ (do) now?<\/p><h2>5.12 Chapter Summary<\/h2><p>• Use the simple present for habits, facts, and permanent situations.<\/p><p>• With he, she, it, and singular nouns, add -s or -es (-ies after consonant + y; has for have).<\/p><p>• Negative: do not / does not + base verb.<\/p><p>• Question: Do / Does + subject + base verb.<\/p><p>• After does or does not, the verb has no -s.<\/p><p>• Put always, usually, often, sometimes, never before the main verb.<\/p><p>• The present continuous (am/is/are + verb-ing) is for actions happening now; the simple present is for habits and facts.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Taƙaitawa: Simple present yana nufin abin da ake yi kullum, gaskiyar da ba ta canzawa, da halin da ya daɗe. Idan mai aikatawa<\/div>", "<p>he/she/it ne, a ƙara -s ko -es. Don musantawa a yi amfani da do not/does not; don tambaya a fara da Do/Does. Bayan does, aikatau ba ya ɗaukar -s.<\/p><h2>5.13 Review Questions<\/h2><p>1. When do we use the simple present tense? Give two examples.<br>2. Write the he/she/it form of “carry”, “watch”, and “have”.<br>3. What is wrong with “She does not likes rice”?<br>4. Make “They live in Kano” a question and give a short answer.<br>5. Where do we put “always” in a sentence?<br>6. What is the difference between “I sell rice” and “I am selling rice”?<\/p><div class=\"ch\">Chapter 6<\/div><h1>Articles: A, An, and The<\/h1><p>Kalmomin “A”, “An”, da “The”<\/p><h2>Learning Objectives<\/h2><p>After this chapter, you will be able to:<\/p><p>• Explain what an article is.<\/p><p>• Use a and an correctly, depending on the sound of the next word.<\/p><p>• Use the when the listener knows which thing you mean.<\/p><p>• Know when to use no article.<\/p><p>• Avoid common article mistakes made by Hausa speakers.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Manufofin Babi: Bayan wannan babi, za ka iya bayyana ma’anar article; ka yi amfani da a da an daidai; ka yi amfani da the idan ana magana a kan wani abu takamaimai; ka san lokacin da ba a amfani da article; sannan ka guji kura-kuran da masu jin Hausa ke yi.<\/div>", "<h2>6.1 What Are Articles?<\/h2><p>Articles are small words that come before nouns. English has only three: a, an, and the.<\/p><p>• A and an are called indefinite articles. They mean “one, any”.<\/p><p>• The is called the definite article. It means a particular thing that the speaker and the listener both know.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>A Hausa ba mu da kalmomi daban kamar a, an, the. Wani lokaci ana amfani da “wani/wata” don nufin “a/an” (wani littafi = a book), ko a ƙara -n/-r a bayan suna (littafin, kasuwar) don nufin “the”. A Turanci, dole ne a zaɓi article kafin yawancin sunaye.<\/td><\/tr><tr><td>Shi ya sa masu jin Hausa ke manta article. Ka koyi doka a hankali, ka riƙa yin misalai.<\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Give me a book.<\/td><td>Ba ni littafi. (kowane littafi)<\/td><\/tr><tr><td>Give me the book.<\/td><td>Ba ni littafin. (takamaimai)<\/td><\/tr><\/table><\/div><h2>6.2 A and An<\/h2><p>Use a or an before a singular countable noun when you mean one thing, and it is not a particular thing already known.<\/p><p>Rule 1: Use a before a consonant sound; an before a vowel sound<\/p><div class=\"tw\"><table><tr><th>a (consonant sound)<\/th><th>an (vowel sound)<\/th><\/tr><tr><td>a book (littafi)<\/td><td>an egg (ƙwai)<\/td><\/tr><tr><td>a farmer (manomi)<\/td><td>an orange (lemu)<\/td><\/tr><tr><td>a market (kasuwa)<\/td><td>an apple (tuffa)<\/td><\/tr><tr><td>a goat (akuya)<\/td><td>an umbrella (laima)<\/td><\/tr><\/table><\/div>", "<div class=\"box\"><b>Listen to the sound, not the letter<\/b><br>an hour (the h is silent: the word begins with a vowel sound)<\/td><\/tr><tr><td>an honest man (the h is silent)<\/td><\/tr><tr><td>a university (the word begins with a “yoo” sound, a consonant sound)<\/td><\/tr><tr><td>a useful book (also a “yoo” sound)<\/div><p>Rule 2: Use a/an for jobs and for describing a person or thing<\/p><div class=\"tw\"><table><tr><th>English He is a doctor. She is a teacher. Musa has a shop. She has an umbrella. It is a useful book.<\/th><th>Hausa<\/th><\/tr><tr><td><\/td><td>Shi likita ne.<\/td><\/tr><tr><td><\/td><td>Ita malama ce.<\/td><\/tr><tr><td><\/td><td>Musa yana da shago.<\/td><\/tr><tr><td><\/td><td>Tana da laima.<\/td><\/tr><tr><td><\/td><td>Littafi ne mai amfani.<\/td><\/tr><\/table><\/div><p>Rule 3: Do not use a/an with plural or uncountable nouns Wrong: a books, a rice. Correct: a book, books, some rice, a bag of rice.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Ana amfani da a kafin kalmar da ta fara da sautin baƙaƙe (a book, a farmer), da an kafin kalmar da ta fara da sautin wasali (an egg, an orange). Ka saurari sauti, ba harafi ba: “an hour” (h ba a faɗa ba), amma “a university” (yana farawa da sautin “yoo”). Ba a amfani da a/an kafin jam’i ko kalmomin da ba a ƙirga su (a rice ✗).<\/div><h2>6.3 The<\/h2><p>Use the when the speaker and the listener both know which thing is meant. Here are the main cases.<\/p>", "<p>1. When something has already been mentioned<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I have a goat. The goat is strong.<\/td><td>Ina da akuya. Akuyar tana da ƙarfi.<\/td><\/tr><\/table><\/div><p>2. When there is only one<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>The sun is hot.<\/td><td>Rana tana da zafi.<\/td><\/tr><tr><td>Where is the market?<\/td><td>Ina kasuwar take?<\/td><\/tr><\/table><\/div><p>3. When the situation makes it clear<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Please close the door.<\/td><td>Don Allah ka rufe ƙofar.<\/td><\/tr><tr><td>The teacher is in the class.<\/td><td>Malamin yana cikin aji.<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>a / an (any one)<\/th><th>the (a particular one)<\/th><\/tr><tr><td>I need a pen. (any pen)<\/td><td>Give me the pen. (the one we both know)<\/td><\/tr><tr><td>She has a shop. (new information)<\/td><td>The shop is near the mosque. (we now know which)<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Ana amfani da the idan mai magana da mai saurare duk sun san abin da ake nufi: an riga an ambace shi (I have a goat. The goat…), ko kuma shi kaɗai ne (the sun), ko kuma yanayin ya bayyana shi (Close the door). Ana amfani da a/an a karo na farko, sannan the daga baya.<\/div><h2>6.4 No Article<\/h2><p>Sometimes we use no article at all.<\/p>", "<p>• With plural nouns and uncountable nouns used in a general way: Farmers grow maize. (Manoma suna noman masara.) I like rice. (Ina son shinkafa.)<\/p><p>• With names of people and most places: Musa lives in Kano.<\/p><p>• With languages and school subjects: She speaks English. (Tana magana da Turanci.)<\/p><p>• With meals: We eat breakfast at seven.<\/p><p>• With days and months: on Friday, in March.<\/p><p>• In some fixed phrases: go to school, go to work, go to bed, at home.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Aisha goes to school every day.<\/td><td>Aisha tana zuwa makaranta kowace rana.<\/td><\/tr><tr><td>My father goes to work early.<\/td><td>Mahaifina yana zuwa aiki da wuri.<\/td><\/tr><tr><td>The children are at home.<\/td><td>Yara suna gida.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Go to school or go to the school?<\/b><br>She goes to school means she is a student who studies there. She goes to the school means she goes to that building for another reason (for example, to meet the headmaster).<\/div><h2>6.5 A Quick Guide<\/h2><p>Ask yourself these questions:<\/p><p>• Is the noun singular and countable? Yes → use a/an (any one) or the (a particular one).<\/p><p>• Is the noun plural or uncountable? Yes → use no article (general), some, or the (a particular one).<\/p><p>• Is it a name, language, meal, day, or fixed phrase? Often → no article.<\/p>", "<h2>6.6 Articles in Daily Life<\/h2><p>A teacher checks the class. Read it aloud.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Teacher: Do you have a pen?<\/td><td>Malami: Kana da alƙalami?<\/td><\/tr><tr><td>Student: Yes, I have a pen and an exercise book.<\/td><td>Ɗalibi: Ee, ina da alƙalami da littafin rubutu.<\/td><\/tr><tr><td>Teacher: Please open the book on page ten.<\/td><td>Malami: Don Allah buɗe littafin a shafi na goma.<\/td><\/tr><tr><td>Student: Yes, sir.<\/td><td>Ɗalibi: Ee, malam.<\/td><\/tr><tr><td>Teacher: The exercise is easy.<\/td><td>Malami: Atisayen yana da sauƙi.<\/td><\/tr><\/table><\/div><h2>6.7 Common Mistakes and Corrections<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>She is teacher.<\/td><td>She is a teacher.<\/td><td>Use a/an before a job. (A faɗi “a”.)<\/td><\/tr><tr><td>I have a umbrella.<\/td><td>I have an umbrella.<\/td><td>“Umbrella” begins with a vowel sound.<\/td><\/tr><tr><td>He is an university student.<\/td><td>He is a university student.<\/td><td>“University” begins with a “yoo” sound.<\/td><\/tr><tr><td>He is honest man.<\/td><td>He is an honest man.<\/td><td>Use “an” (silent h); do not leave out the article.<\/td><\/tr><tr><td>I want a rice.<\/td><td>I want some rice. / I want rice.<\/td><td>“Rice” is uncountable.<\/td><\/tr><tr><td>Sun is hot today.<\/td><td>The sun is hot today.<\/td><td>There is only one sun.<\/td><\/tr><tr><td>We go to the school every day. (as students)<\/td><td>We go to school every day.<\/td><td>Fixed phrase: no article.<\/td><\/tr><tr><td>I like the rice. (rice in general)<\/td><td>I like rice.<\/td><td>General meaning: no article.<\/td><\/tr><\/table><\/div>", "<h2>6.8 Guided Practice<\/h2><p>Choose the article: ___ egg is on the table. I want ___ orange.<\/p><p>• “egg” begins with a vowel sound → an. If we are talking about a particular egg we both see, we can say The egg is on the table.<\/p><p>• “orange” begins with a vowel sound → an orange. Now: She is ___ nurse. “nurse” begins with a consonant sound → a nurse.<\/p><h2>6.9 Exercises<\/h2><p>Exercise 6A: A or an? Write a or an.<br>1. ___ egg<br>2. ___ goat<br>3. ___ orange<br>4. ___ market<br>5. ___ hour<br>6. ___ university<br>7. ___ umbrella<br>8. ___ useful book<br>9. ___ honest man<br>10. ___ farmer<\/p><p>Exercise 6B: A, an, the, or no article Write a, an, the, or – (for no article).<br>1. Musa is ___ farmer.<br>2. I have a goat. ___ goat is strong.<br>3. ___ sun is hot today.<br>4. She wants ___ orange.<br>5. We eat ___ rice every day.<br>6. Please close ___ door.<br>7. My brother is ___ engineer.<br>8. Aisha goes to ___ school every day.<\/p><p>Exercise 6C: Multiple choice 1. Which is correct? (a) She is teacher. (b) She is a teacher. (c) She is an teacher.<\/p>", "<p>2. We use “an” before: (a) a vowel sound (b) a consonant sound (c) a plural noun 3. Which is correct? (a) I want a rice. (b) I want some rice. (c) I want an rice. 4. Which is correct? (a) He is an honest man. (b) He is a honest man. (c) He is honest man. 5. Which is correct? (a) The sun is hot. (b) Sun is hot. (c) A sun is hot.<\/p><p>Exercise 6D: Sentence correction Correct each sentence.<br>1. She is teacher.<br>2. I have a umbrella.<br>3. He is an university student.<br>4. I want a rice.<br>5. Sun is hot today.<br>6. We go to the school every day. (We are students.)<br>7. He is honest man.<\/p><p>Exercise 6E: Sentence construction<br>1. Write a sentence with “a” and a job.<br>2. Write a sentence with “an” and a fruit.<br>3. Write two sentences: in the first, use “a” + a noun; in the second, use “the” + the same noun.<br>4. Write a sentence about a food you like. Use no article.<\/p><p>Exercise 6F: Translation Hausa to English:<br>1. Shi likita ne.<br>2. Ina da laima.<br>3. Malamin yana cikin aji.<\/p>", "<p>4. Ina son shinkafa. 5. Rana tana da zafi. English to Hausa: 6. She is a teacher. 7. I want an orange. 8. Where is the market? 9. Farmers grow maize. 10. Please close the door. (to a man)<\/p><p>Exercise 6G: Everyday communication task Write four sentences about your room or your home. Use a, an, and the correctly.<\/p><h2>6.10 Chapter Summary<\/h2><p>• English has three articles: a, an (any one), and the (a particular one).<\/p><p>• Use a before a consonant sound and an before a vowel sound. Listen to the sound.<\/p><p>• Use a/an only with singular countable nouns.<\/p><p>• Use the when both speaker and listener know which one is meant.<\/p><p>• Use no article for general plurals and uncountable nouns, names, languages, meals, days, and fixed phrases like go to school.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Taƙaitawa: Turanci yana da article uku: a, an (kowane ɗaya), da the (takamaimai). A yi amfani da a kafin sautin baƙaƙe, an kafin sautin wasali. A yi amfani da the idan kowa ya san abin da ake nufi. Ba a amfani da article kafin jam’i na gaba ɗaya, kalmomin da ba a ƙirga su, sunaye, harsuna, abinci, da wasu jimloli kamar “go to school”.<\/div>", "<h2>6.11 Review Questions<\/h2><p>1. What are the three articles in English?<br>2. Why do we say “an hour” but “a university”?<br>3. When do we use “the”?<br>4. Correct this sentence: “I want a rice.” Explain why.<br>5. Give two situations where we use no article.<\/p><div class=\"ch\">Chapter 7<\/div><h1>Adjectives<\/h1><p>Sifa<\/p><h2>Learning Objectives<\/h2><p>After this chapter, you will be able to:<\/p><p>• Explain what an adjective is and find adjectives in a sentence.<\/p><p>• Put adjectives in the correct place in a sentence.<\/p><p>• Put two or more adjectives in the correct order.<\/p><p>• Make comparative and superlative forms.<\/p><p>• Compare people and things using than, the, and as … as.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Manufofin Babi: Bayan wannan babi, za ka iya gane sifa (adjective) a cikin jimla; ka sanya ta a wurin da ya dace; ka jera sifofi fiye da ɗaya daidai; ka yi kwatanta (comparative) da mafi-girma (superlative); sannan ka kwatanta mutane da abubuwa da than da as … as.<\/div><h2>7.1 What Is an Adjective?<\/h2><p>An adjective is a word that describes a noun. It tells us more about a person, a place, or a thing: its size, colour, age, quality, and so on.<\/p>", "<div class=\"tw\"><table><tr><th>Kind<\/th><th>English adjectives<\/th><th>Hausa meaning<\/th><\/tr><tr><td>Size<\/td><td>big, small, tall, short<\/td><td>babba, ƙarami, dogo, gajere<\/td><\/tr><tr><td>Colour<\/td><td>red, white, black, green, blue, yellow<\/td><td>ja, fari, baƙi, kore, shuɗi, rawaya<\/td><\/tr><tr><td>Age and condition<\/td><td>new, old, young<\/td><td>sabo, tsoho, saurayi/yaro<\/td><\/tr><tr><td>Quality<\/td><td>good, bad, clean, dirty<\/td><td>mai kyau, mara kyau, mai tsabta, mai ƙazanta<\/td><\/tr><tr><td>Price and weather<\/td><td>expensive, cheap, hot, cold<\/td><td>mai tsada, mai araha, mai zafi, mai sanyi<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Sifa (adjective) kalma ce da ke bayyana suna: girmansa, launinsa, shekarunsa, ko halinsa. Misali: “babbar kasuwa”, “sabuwar waya”, “farar akuya”.<\/div><div class=\"box\"><b>A big difference from Hausa<\/b><br>In Hausa, an adjective changes for gender and number: babban gida (m), babbar kasuwa (f), manyan gidaje (plural). In English, an adjective never changes: a big house, a big market, big houses. Never add -s to an adjective.<\/div><h2>7.2 Where Do Adjectives Go?<\/h2><p>An adjective can come in two places.<\/p><p>1. Before a noun<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>a big house<\/td><td>babban gida<\/td><\/tr><tr><td>a new phone<\/td><td>sabuwar waya<\/td><\/tr><tr><td>a small shop<\/td><td>ƙaramin shago<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>a red bag<\/td><td>jar jaka<\/td><\/tr><tr><td>an old car<\/td><td>tsohuwar mota<\/td><\/tr><tr><td>a hot day<\/td><td>rana mai zafi<\/td><\/tr><\/table><\/div><p>2. After the verb to be (and some other verbs)<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>The market is big.<\/td><td>Kasuwa babba ce.<\/td><\/tr><tr><td>The room is clean.<\/td><td>Ɗakin yana da tsabta.<\/td><\/tr><tr><td>The water is cold.<\/td><td>Ruwan yana da sanyi.<\/td><\/tr><tr><td>The rice tastes good.<\/td><td>Shinkafar tana da daɗi.<\/td><\/tr><\/table><\/div><p>In Hausa, an adjective can come before or after the noun (babban gida or gida babba). In English, the adjective comes before the noun: a big house, not “a house big”.<\/p><p>Use and between adjectives that come after a verb: The room is clean and cool. (Ɗakin yana da tsabta da sanyi.)<\/p><h2>7.3 The Order of Adjectives<\/h2><p>When we use two or more adjectives before a noun, we usually follow this order:<\/p><p>opinion → size → age → colour → noun<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>a nice small bag<\/td><td>kyakkyawar ƙaramar jaka<\/td><\/tr><tr><td>a big old car<\/td><td>babbar tsohuwar mota<\/td><\/tr><tr><td>a small black phone<\/td><td>ƙaramar baƙar waya<\/td><\/tr><tr><td>a big white goat<\/td><td>babbar farar akuya<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>a good new book<\/td><td>sabon littafi mai kyau<\/td><\/tr><\/table><\/div><p>We say a big red bag, not “a red big bag”.<\/p><h2>7.4 Comparing Things: Comparative Adjectives<\/h2><p>We use the comparative to compare two people or things. We use than after it.<\/p><p>Short adjectives: add -er<\/p><div class=\"tw\"><table><tr><th>Adjective<\/th><th>Comparative<\/th><th>Rule<\/th><\/tr><tr><td>tall<\/td><td>taller<\/td><td>add -er<\/td><\/tr><tr><td>cheap<\/td><td>cheaper<\/td><td>add -er<\/td><\/tr><tr><td>big<\/td><td>bigger<\/td><td>double the last letter after one vowel + one consonant<\/td><\/tr><tr><td>large<\/td><td>larger<\/td><td>add -r if it ends in e<\/td><\/tr><tr><td>happy<\/td><td>happier<\/td><td>change y to -ier<\/td><\/tr><tr><td>easy<\/td><td>easier<\/td><td>change y to -ier<\/td><\/tr><\/table><\/div><p>Long adjectives: use more<\/p><div class=\"tw\"><table><tr><th>Adjective<\/th><th>Comparative<\/th><\/tr><tr><td>expensive<\/td><td>more expensive<\/td><\/tr><tr><td>beautiful<\/td><td>more beautiful<\/td><\/tr><tr><td>important<\/td><td>more important<\/td><\/tr><\/table><\/div><p>Irregular adjectives<\/p><div class=\"tw\"><table><tr><th>Adjective<\/th><th>Comparative<\/th><th>Superlative<\/th><\/tr><tr><td>good<\/td><td>better<\/td><td>the best<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Adjective<\/th><th>Comparative<\/th><th>Superlative<\/th><\/tr><tr><td>bad<\/td><td>worse<\/td><td>the worst<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Musa is taller than Aisha.<\/td><td>Musa ya fi Aisha tsayi.<\/td><\/tr><tr><td>Kano market is bigger than our market.<\/td><td>Kasuwar Kano ta fi kasuwarmu girma.<\/td><\/tr><tr><td>This phone is more expensive than that phone.<\/td><td>Wannan wayar ta fi wancan tsada.<\/td><\/tr><tr><td>Rice is cheaper than meat.<\/td><td>Shinkafa ta fi nama araha.<\/td><\/tr><\/table><\/div><h2>7.5 The Superlative<\/h2><p>We use the superlative to say that something is the highest or the most of all. We use the before it. Short adjectives take -est; long adjectives take most.<\/p><div class=\"tw\"><table><tr><th>Adjective<\/th><th>Comparative<\/th><th>Superlative<\/th><\/tr><tr><td>tall<\/td><td>taller<\/td><td>the tallest<\/td><\/tr><tr><td>big<\/td><td>bigger<\/td><td>the biggest<\/td><\/tr><tr><td>happy<\/td><td>happier<\/td><td>the happiest<\/td><\/tr><tr><td>expensive<\/td><td>more expensive<\/td><td>the most expensive<\/td><\/tr><tr><td>good<\/td><td>better<\/td><td>the best<\/td><\/tr><tr><td>bad<\/td><td>worse<\/td><td>the worst<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Musa is the tallest boy in the class.<\/td><td>Musa shi ne ya fi kowa tsayi a aji.<\/td><\/tr><tr><td>This is the best book.<\/td><td>Wannan shi ne littafi mafi kyau.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>This is the biggest shop in our street.<\/td><td>Wannan shi ne shago mafi girma a titinmu.<\/td><\/tr><\/table><\/div><p>As … as Use as + adjective + as to say that two things are equal.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Aisha is as tall as Fatima.<\/td><td>Tsayin Aisha ɗaya ne da na Fatima.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>A Hausa, ana kwatantawa da “ya fi / ta fi”: “Musa ya fi Aisha tsayi”. Ana nuna mafi-girma da “mafi”: “littafi mafi kyau”. A Turanci: ana ƙara -er + than ga gajerun sifofi (taller than), more + sifa + than ga dogayen sifofi (more expensive than), kuma the + -est ko the most don mafi-girma (the tallest, the most expensive). Ka tuna: “good → better → best”.<\/div><h2>7.6 Adjectives in Daily Life<\/h2><p>A customer buys a phone. Read it aloud.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Customer: I want a new phone.<\/td><td>Mai saye: Ina son sabuwar waya.<\/td><\/tr><tr><td>Seller: This black phone is good.<\/td><td>Mai sayarwa: Wannan baƙar wayar tana da kyau.<\/td><\/tr><tr><td>Customer: Is it expensive?<\/td><td>Mai saye: Tana da tsada?<\/td><\/tr><tr><td>Seller: This one is cheaper than that one.<\/td><td>Mai sayarwa: Wannan ta fi wancan araha.<\/td><\/tr><tr><td>Customer: Which is the best?<\/td><td>Mai saye: Wace ce mafi kyau?<\/td><\/tr><tr><td>Seller: The big one is the best, but it is more expensive.<\/td><td>Mai sayarwa: Babbar ita ce mafi kyau, amma ta fi tsada.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Customer: I want the cheaper one.<\/td><td>Mai saye: Ina son mai araha.<\/td><\/tr><\/table><\/div><h2>7.7 Common Mistakes and Corrections<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>a house big<\/td><td>a big house<\/td><td>Adjective before the noun.<\/td><\/tr><tr><td>a red big bag<\/td><td>a big red bag<\/td><td>Size comes before colour.<\/td><\/tr><tr><td>She is a beautifuls girl.<\/td><td>She is a beautiful girl.<\/td><td>Adjectives never take -s.<\/td><\/tr><tr><td>Aisha is more taller than Fatima.<\/td><td>Aisha is taller than Fatima.<\/td><td>Use either -er or more, not both.<\/td><\/tr><tr><td>This is gooder than that.<\/td><td>This is better than that.<\/td><td>“Good” is irregular.<\/td><\/tr><tr><td>Musa is taller that Aisha.<\/td><td>Musa is taller than Aisha.<\/td><td>Use “than” to compare.<\/td><\/tr><tr><td>He is the most tallest boy.<\/td><td>He is the tallest boy.<\/td><td>Use either -est or most, not both.<\/td><\/tr><tr><td>She has a expensive phone.<\/td><td>She has an expensive phone.<\/td><td>“Expensive” begins with a vowel sound.<\/td><\/tr><\/table><\/div><h2>7.8 Guided Practice<\/h2><p>Compare Musa (1.80 m) and Aisha (1.60 m). Use “tall”.<\/p><p>• “Tall” is a short adjective → comparative taller.<\/p><p>• Sentence: Musa is taller than Aisha.<\/p><p>• Superlative (in a group of three or more): Musa is the tallest. Put in order: bag / red / big / a → opinion/size/age/colour → a big red bag.<\/p>", "<h2>7.9 Exercises<\/h2><p>Exercise 7A: Find the adjectives Write the adjectives in each sentence.<br>1. She has a new phone.<br>2. The big market is busy.<br>3. We live in a small house.<br>4. The water is cold.<br>5. Musa is a tall, kind boy.<\/p><p>Exercise 7B: Adjective before the noun Rewrite each as a noun phrase with a or an.<br>1. The phone is new. → ___<br>2. The goat is white. → ___<br>3. The market is big. → ___<br>4. The room is clean. → ___<br>5. The bag is red. → ___<\/p><p>Exercise 7C: Put the words in order<br>1. bag / red / big / a<br>2. phone / new / black / a<br>3. car / old / small / a<br>4. goat / white / big / a<br>5. house / nice / new / a<\/p><p>Exercise 7D: Comparative and superlative Write the comparative and the superlative.<br>1. tall<br>2. big<br>3. happy<br>4. cheap<br>5. expensive<br>6. good<br>7. bad<br>8. easy<\/p>", "<p>Exercise 7E: Comparatives Write the comparative form of the word in brackets.<br>1. Musa is ___ (tall) than Aisha.<br>2. Rice is ___ (cheap) than meat.<br>3. This phone is ___ (expensive) than that one.<br>4. Kano market is ___ (big) than our market.<br>5. Her English is ___ (good) than my English.<\/p><p>Exercise 7F: Superlatives Write the superlative form of the word in brackets.<br>1. Musa is the ___ (tall) boy in the class.<br>2. This is the ___ (good) book.<br>3. It is the ___ (expensive) phone in the shop.<br>4. She is the ___ (happy) girl.<br>5. This is the ___ (big) shop in our street.<\/p><p>Exercise 7G: Multiple choice<br>1. Which is correct? (a) a red big bag (b) a big red bag (c) a bag big red<br>2. Musa is taller ___ Aisha. (a) that (b) than (c) then<br>3. Which is correct? (a) more taller (b) taller (c) most tall<br>4. The comparative of “good” is: (a) gooder (b) better (c) best<br>5. Which is correct? (a) She is a beautifuls girl. (b) She is a beautiful girl. (c) She is a girl beautiful.<\/p><p>Exercise 7H: Sentence correction Correct each sentence.<br>1. Aisha is more taller than Fatima.<br>2. This is gooder than that.<br>3. Musa is taller that Aisha.<\/p>", "<p>4. She has a red big bag. 5. He is the most tallest boy. 6. She has a expensive phone.<\/p><p>Exercise 7I: Sentence construction<br>1. Describe your house with two adjectives.<br>2. Compare two people using “than”.<br>3. Write a sentence with a superlative and “the”.<br>4. Write a question with an adjective.<br>5. Describe your town with three adjectives.<\/p><p>Exercise 7J: Translation Hausa to English:<br>1. Ina da sabuwar waya.<br>2. Kasuwa babba ce.<br>3. Ɗakin yana da tsabta.<br>4. Musa ya fi Aisha tsayi.<br>5. Wannan shi ne littafi mafi kyau. English to Hausa:<br>6. I have a small shop.<br>7. The water is cold.<br>8. This phone is more expensive than that phone.<br>9. Aisha has a big black bag.<br>10. Rice is cheaper than meat.<\/p><p>Exercise 7K: Everyday communication task Describe your best friend or your favourite shop. Use at least five adjectives, and include one comparison.<\/p>", "<h2>7.10 Chapter Summary<\/h2><p>• An adjective describes a noun. It never changes for number or gender in English.<\/p><p>• Adjectives come before a noun or after be: a big house; the house is big.<\/p><p>• Order: opinion → size → age → colour → noun (a nice big old red car).<\/p><p>• Comparative: -er + than (taller than), or more + adjective + than (more expensive than). Good → better; bad → worse.<\/p><p>• Superlative: the + -est (the tallest), or the most + adjective (the most expensive). Good → the best; bad → the worst.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Taƙaitawa: Sifa tana bayyana suna kuma a Turanci ba ta canzawa saboda jinsi ko jam’i. Tana zuwa kafin suna (a big house) ko bayan be (The house is big). A yi kwatanta da -er/more + than, a yi mafi- girma da the -est/the most. Ka tuna kuskuren da ake yi: “more taller” ✗, “gooder” ✗, “beautifuls” ✗.<\/div><h2>7.11 Review Questions<\/h2><p>1. What is an adjective? Give three examples.<br>2. Where do we put adjectives in a sentence?<br>3. Write the correct order: “red / a / big / bag”.<br>4. What is the comparative and superlative of “good” and “expensive”?<br>5. What is wrong with “more taller”?<\/p>", "<div class=\"ch\">Chapter 8<\/div><h1>Prepositions<\/h1><p>Kalmomin Wuri, Lokaci, da Dangantaka<\/p><h2>Learning Objectives<\/h2><p>After this chapter, you will be able to:<\/p><p>• Explain what a preposition is.<\/p><p>• Use in, on, and at correctly for place and time.<\/p><p>• Use prepositions of place (under, near, between, behind…) and direction (to, from, into, across…).<\/p><p>• Use with, by, for, and about.<\/p><p>• Use common verb + preposition combinations such as listen to and wait for.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Manufofin Babi: Bayan wannan babi, za ka iya bayyana ma’anar preposition; ka yi amfani da in, on, at don wuri da lokaci; ka yi amfani da under, near, between, behind da to, from, into, across; ka yi amfani da with, by, for, about; sannan ka koyi haɗin aikatau da preposition kamar “listen to” da “wait for”.<\/div><h2>8.1 What Is a Preposition?<\/h2><p>A preposition is a small word that shows how a noun or a pronoun is connected to another word in the sentence. Prepositions often show place, time, and direction. A preposition is followed by a noun or a pronoun. After a preposition, we use object pronouns (with me, for them, to us).<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>The book is on the table.<\/td><td>Littafin yana kan tebur.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I go to school with my brother.<\/td><td>Ina zuwa makaranta tare da ɗan’uwana.<\/td><\/tr><tr><td>Please sit with me.<\/td><td>Ka zauna tare da ni, don Allah.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Preposition kalma ce da ke nuna wuri, lokaci, ko dangantaka tsakanin suna da sauran kalmomin jimla, kamar “a, cikin, kan, ƙarƙashin, kusa da, zuwa, daga, tare da”.<\/td><\/tr><tr><td>Bambanci mai muhimmanci: a Hausa, kalmar “a” tana aiki a wurare da yawa (a gida, a kasuwa, a kan tebur, a cikin buhu). A Turanci kuwa, dole ne ka zaɓi tsakanin in, on, at da sauransu. Wannan shi ne babban dalilin kuskure ga masu jin Hausa.<\/div><h2>8.2 Prepositions of Place<\/h2><div class=\"tw\"><table><tr><th>Preposition<\/th><th>Meaning<\/th><th>Hausa<\/th><\/tr><tr><td>in<\/td><td>inside a space or area<\/td><td>a cikin / a<\/td><\/tr><tr><td>on<\/td><td>on a surface<\/td><td>a kan<\/td><\/tr><tr><td>at<\/td><td>at a point or place<\/td><td>a<\/td><\/tr><tr><td>under<\/td><td>below<\/td><td>a ƙarƙashin<\/td><\/tr><tr><td>near<\/td><td>not far from<\/td><td>kusa da<\/td><\/tr><tr><td>next to<\/td><td>beside<\/td><td>a gefen<\/td><\/tr><tr><td>between<\/td><td>in the middle of two<\/td><td>tsakanin<\/td><\/tr><tr><td>in front of<\/td><td>before (the front of)<\/td><td>a gaban<\/td><\/tr><tr><td>behind<\/td><td>at the back of<\/td><td>a bayan<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>The book is on the table.<\/td><td>Littafin yana kan tebur.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>The rice is in the bag.<\/td><td>Shinkafar tana cikin buhu.<\/td><\/tr><tr><td>The goat is under the tree.<\/td><td>Akuyar tana ƙarƙashin bishiya.<\/td><\/tr><tr><td>The shop is near the mosque.<\/td><td>Shagon yana kusa da masallaci.<\/td><\/tr><tr><td>The school is next to the clinic.<\/td><td>Makarantar tana a gefen asibiti.<\/td><\/tr><tr><td>The shop is between the bank and the pharmacy.<\/td><td>Shagon yana tsakanin banki da kantin magani.<\/td><\/tr><tr><td>The teacher is standing in front of the class.<\/td><td>Malami yana tsaye a gaban aji.<\/td><\/tr><tr><td>The boy is behind the door.<\/td><td>Yaron yana bayan ƙofa.<\/td><\/tr><\/table><\/div><p>In, on, and at: the basic difference<\/p><div class=\"tw\"><table><tr><th>Use<\/th><th>Examples<\/th><th>Hausa<\/th><\/tr><tr><td>in: inside a space, a town, a country<\/td><td>in the room; in the bag; in Kano; in Nigeria<\/td><td>a cikin ɗaki; a cikin jaka; a Kano; a Najeriya<\/td><\/tr><tr><td>on: on a surface<\/td><td>on the table; on the wall; on the road<\/td><td>a kan tebur; a jikin bango; a kan hanya<\/td><\/tr><tr><td>at: at a point or a known place<\/td><td>at school; at home; at the gate; at the market<\/td><td>a makaranta; a gida; a ƙofa; a kasuwa<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>A Hausa, ana iya cewa “a” ga duk waɗannan, amma a Turanci: in = cikin wani wuri ko gari (in Kano), on = a saman wani abu (on the table), at = a wuri takamaimai (at school, at home). Ka koyi misalan, ba kalma-da-kalma ba.<\/div>", "<h2>8.3 Prepositions of Time<\/h2><div class=\"tw\"><table><tr><th>Preposition<\/th><th>Use<\/th><th>Examples<\/th><th>Hausa<\/th><\/tr><tr><td>at<\/td><td>clock times; night<\/td><td>at six o’clock; at night<\/td><td>da ƙarfe shida; da dare<\/td><\/tr><tr><td>on<\/td><td>days and dates<\/td><td>on Friday; on Monday morning<\/td><td>ranar Juma’a; safiyar Litinin<\/td><\/tr><tr><td>in<\/td><td>months, seasons, parts of the day<\/td><td>in March; in the morning; in the evening<\/td><td>a watan Maris; da safe; da yamma<\/td><\/tr><tr><td>before<\/td><td>earlier than<\/td><td>before breakfast<\/td><td>kafin cin abincin safe<\/td><\/tr><tr><td>after<\/td><td>later than<\/td><td>after school<\/td><td>bayan makaranta<\/td><\/tr><tr><td>from … to<\/td><td>start and end<\/td><td>from Monday to Friday<\/td><td>daga Litinin zuwa Juma’a<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>The market opens at eight o’clock.<\/td><td>Kasuwa tana buɗewa da ƙarfe takwas.<\/td><\/tr><tr><td>I go to the market on Saturday.<\/td><td>Ina zuwa kasuwa ranar Asabar.<\/td><\/tr><tr><td>School starts in September.<\/td><td>Makaranta tana farawa a watan Satumba.<\/td><\/tr><tr><td>Musa works from Monday to Friday.<\/td><td>Musa yana aiki daga Litinin zuwa Juma’a.<\/td><\/tr><tr><td>She eats breakfast before school.<\/td><td>Tana cin abincin safe kafin makaranta.<\/td><\/tr><tr><td>We play football after school.<\/td><td>Muna wasan ƙwallon ƙafa bayan makaranta.<\/td><\/tr><tr><td>I sleep at night.<\/td><td>Ina barci da dare.<\/td><\/tr><\/table><\/div><p>Remember<\/p>", "<p>We say in the morning, in the afternoon, in the evening, but at night.<\/p><h2>8.4 Prepositions of Direction<\/h2><div class=\"tw\"><table><tr><th>Preposition<\/th><th>Meaning<\/th><th>Hausa<\/th><\/tr><tr><td>to<\/td><td>towards a place<\/td><td>zuwa<\/td><\/tr><tr><td>from<\/td><td>starting point<\/td><td>daga<\/td><\/tr><tr><td>into<\/td><td>going inside<\/td><td>zuwa cikin<\/td><\/tr><tr><td>out of<\/td><td>leaving the inside<\/td><td>daga cikin<\/td><\/tr><tr><td>across<\/td><td>from one side to the other<\/td><td>ƙetare<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I go to the market.<\/td><td>Ina zuwa kasuwa.<\/td><\/tr><tr><td>She comes from Kano.<\/td><td>Ita ’yar Kano ce.<\/td><\/tr><tr><td>The children run into the class.<\/td><td>Yara suna gudu zuwa cikin aji.<\/td><\/tr><tr><td>He walks out of the shop.<\/td><td>Yana fita daga shago.<\/td><\/tr><tr><td>We walk across the road.<\/td><td>Muna ƙetare titi.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Do not use “to” with “home”<\/b><br>Say I go home, not “I go to home”. Say She is at home, not “She is in home”. Say We arrive at the market (a small place) but We arrive in Kano (a town).<\/div><h2>8.5 With, By, For, and About<\/h2><div class=\"tw\"><table><tr><th>Preposition<\/th><th>Use<\/th><th>Example<\/th><th>Hausa<\/th><\/tr><tr><td>with<\/td><td>together; using a tool<\/td><td>She cuts meat with a knife.<\/td><td>Tana yanka nama da wuƙa.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Preposition<\/th><th>Use<\/th><th>Example<\/th><th>Hausa<\/th><\/tr><tr><td>with<\/td><td>together with someone<\/td><td>I go to school with my brother.<\/td><td>Ina zuwa makaranta tare da ɗan’uwana.<\/td><\/tr><tr><td>by<\/td><td>means of travel<\/td><td>We travel by bus.<\/td><td>Muna tafiya da bas.<\/td><\/tr><tr><td>for<\/td><td>for someone or a purpose<\/td><td>This food is for the children.<\/td><td>Wannan abincin na yara ne.<\/td><\/tr><tr><td>about<\/td><td>on the subject of<\/td><td>We talk about farming.<\/td><td>Muna magana game da noma.<\/td><\/tr><tr><td>without<\/td><td>not having<\/td><td>He goes to the market without his phone.<\/td><td>Yana zuwa kasuwa ba tare da wayarsa ba.<\/td><\/tr><\/table><\/div><h2>8.6 Verbs with Fixed Prepositions<\/h2><p>Some verbs and adjectives always go with a particular preposition. You must learn them together.<\/p><div class=\"tw\"><table><tr><th>Expression<\/th><th>Example<\/th><th>Hausa<\/th><\/tr><tr><td>listen to<\/td><td>Please listen to the teacher.<\/td><td>Don Allah ka saurari malami.<\/td><\/tr><tr><td>look at<\/td><td>Look at the board.<\/td><td>Ka kalli allo.<\/td><\/tr><tr><td>wait for<\/td><td>I wait for you here.<\/td><td>Ina jiranka a nan.<\/td><\/tr><tr><td>good at<\/td><td>She is good at English.<\/td><td>Tana da ƙwarewa a Turanci.<\/td><\/tr><tr><td>interested in<\/td><td>He is interested in farming.<\/td><td>Yana sha’awar noma.<\/td><\/tr><tr><td>arrive at / in<\/td><td>We arrive in Kano at six.<\/td><td>Muna isa Kano da ƙarfe shida.<\/td><\/tr><\/table><\/div>", "<h2>8.7 Prepositions in Daily Life<\/h2><p>A visitor asks for directions. Read it aloud.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Visitor: Excuse me, where is the bank?<\/td><td>Baƙo: Don Allah, ina bankin yake?<\/td><\/tr><tr><td>Aisha: It is near the market, next to the pharmacy.<\/td><td>Aisha: Yana kusa da kasuwa, a gefen kantin magani.<\/td><\/tr><tr><td>Visitor: Is it far?<\/td><td>Baƙo: Yana da nisa?<\/td><\/tr><tr><td>Aisha: No. Walk along this road, and turn left at the mosque.<\/td><td>Aisha: A’a. Ka bi wannan hanyar, sai ka juya hagu a masallaci.<\/td><\/tr><tr><td>Visitor: Thank you very much.<\/td><td>Baƙo: Na gode sosai.<\/td><\/tr><\/table><\/div><h2>8.8 Common Mistakes and Corrections<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>He is on the school.<\/td><td>He is at school.<\/td><td>“At” for a known place and fixed phrases.<\/td><\/tr><tr><td>I go to home.<\/td><td>I go home.<\/td><td>No preposition after “go” + home.<\/td><\/tr><tr><td>We arrive to Kano.<\/td><td>We arrive in Kano.<\/td><td>Use “arrive in” a town, “arrive at” a small place.<\/td><\/tr><tr><td>I see you in Friday.<\/td><td>I see you on Friday.<\/td><td>“On” for days.<\/td><\/tr><tr><td>She listens the teacher.<\/td><td>She listens to the teacher.<\/td><td>“Listen” needs “to”.<\/td><\/tr><tr><td>I am interested on farming.<\/td><td>I am interested in farming.<\/td><td>“Interested in”.<\/td><\/tr><tr><td>We travel with bus.<\/td><td>We travel by bus.<\/td><td>“By” for transport.<\/td><\/tr><tr><td>The book is in the table.<\/td><td>The book is on the table.<\/td><td>“On” for a surface.<\/td><\/tr><\/table><\/div>", "<h2>8.9 Guided Practice<\/h2><p>Complete: The class starts ___ eight o’clock ___ Monday ___ the school hall.<\/p><p>• A clock time → at eight o’clock.<\/p><p>• A day → on Monday.<\/p><p>• Inside a room or building → in the school hall. Result: The class starts at eight o’clock on Monday in the school hall.<\/p><h2>8.10 Exercises<\/h2><p>Exercise 8A: In, on, or at? (place)<br>1. The book is ___ the table.<br>2. The rice is ___ the bag.<br>3. Aisha is ___ school.<br>4. We live ___ Kano.<br>5. The picture is ___ the wall.<br>6. Musa is waiting ___ the gate.<br>7. The children are ___ the classroom.<br>8. My brother is ___ home.<\/p><p>Exercise 8B: At, on, or in? (time)<br>1. The class starts ___ eight o’clock.<br>2. We go to the market ___ Saturday.<br>3. School starts ___ September.<br>4. I eat breakfast ___ the morning.<br>5. I sleep ___ night.<br>6. Musa travels ___ Monday morning.<br>7. It is hot ___ April.<br>8. The shop closes ___ six o’clock.<\/p>", "<p>Exercise 8C: To, from, into, out of, or across?<br>1. I go ___ the market.<br>2. He comes ___ Kano.<br>3. The children run ___ the classroom.<br>4. He walks ___ the shop. (He leaves it.)<br>5. We walk ___ the road.<\/p><p>Exercise 8D: With, by, for, about, or without?<br>1. She cuts meat ___ a knife.<br>2. We travel ___ bus.<br>3. This food is ___ the children.<br>4. They talk ___ farming.<br>5. I go to school ___ my brother.<br>6. He goes to the market ___ his phone. (He forgot it.)<\/p><p>Exercise 8E: Fixed expressions<br>1. Please listen ___ the teacher.<br>2. Look ___ the board.<br>3. I wait ___ you here.<br>4. She is good ___ English.<br>5. He is interested ___ farming.<br>6. We arrive ___ Kano at six.<\/p><p>Exercise 8F: Multiple choice<br>1. Which is correct? (a) She is in home. (b) She is at home. (c) She is on home.<br>2. Which is correct? (a) I go to home. (b) I go home. (c) I go at home.<br>3. We travel ___ bus. (a) with (b) by (c) in<br>4. The book is ___ the table. (a) in (b) on (c) at<\/p>", "<p>5. School starts ___ September. (a) at (b) on (c) in<\/p><p>Exercise 8G: Sentence correction Correct each sentence.<br>1. He is on the school.<br>2. I go to home.<br>3. We arrive to Kano.<br>4. I see you in Friday.<br>5. She listens the teacher.<br>6. I am interested on farming.<br>7. We travel with bus.<br>8. The book is in the table.<\/p><p>Exercise 8H: Sentence construction<br>1. Write a sentence with “under”.<br>2. Write a sentence with “between”.<br>3. Write a sentence with a time preposition (at, on, or in).<br>4. Write a question with “Where” and a place preposition.<br>5. Write a sentence with “by” for transport.<\/p><p>Exercise 8I: Translation Hausa to English:<br>1. Littafin yana kan tebur.<br>2. Shagon yana kusa da masallaci.<br>3. Ina zuwa kasuwa ranar Asabar.<br>4. Muna tafiya da bas.<br>5. Wannan abincin na yara ne. English to Hausa:<br>6. The goat is under the tree.<br>7. Musa works from Monday to Friday.<\/p>", "<p>8. She is at school. 9. We play football after school. 10. Please look at the board. (to a man)<\/p><p>Exercise 8J: Everyday communication task 1 Describe your room or your shop. Write four sentences that say where things are. Use in, on, under, and near.<\/p><p>Exercise 8K: Everyday communication task 2 A visitor asks you the way from your house to the market. Write four sentences to give directions. Use to, near, next to, across, or at.<\/p><h2>8.11 Chapter Summary<\/h2><p>• A preposition shows place, time, direction, or relationship. It is followed by a noun or an object pronoun.<\/p><p>• Place: in (inside), on (surface), at (point or known place); also under, near, next to, between, in front of, behind.<\/p><p>• Time: at (clock time, night), on (days, dates), in (months, parts of the day); before, after, from … to.<\/p><p>• Direction: to, from, into, out of, across. Say “go home”, not “go to home”.<\/p><p>• Learn fixed combinations: listen to, look at, wait for, good at, interested in, arrive at/in, travel by bus.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Taƙaitawa: Preposition tana nuna wuri, lokaci, ko alkibla. In = cikin wuri, on = saman abu, at = wuri takamaimai. Don lokaci: at + agogo, on + rana, in + wata ko lokacin rana. Ka tuna: “go home”, “arrive in Kano”, “travel by bus”, “listen to”, “wait for”.<\/div><h2>8.12 Review Questions<\/h2><p>1. What is a preposition? Give four examples.<\/p>", "<p>2. What is the difference between in, on, and at for place? Give one example of each. 3. Which prepositions do we use with clock times, days, and months? 4. What is wrong with “I go to home”? 5. Complete: “We travel ___ bus.” and “She listens ___ the teacher.”<\/p><div class=\"ch\">Chapter 9<\/div><h1>Asking Questions<\/h1><p>Yin Tambaya<\/p><h2>Learning Objectives<\/h2><p>After this chapter, you will be able to:<\/p><p>• Make yes/no questions with be and with do/does.<\/p><p>• Use question words: who, what, where, when, why, how, which, whose, how many, how much, how old.<\/p><p>• Put the words of a question in the correct order.<\/p><p>• Give correct short answers.<\/p><p>• Avoid the common mistakes in question word order.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Manufofin Babi: Bayan wannan babi, za ka iya yin tambayar “eh ko a’a” da be da do/does; ka yi amfani da kalmomin tambaya (who, what, where, when, why, how, which, whose, how many, how much, how old); ka jera kalmomin tambaya yadda ya dace; ka ba da gajeren amsa; sannan ka guji kura-kurai a jerin kalmomi.<\/div><h2>9.1 Two Kinds of Questions<\/h2><p>There are two main kinds of questions in English.<\/p><p>• Yes/no questions: the answer is yes or no. Do you sell rice?<\/p>", "<p>• Question-word questions (also called wh-questions): the answer gives information. Where do you sell rice?<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>A Turanci akwai tambaya iri biyu: tambayar “eh ko a’a” (yes/no question) da tambayar neman bayani (question-word question).<\/td><\/tr><tr><td>Bambanci mai muhimmanci: a Hausa, ana iya yin tambaya kawai ta ɗaga murya: “Kana gida?” A Turanci, dole ne a canza jerin kalmomi (“Are you at home?”). Furta “You are at home?” ana yi ne kawai a magana ta yau da kullum, ba a rubutu mai kyau ba.<\/div><h2>9.2 Yes/No Questions<\/h2><div class=\"tw\"><table><tr><th>Verb<\/th><th>Question pattern<\/th><th>Example<\/th><\/tr><tr><td>am / is / are<\/td><td>Am / Is / Are + subject …?<\/td><td>Are you a student?<\/td><\/tr><tr><td>other verbs (present)<\/td><td>Do / Does + subject + base verb …?<\/td><td>Does Musa sell rice?<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Are you tired?<\/td><td>Kana gajiya?<\/td><\/tr><tr><td>Is the market big?<\/td><td>Kasuwa babba ce?<\/td><\/tr><tr><td>Do you sell rice?<\/td><td>Kana sayar da shinkafa?<\/td><\/tr><tr><td>Does Aisha have a phone?<\/td><td>Aisha tana da waya?<\/td><\/tr><tr><td>Do they live in Kano?<\/td><td>Suna zaune a Kano?<\/td><\/tr><\/table><\/div><p>Short answers<\/p><div class=\"tw\"><table><tr><th>Question<\/th><th>Yes<\/th><th>No<\/th><\/tr><tr><td>Are you tired?<\/td><td>Yes, I am.<\/td><td>No, I am not.<\/td><\/tr><tr><td>Is Musa at school?<\/td><td>Yes, he is.<\/td><td>No, he is not.<\/td><\/tr><tr><td>Do you sell rice?<\/td><td>Yes, I do.<\/td><td>No, I do not.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>Question<\/th><th>Yes<\/th><th>No<\/th><\/tr><tr><td>Does she teach English?<\/td><td>Yes, she does.<\/td><td>No, she does not.<\/td><\/tr><\/table><\/div><p>We can also ask a choice question with or: Do you want rice or beans? (Kana son shinkafa ko wake?)<\/p><p>(Questions with can, could, will, and did are taught in later chapters. They use the same pattern: Can you …?, Did you …?)<\/p><h2>9.3 Question Words<\/h2><div class=\"tw\"><table><tr><th>Question word<\/th><th>Asks about<\/th><th>Hausa<\/th><\/tr><tr><td>who<\/td><td>a person<\/td><td>wa / wane<\/td><\/tr><tr><td>what<\/td><td>a thing<\/td><td>me / menene<\/td><\/tr><tr><td>where<\/td><td>a place<\/td><td>ina<\/td><\/tr><tr><td>when<\/td><td>a time<\/td><td>yaushe<\/td><\/tr><tr><td>why<\/td><td>a reason<\/td><td>me ya sa<\/td><\/tr><tr><td>how<\/td><td>the way or manner<\/td><td>yaya<\/td><\/tr><tr><td>which<\/td><td>a choice<\/td><td>wane / wace<\/td><\/tr><tr><td>whose<\/td><td>the owner<\/td><td>na wa<\/td><\/tr><tr><td>how many<\/td><td>a number (countable)<\/td><td>nawa<\/td><\/tr><tr><td>how much<\/td><td>an amount or a price<\/td><td>nawa<\/td><\/tr><tr><td>how old<\/td><td>age<\/td><td>shekara nawa<\/td><\/tr><\/table><\/div><p>The pattern is: question word + do/does (or am/is/are) + subject + verb.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Who is your teacher?<\/td><td>Wane ne malaminka?<\/td><\/tr><tr><td>What do you sell?<\/td><td>Me kake sayarwa?<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Where do you live?<\/td><td>Ina kake zaune?<\/td><\/tr><tr><td>When does the market open?<\/td><td>Yaushe kasuwa take buɗewa?<\/td><\/tr><tr><td>Why are you tired?<\/td><td>Me ya sa kake gajiya?<\/td><\/tr><tr><td>How do you go to school?<\/td><td>Yaya kake zuwa makaranta?<\/td><\/tr><tr><td>Which bag is yours?<\/td><td>Wace jaka ce taka?<\/td><\/tr><tr><td>Whose phone is this?<\/td><td>Wannan wayar ta wa ce?<\/td><\/tr><tr><td>How many students are in the class?<\/td><td>Ɗalibai nawa ne a ajin?<\/td><\/tr><tr><td>How much is this bag?<\/td><td>Nawa ne wannan jakar?<\/td><\/tr><tr><td>How old are you?<\/td><td>Shekarunka nawa?<\/td><\/tr><\/table><\/div><p>When the question word is the subject If the question word is the subject (it asks who or what does the action), do not use do/does.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Who sells rice here?<\/td><td>Wa ke sayar da shinkafa a nan?<\/td><\/tr><tr><td>Who lives in this house?<\/td><td>Wa ke zaune a wannan gidan?<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Compare<\/b><br>Who sells rice? (who is the subject: no “does”) and What does Musa sell? (Musa is the subject: use “does”).<\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>A Hausa, kalmar tambaya takan zo a wurare daban-daban a jimla. A Turanci kuwa, kalmar tambaya tana zuwa a farko, sannan do/does ko am/is/are, sannan mai aikatawa, sannan aikatau: “Where do you live?”. Idan kalmar tambaya ita ce mai aikatawa (Who sells rice?), ba a amfani da do/does.<\/div>", "<h2>9.4 Making Questions from Statements<\/h2><p>Look at this statement: Musa sells rice in the market. We can ask about each part.<\/p><div class=\"tw\"><table><tr><th>Ask about<\/th><th>Question<\/th><th>Answer<\/th><\/tr><tr><td>the person<\/td><td>Who sells rice in the market?<\/td><td>Musa.<\/td><\/tr><tr><td>the thing<\/td><td>What does Musa sell in the market?<\/td><td>Rice.<\/td><\/tr><tr><td>the place<\/td><td>Where does Musa sell rice?<\/td><td>In the market.<\/td><\/tr><tr><td>yes or no<\/td><td>Does Musa sell rice in the market?<\/td><td>Yes, he does.<\/td><\/tr><\/table><\/div><h2>9.5 Questions in Daily Life<\/h2><p>An officer at a training centre registers a new student. Read it aloud.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Officer: Good morning. What is your name?<\/td><td>Jami’i: Ina kwana. Menene sunanka?<\/td><\/tr><tr><td>New student: My name is Ibrahim Musa.<\/td><td>Sabon ɗalibi: Sunana Ibrahim Musa.<\/td><\/tr><tr><td>Officer: Where do you live?<\/td><td>Jami’i: Ina kake zaune?<\/td><\/tr><tr><td>New student: I live in Kano.<\/td><td>Sabon ɗalibi: Ina zaune a Kano.<\/td><\/tr><tr><td>Officer: What do you do?<\/td><td>Jami’i: Menene aikinka?<\/td><\/tr><tr><td>New student: I am a trader. I sell shoes.<\/td><td>Sabon ɗalibi: Ni ɗan kasuwa ne. Ina sayar da takalma.<\/td><\/tr><tr><td>Officer: How old are you?<\/td><td>Jami’i: Shekarunka nawa?<\/td><\/tr><tr><td>New student: I am twenty-two years old.<\/td><td>Sabon ɗalibi: Ina da shekara ashirin da biyu.<\/td><\/tr><\/table><\/div>", "<h2>9.6 Common Mistakes and Corrections<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>You are a student? (in writing)<\/td><td>Are you a student?<\/td><td>Change the word order.<\/td><\/tr><tr><td>Where you live?<\/td><td>Where do you live?<\/td><td>Add do/does.<\/td><\/tr><tr><td>What you sell?<\/td><td>What do you sell?<\/td><td>Add do/does.<\/td><\/tr><tr><td>Where does he lives?<\/td><td>Where does he live?<\/td><td>After “does”, no -s.<\/td><\/tr><tr><td>Do you are tired?<\/td><td>Are you tired?<\/td><td>Do not use do/does with be.<\/td><\/tr><tr><td>Why you are late?<\/td><td>Why are you late?<\/td><td>Put “are” before the subject.<\/td><\/tr><tr><td>How many rice do you want?<\/td><td>How much rice do you want?<\/td><td>“Rice” is uncountable.<\/td><\/tr><tr><td>Who does sell rice here?<\/td><td>Who sells rice here?<\/td><td>Who is the subject: no “does”.<\/td><\/tr><\/table><\/div><h2>9.7 Guided Practice<\/h2><p>Make a question from: Aisha lives in Kano. Ask about the place.<\/p><p>• Question word for a place: where.<\/p><p>• The subject is Aisha (= she), so use does: Where does Aisha live?<\/p><p>• The verb has no -s after does: live.<\/p><h2>9.8 Exercises<\/h2><p>Exercise 9A: Yes/no questions Make a yes/no question from each sentence.<br>1. You are tired.<br>2. Musa sells rice.<\/p>", "<p>3. They live in Kano. 4. The market is big. 5. Aisha has a phone. 6. We are late.<\/p><p>Exercise 9B: Question words Write who, what, where, when, why, how, which, whose, how many, or how much.<br>1. ___ is your teacher?<br>2. ___ do you sell?<br>3. ___ does he live?<br>4. ___ does the market open?<br>5. ___ are you late?<br>6. ___ do you go to school?<br>7. ___ phone is this?<br>8. ___ students are in the class?<br>9. ___ is this bag? (the price)<br>10. ___ bag is yours, the red one or the black one?<\/p><p>Exercise 9C: Put the words in order<br>1. you / do / where / live<br>2. sell / what / does / Musa<br>3. open / does / when / the market<br>4. is / who / he<br>5. late / you / why / are<\/p><p>Exercise 9D: Ask about the capital letters Write a question about the words in capital letters.<br>1. Musa sells RICE.<br>2. Aisha lives IN KANO.<\/p>", "<p>3. The market opens AT EIGHT O’CLOCK. 4. MUSA sells rice. 5. They go to school BY BUS.<\/p><p>Exercise 9E: Short answers Write a short answer.<br>1. Is Musa at school? (Yes)<br>2. Does she teach English? (No)<br>3. Are they farmers? (Yes)<br>4. Do you live in Kano? (No)<br>5. Is the market open? (No)<\/p><p>Exercise 9F: Multiple choice<br>1. Which is correct? (a) Where you live? (b) Where do you live? (c) Where you do live?<br>2. Which is correct? (a) Does he sells fish? (b) Does he sell fish? (c) Do he sell fish?<br>3. “___ is this bag?” (asking the price) (a) How many (b) How much (c) How old<br>4. Which is correct? (a) Do you are tired? (b) Are you tired? (c) You tired are?<br>5. Which is correct? (a) Who does sell rice? (b) Who sells rice? (c) Who sell rice?<\/p><p>Exercise 9G: Sentence correction Correct each question.<br>1. You are a student? (in writing)<br>2. Where you live?<br>3. What you sell?<br>4. Where does he lives?<br>5. Why you are late?<\/p>", "<p>6. How many rice do you want? 7. Do you are tired?<\/p><p>Exercise 9H: Complete the dialogue A: ___ is your name? B: My name is Aisha. A: ___ do you live? B: I live in Kano. A: ___ you a student? B: Yes, I am. A: ___ do you study? B: I study English.<\/p><p>Exercise 9I: Sentence construction<br>1. Write a yes/no question with “Do”.<br>2. Write a question with “Where”.<br>3. Write a question with “How many”.<br>4. Write a question with “Why”.<br>5. Write two questions you want to ask a new teacher.<\/p><p>Exercise 9J: Translation Hausa to English:<br>1. Kana sayar da shinkafa?<br>2. Ina kake zaune? (to a man)<br>3. Yaushe kasuwa take buɗewa?<br>4. Me ya sa kake gajiya?<br>5. Nawa ne wannan jakar? English to Hausa:<br>6. Who is your teacher?<br>7. What do you sell?<\/p>", "<p>8. Where is the school? 9. Do you want rice or beans? 10. How old are you?<\/p><p>Exercise 9K: Everyday communication task You meet a new classmate. Write five questions to ask. Use at least three different question words.<\/p><h2>9.9 Chapter Summary<\/h2><p>• Yes/no questions: Am/Is/Are + subject, or Do/Does + subject + base verb.<\/p><p>• Question-word questions: question word + do/does (or am/is/are) + subject + verb.<\/p><p>• When the question word is the subject, do not use do/does (Who sells rice?).<\/p><p>• Short answers repeat the helping verb: Yes, I do. / No, he is not.<\/p><p>• Use how many with countable nouns and how much with uncountable nouns or prices.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Taƙaitawa: A Turanci dole ne a canza jerin kalmomi don yin tambaya: Do/Does ko Am/Is/Are a gaban mai aikatawa. Kalmomin tambaya suna zuwa a farko: who, what, where, when, why, how, which, whose, how many, how much. Idan kalmar tambaya ita ce mai aikatawa, ba a amfani da do/does. Kada ka ce “Where you live?”; ka ce “Where do you live?”.<\/div><h2>9.10 Review Questions<\/h2><p>1. What are the two kinds of questions?<br>2. Make a question from “She works in Kano” (yes/no).<br>3. What is wrong with “Where you live?”<br>4. When do we use “how much” and when do we use “how many”?<\/p>", "<p>5. Why do we say “Who sells rice?” and not “Who does sell rice?”<\/p><div class=\"ch\">Chapter 10<\/div><h1>Negative Sentences<\/h1><p>Jimlolin Musantawa<\/p><h2>Learning Objectives<\/h2><p>After this chapter, you will be able to:<\/p><p>• Make negative sentences with be and with do/does.<\/p><p>• Use the short forms: isn’t, aren’t, don’t, doesn’t.<\/p><p>• Make negative commands with do not / don’t.<\/p><p>• Use no, any, never, nobody, and nothing correctly.<\/p><p>• Avoid double negatives in English.<\/p><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>Manufofin Babi: Bayan wannan babi, za ka iya yin jimlar musantawa da be da do/does; ka yi amfani da gajerun kalmomi (isn’t, aren’t, don’t, doesn’t); ka yi umarni na hani da do not; ka yi amfani da no, any, never, nobody, nothing; sannan ka guji amfani da musantawa biyu a jimla ɗaya a Turanci.<\/div><h2>10.1 What Is a Negative Sentence?<\/h2><p>A negative sentence says that something is not true, or that something does not happen. The most common negative word is not. Other negative words are no, never, nobody, nothing, and nowhere.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>My father is not a teacher.<\/td><td>Mahaifina ba malami ba ne.<\/td><\/tr><tr><td>I do not sell fish.<\/td><td>Ba na sayar da kifi.<\/td><\/tr><tr><td>There is no water.<\/td><td>Babu ruwa.<\/td><\/tr><\/table><\/div>", "<div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>A Hausa, ana yin musantawa ta amfani da “ba … ba” (Mahaifina ba malami ba ne), ko “ba ni/ba ka/ba shi…” (Ba na sayar da kifi), ko “babu” (Babu ruwa). A Turanci kuwa, ana ƙara not bayan am/is/are, ko do not / does not kafin aikatau. Ba a rufe jimla da “not” ba.<\/div><h2>10.2 Negatives with Be (Am, Is, Are)<\/h2><p>Add not after am, is, or are. (You studied this in Chapter 4.)<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>My father is not a teacher.<\/td><td>Mahaifina ba malami ba ne.<\/td><\/tr><tr><td>This bag is not mine.<\/td><td>Wannan jakar ba tawa ba ce.<\/td><\/tr><tr><td>The children are not at school.<\/td><td>Yara ba sa makaranta.<\/td><\/tr><tr><td>The shop is not open.<\/td><td>Shagon ba a buɗe yake ba.<\/td><\/tr><\/table><\/div><h2>10.3 Negatives in the Simple Present<\/h2><p>Use do not (don’t) with I, you, we, they and does not (doesn’t) with he, she, it. Then use the base verb. (You studied this in Chapter 5.)<\/p><div class=\"tw\"><table><tr><th>Subject<\/th><th>Negative<\/th><th>Example<\/th><\/tr><tr><td>I / you / we / they<\/td><td>do not (don’t) + base verb<\/td><td>We do not sell fish.<\/td><\/tr><tr><td>he / she / it<\/td><td>does not (doesn’t) + base verb<\/td><td>She does not sell fish.<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>They do not eat meat.<\/td><td>Ba sa cin nama.<\/td><\/tr><tr><td>Musa does not work on Friday.<\/td><td>Musa ba ya aiki ranar Juma’a.<\/td><\/tr><tr><td>I do not have a car.<\/td><td>Ba ni da mota.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>He does not have a bicycle.<\/td><td>Ba shi da keke.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Remember<\/b><br>After does not, the verb has no -s: “She does not like rice”, not “She does not likes rice”.<\/div><h2>10.4 Negatives in the Present Continuous<\/h2><p>Use am/is/are + not + verb-ing.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I am not selling fish now.<\/td><td>Yanzu ba na sayar da kifi.<\/td><\/tr><tr><td>Musa is not working today.<\/td><td>Musa ba ya aiki yau.<\/td><\/tr><tr><td>They are not playing.<\/td><td>Ba sa wasa.<\/td><\/tr><\/table><\/div><h2>10.5 Short Forms<\/h2><div class=\"tw\"><table><tr><th>Full form<\/th><th>Short form<\/th><th>Example<\/th><\/tr><tr><td>I am not<\/td><td>I’m not<\/td><td>I’m not tired.<\/td><\/tr><tr><td>is not<\/td><td>isn’t<\/td><td>He isn’t at home.<\/td><\/tr><tr><td>are not<\/td><td>aren’t<\/td><td>They aren’t farmers.<\/td><\/tr><tr><td>do not<\/td><td>don’t<\/td><td>We don’t sell fish.<\/td><\/tr><tr><td>does not<\/td><td>doesn’t<\/td><td>She doesn’t like meat.<\/td><\/tr><\/table><\/div><p>Always write the apostrophe: don’t, not “dont”. In formal writing, such as a letter or an exam, it is better to use the full form.<\/p>", "<h2>10.6 Negative Commands<\/h2><p>To tell someone not to do something, use Do not or Don’t + base verb. (Hausa uses kada.)<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Do not run in the class.<\/td><td>Kada ka yi gudu a aji.<\/td><\/tr><tr><td>Do not forget your book.<\/td><td>Kada ka manta da littafinka.<\/td><\/tr><tr><td>Do not be late.<\/td><td>Kada ka makara.<\/td><\/tr><tr><td>Please do not make noise.<\/td><td>Don Allah kada ku yi hayaniya.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Bayani da Hausa (Hausa Explanation)<\/b><br>A Hausa, “kada ka” (ga namiji), “kada ki” (ga mace), da “kada ku” (ga mutane da yawa) suna nuna hani. A Turanci, Do not ko Don’t ɗaya ne ga kowa.<\/div><h2>10.7 No, Any, Never, Nobody, and Nothing<\/h2><p>No and not any No + noun means “not any”. These pairs have the same meaning.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>There is no water. = There isn’t any water.<\/td><td>Babu ruwa.<\/td><\/tr><tr><td>I have no money. = I do not have any money.<\/td><td>Ba ni da kuɗi.<\/td><\/tr><tr><td>There are no eggs. = There aren’t any eggs.<\/td><td>Babu ƙwai.<\/td><\/tr><\/table><\/div><p>Never Never means “not at any time”. It is a negative word, so the verb stays positive.<\/p>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>She never comes late.<\/td><td>Ba ta taɓa zuwa a makare ba.<\/td><\/tr><tr><td>I never eat meat.<\/td><td>Ba na taɓa cin nama ba.<\/td><\/tr><\/table><\/div><p>Some → any (and nobody, nothing)<\/p><div class=\"tw\"><table><tr><th>Positive<\/th><th>Negative (with not)<\/th><th>Negative (one word)<\/th><\/tr><tr><td>I want something.<\/td><td>I do not want anything.<\/td><td>I want nothing.<\/td><\/tr><tr><td>Someone is at home.<\/td><td>There is not anyone at home.<\/td><td>Nobody is at home.<\/td><\/tr><tr><td>She sees someone.<\/td><td>She does not see anyone.<\/td><td>She sees nobody.<\/td><\/tr><\/table><\/div><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>I do not want anything.<\/td><td>Ba na son komai.<\/td><\/tr><tr><td>Nobody is at home.<\/td><td>Babu kowa a gida.<\/td><\/tr><tr><td>I have nothing.<\/td><td>Ba ni da komai.<\/td><\/tr><tr><td>She does not see anyone.<\/td><td>Ba ta ganin kowa.<\/td><\/tr><\/table><\/div><div class=\"box\"><b>Only one negative in English<\/b><br>Hausa can use two negative words together (Ba ni da komai). In English we use only one negative: I do not have anything or I have nothing. We do not say “I do not have nothing”.<\/div><h2>10.8 Negatives in Daily Life<\/h2><p>A customer asks for things the trader does not have. Read it aloud.<\/p><div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Customer: Do you have eggs?<\/td><td>Mai saye: Kuna da ƙwai?<\/td><\/tr><tr><td>Trader: No, I am sorry. We do not have eggs today.<\/td><td>Ɗan kasuwa: A’a, yi haƙuri. Ba mu da ƙwai yau.<\/td><\/tr><\/table><\/div>", "<div class=\"tw\"><table><tr><th>English<\/th><th>Hausa<\/th><\/tr><tr><td>Customer: Is there any milk?<\/td><td>Mai saye: Akwai madara?<\/td><\/tr><tr><td>Trader: There is no milk, but we have sugar.<\/td><td>Ɗan kasuwa: Babu madara, amma muna da sukari.<\/td><\/tr><tr><td>Customer: That is fine. I do not need sugar today.<\/td><td>Mai saye: Ba komai. Ba na buƙatar sukari yau.<\/td><\/tr><\/table><\/div><h2>10.9 Common Mistakes and Corrections<\/h2><div class=\"tw\"><table><tr><th>Wrong<\/th><th>Correct<\/th><th>Why?<\/th><\/tr><tr><td>He not sell fish.<\/td><td>He does not sell fish.<\/td><td>Use does not before the verb.<\/td><\/tr><tr><td>She doesn’t sells fish.<\/td><td>She doesn’t sell fish.<\/td><td>After doesn’t, no -s.<\/td><\/tr><tr><td>I not have a phone.<\/td><td>I do not have a phone.<\/td><td>Use do not with “have”.<\/td><\/tr><tr><td>She don’t like rice.<\/td><td>She doesn’t like rice.<\/td><td>Use doesn’t with she.<\/td><\/tr><tr><td>I don’t have nothing.<\/td><td>I don’t have anything. / I have nothing.<\/td><td>Only one negative.<\/td><\/tr><tr><td>Nobody don’t know the answer.<\/td><td>Nobody knows the answer.<\/td><td>“Nobody” is already negative.<\/td><\/tr><tr><td>They are not farmer.<\/td><td>They are not farmers.<\/td><td>Plural noun after “they”.<\/td><\/tr><tr><td>I am not agree.<\/td><td>I do not agree.<\/td><td>“Agree” is a verb: use do not.<\/td><\/tr><\/table><\/div><h2>10.10 Guided Practice<\/h2><p>Make Musa sells rice negative.<\/p><p>• The subject is Musa (= he), so use does not.<\/p><p>• The verb loses its -s: sell.<\/p><p>• Result: Musa does not sell rice. (or: Musa doesn’t sell rice.)<\/p>", "<p>Now make I want something negative: I do not want anything.<\/p><h2>10.11 Exercises<\/h2><p>Exercise 10A: Negatives with be Make each sentence negative. Use the full form.<br>1. I am a driver.<br>2. The market is big.<br>3. They are at school.<br>4. This bag is mine.<br>5. We are farmers.<\/p><p>Exercise 10B: Negatives with do/does Make each sentence negative. Use the full form.<br>1. She sells fish.<br>2. They live in Kano.<br>3. I like meat.<br>4. Musa works on Friday.<br>5. We have a car.<br>6. The shop opens on Sunday.<\/p><p>Exercise 10C: Short forms Write the short form.<br>1. do not<br>2. does not<br>3. is not<br>4. are not<br>5. I am not<\/p><p>Exercise 10D: Choose the correct form<br>1. She (don’t / doesn’t) eat meat.<br>2. They (aren’t / isn’t) in the shop.<br>3. I (don’t / doesn’t) have a phone.<br>4. Musa (isn’t / aren’t) tired.<br>5. We (don’t / doesn’t) sell fish.<\/p>", "<p>Exercise 10E: Negative commands Write a negative command.<br>1. Run in the class.<br>2. Forget your book.<br>3. Be late.<br>4. Make noise.<br>5. Open the door.<\/p><p>Exercise 10F: Some, any, no, never Make each sentence negative. Follow the hint.<br>1. I want something. (use anything)<br>2. There is some water. (use no)<br>3. Sh
